<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 64px 24px 80px;
        }

        header {
            margin-bottom: 48px;
        }

        .site-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .tools-list {
            display: flex;
            flex-direction: column;
        }

        .tool-item {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            padding: 11px 0;
            text-decoration: none;
            color: #fff;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            align-items: baseline;
        }

        .tool-item:last-child {
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .tool-title {
            font-size: 13px;
            font-weight: 500;
            transition: opacity 0.15s;
        }

        .tool-item:hover .tool-title {
            opacity: 0.5;
        }

        .tool-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.38);
        }

        @media (max-width: 480px) {
            .tool-item {
                grid-template-columns: 1fr;
                gap: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="site-title">lab</h1>
        </header>
        <div class="tools-list" id="tools-list"></div>
    </div>
    <script>
        async function loadTools() {
            try {
                const res = await fetch('./tools.json');
                const data = await res.json();
                const list = document.getElementById('tools-list');
                data.tools.forEach(tool => {
                    const a = document.createElement('a');
                    a.href = tool.path;
                    a.className = 'tool-item';
                    a.innerHTML = `<span class="tool-title">${tool.title}</span><span class="tool-description">${tool.description}</span>`;
                    list.appendChild(a);
                });
            } catch (e) {
                console.error(e);
            }
        }
        loadTools();
    </script>
</body>
</html>
