<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Mock</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#ffffff; --header-border:#ededed; --text:#111111; --sub:#8a8f96;
    --in-bubble:#eceef0; --in-text:#111111;
    --out-bubble:#4ca771; --out-text:#ffffff;
    --bar:#ffffff; --icon:#1a1a1a;
  }
  body.dark{
    --bg:#10141a; --header-border:#262c34; --text:#f2f3f5; --sub:#9aa0a8;
    --in-bubble:#222932; --in-text:#f2f3f5;
    --out-bubble:#4ca771; --out-text:#ffffff;
    --bar:#10141a; --icon:#f2f3f5;
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Hiragino Sans","Yu Gothic UI",sans-serif;
    background:#444; display:flex; justify-content:center; color:var(--text); transition:background .2s;
  }
  .phone{
    width:100%; max-width:420px; height:100vh; max-height:920px;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; overflow:hidden; transition:background .2s;
  }
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 24px 4px; font-size:15px; font-weight:600; flex-shrink:0; color:var(--text);
  }
  .sb-right{ display:flex; align-items:center; gap:5px; color:var(--text); }
  .sb-right svg{ display:block; }
  .bat-wrap{ display:flex; align-items:center; gap:1px; }
  .bat-body{ width:22px; height:11px; border:1px solid var(--text); border-radius:3px; padding:1px; display:flex; }
  .bat-fill{ height:100%; width:30%; background:var(--text); border-radius:1px; }
  .bat-cap{ width:1.5px; height:4px; background:var(--text); border-radius:0 1px 1px 0; }
  .header{
    display:flex; align-items:center; gap:12px;
    padding:6px 14px 10px; border-bottom:1px solid var(--header-border); flex-shrink:0;
  }
  .back{ width:24px; height:24px; color:var(--icon); flex-shrink:0; cursor:pointer; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,#4ca771,#2f7d52);
    flex-shrink:0; overflow:hidden; background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; font-weight:600; color:#fff; font-size:16px;
  }
  .h-name{ flex:1; font-size:17px; font-weight:600; }
  .h-icons{ display:flex; gap:20px; color:var(--icon); }
  .h-icons svg{ width:24px; height:24px; }
  .chat{ flex:1; min-height:0; overflow-y:auto; padding:14px 14px 8px; display:flex; flex-direction:column; gap:2px; }
  .day{ text-align:center; font-size:12px; color:var(--sub); margin:14px 0 8px; font-weight:600; }
  .row{ display:flex; max-width:75%; margin-bottom:2px; }
  .row.out{ align-self:flex-end; justify-content:flex-end; }
  .row.in{ align-self:flex-start; }
  .row.gap{ margin-top:10px; }
  .bubble{
    position:relative; padding:9px 14px; font-size:15.5px; line-height:1.4;
    word-break:break-word; white-space:pre-wrap; cursor:text; outline:none; min-width:30px;
  }
  .out .bubble{ background:var(--out-bubble); color:var(--out-text); border-radius:20px; }
  .in .bubble{ background:var(--in-bubble); color:var(--in-text); border-radius:20px; }
  .time{ font-size:11px; color:var(--sub); align-self:flex-end; margin:0 4px 3px; white-space:nowrap; display:flex; align-items:center; gap:2px; }
  .out .time{ order:-1; }
  .time-val{ outline:none; cursor:text; border-radius:3px; padding:1px 2px; }
  .time-val:focus{ background:rgba(128,128,128,.15); }
  .check{ color:var(--out-bubble); user-select:none; cursor:pointer; }
  .check.unread{ color:var(--sub) !important; }
  .hide-time .time{ display:none; }
  .typing-toggle{ background:transparent; border:1px dashed var(--header-border); border-radius:14px; padding:5px 12px; color:var(--sub); font-size:12px; font-weight:600; cursor:pointer; text-align:left; transition:.15s; }
  .typing-toggle.active{ border-color:var(--out-bubble); color:var(--out-bubble); border-style:solid; }
  .typing-dot{ width:7px; height:7px; border-radius:50%; background:var(--sub); display:inline-block; animation:tdot 1.2s infinite; }
  .typing-dot:nth-child(2){ animation-delay:.2s; }
  .typing-dot:nth-child(3){ animation-delay:.4s; }
  @keyframes tdot{ 0%,60%,100%{ transform:translateY(0); opacity:.4; } 30%{ transform:translateY(-5px); opacity:1; } }
  @keyframes bubbleInL{ 0%{ opacity:0; transform:translateX(-26px) translateY(16px) scale(0.72); } 58%{ opacity:1; transform:translateX(5px) translateY(-4px) scale(1.06); } 100%{ opacity:1; transform:none; } }
  @keyframes bubbleInR{ 0%{ opacity:0; transform:translateX(26px) translateY(16px) scale(0.72); } 58%{ opacity:1; transform:translateX(-5px) translateY(-4px) scale(1.06); } 100%{ opacity:1; transform:none; } }
  .row.in.new-msg{ animation:bubbleInL .52s cubic-bezier(.18,1.4,.36,1) both; }
  .row.out.new-msg{ animation:bubbleInR .52s cubic-bezier(.18,1.4,.36,1) both; }
  .del{
    position:absolute; top:-6px; width:19px; height:19px; border-radius:50%;
    background:#ed4956; color:#fff; font-size:12px; line-height:19px; text-align:center;
    cursor:pointer; opacity:0; transition:opacity .15s; border:2px solid var(--bg); z-index:2;
  }
  .out .del{ left:-6px; } .in .del{ right:-6px; }
  .row:hover .del{ opacity:1; }
  @media (hover:none){ .del{ opacity:.85; } }
  .composer{ flex-shrink:0; padding:8px 12px; display:flex; flex-direction:column; gap:7px; background:var(--bar); }
  .dir-row{ display:flex; gap:6px; }
  .dir-btn{
    flex:1; padding:6px; border:1px solid var(--header-border); background:transparent;
    color:var(--sub); border-radius:18px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .dir-btn.active.in{ background:var(--in-bubble); color:var(--text); }
  .dir-btn.active.out{ background:var(--out-bubble); color:#fff; border-color:var(--out-bubble); }
  .input-row{
    display:flex; gap:6px; align-items:center;
    border:1px solid var(--header-border); border-radius:22px; padding:4px 6px 4px 16px;
  }
  .input-row textarea{
    flex:1; resize:none; background:transparent; border:none; color:var(--text);
    font-size:15px; outline:none; line-height:1.4; max-height:140px; font-family:inherit; padding:6px 0;
  }
  .input-row textarea::placeholder{ color:var(--sub); }
  .send-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--out-bubble);
    color:#fff; font-size:16px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .tabbar{
    flex-shrink:0; display:flex; justify-content:space-around; align-items:center;
    padding:12px 0 22px; border-top:1px solid var(--header-border); color:var(--icon);
  }
  .tabbar svg{ width:25px; height:25px; }
  .fab{
    position:absolute; top:8px; right:10px; z-index:30;
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(120,120,120,.85); color:#fff; font-size:16px;
  }
  .toolbar{
    position:absolute; top:48px; right:10px; z-index:30;
    display:none; flex-direction:column; gap:6px;
  }
  .toolbar.open{ display:flex; }
  .toolbar button{
    border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600;
    cursor:pointer; background:rgba(120,120,120,.92); color:#fff; white-space:nowrap; text-align:left;
  }
  .overlay{ position:absolute; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:40; padding:18px; }
  .overlay.open{ display:flex; }
  .panel{ width:100%; background:var(--bg); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:15px; max-height:90%; overflow-y:auto; border:1px solid var(--header-border); }
  .panel h3{ font-size:16px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:13px; color:var(--sub); }
  .field input[type=text],.field input[type=time]{ background:transparent; border:1px solid var(--header-border); border-radius:8px; padding:9px 11px; color:var(--text); font-size:15px; outline:none; }
  input[type=range]{ width:100%; accent-color:var(--out-bubble); margin:4px 0; }
  .set-select{ -webkit-appearance:none; appearance:none; background:transparent; border:1px solid var(--header-border); border-radius:8px; padding:9px 11px; color:var(--text); font-size:15px; outline:none; width:100%; }
  #sbTime{ cursor:text; outline:none; border-radius:3px; padding:0 1px; }
  #sbTime:focus{ background:rgba(128,128,128,.15); }
  .bat-fill.low{ background:#e84040 !important; }
  .bat-fill.mid{ background:#e8b040 !important; }
  .hide-statusbar .statusbar{ display:none; }
  .colors{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{ width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
  .swatch.sel{ border-color:var(--out-bubble); }
  .theme-swatch{ width:34px; height:34px; border-radius:50%; cursor:pointer; outline:2px solid transparent; outline-offset:2px; flex-shrink:0; }
  .theme-swatch.sel{ outline-color:var(--text); }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .switch{ position:relative; width:46px; height:26px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:#c7c7c7; border-radius:26px; transition:.2s; cursor:pointer; }
  .slider:before{ content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:var(--out-bubble); }
  .switch input:checked + .slider:before{ transform:translateX(20px); }
  .panel-btns{ display:flex; gap:8px; margin-top:4px; }
  .panel-btns button{ flex:1; padding:11px; border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; color:#fff; }
  .upload-btn{ background:#8e8e8e; } .done-btn{ background:var(--out-bubble); }
  .file-name{ font-size:12px; color:var(--sub); }
  .sec-label{ font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.5px; margin-top:4px; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <button class="fab" id="fab" onclick="toggleToolbar()">⚙</button>
  <div class="toolbar" id="toolbar">
    <button onclick="toggleDark()" id="darkBtn">🌙 ダーク</button>
    <button onclick="openPanel()">⚙ 設定</button>
    <button onclick="loadSample()">📄 サンプル</button>
    <button onclick="capture()">📷 画像保存</button>
    <button onclick="replayWithHide()">▶ 隠して再生</button>
    <button onclick="hideUI()">🙈 UIを隠す</button>
  </div>

  <div class="statusbar" id="statusbarEl">
    <span id="sbTime" contenteditable="true" spellcheck="false">22:30</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect id="sig1" x="0" y="8" width="3" height="4" rx="1"/><rect id="sig2" x="5" y="5" width="3" height="7" rx="1"/><rect id="sig3" x="10" y="2.5" width="3" height="9.5" rx="1"/><rect id="sig4" x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg id="wifiSvg" width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-linecap="round">
        <path id="wf1" stroke-width="1.4" d="M2.1,4.1 A9,9 0 0 1 14.9,4.1"/>
        <path id="wf2" stroke-width="1.4" d="M4.6,6.6 A5.5,5.5 0 0 1 12.4,6.6"/>
        <path id="wf3" stroke-width="1.4" d="M6.7,8.7 A2.5,2.5 0 0 1 10.3,8.7"/>
        <circle id="wfdot" cx="8.5" cy="10.5" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
      <span class="bat-wrap"><span class="bat-body"><span class="bat-fill" id="batFill"></span></span><span class="bat-cap"></span></span>
    </span>
  </div>

  <div class="header" id="headerEl">
    <svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <div class="avatar" id="avatar">U</div>
    <span class="h-name" id="contactName">USER</span>
    <div class="h-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="composer" id="composer">
    <div class="dir-row">
      <button class="dir-btn in" id="dirIn" onclick="setDir('in')">相手から（受信）</button>
      <button class="dir-btn out active" id="dirOut" onclick="setDir('out')">自分から（送信）</button>
    </div>
    <button id="typingBtn" class="typing-toggle" onclick="toggleTyping()">💬 入力中を表示</button>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="メッセージ"></textarea>
      <button class="send-btn" onclick="send()">➤</button>
    </div>
  </div>

  <div class="tabbar" id="tabbar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-4v-6H8v6H4a1 1 0 0 1-1-1V10.5z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="8" r="4"/><path d="M4 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 9.5 9.5 0 0 1-4-.9L3 21l1.9-5.5a9.5 9.5 0 0 1-.9-4A8.38 8.38 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h3>設定</h3>
      <div class="field"><label>相手の名前</label><input type="text" id="setName" value="USER"></div>
      <div class="field"><label>テーマカラー（送信バブル）</label><div class="colors" id="themeRow"></div></div>
      <div class="field"><label>最初のメッセージの時刻</label><input type="time" id="setFirstTime" value="22:30"></div>
      <div class="toggle-row"><label>起動時に日時を現在時刻へ更新</label>
        <span class="switch"><input type="checkbox" id="autoTimeToggle" checked><span class="slider" onclick="this.previousElementSibling.click()"></span></span>
      </div>
      <div class="field"><label>セルラー電波</label>
        <select id="setSig" class="set-select">
          <option value="0">圏外</option>
          <option value="1">弱（1本）</option>
          <option value="2">普通（2本）</option>
          <option value="3">強（3本）</option>
          <option value="4" selected>最強（4本）</option>
        </select>
      </div>
      <div class="field"><label>Wi-Fi</label>
        <select id="setWifi" class="set-select">
          <option value="0">非表示</option>
          <option value="1">弱</option>
          <option value="2">普通</option>
          <option value="3" selected>強</option>
        </select>
      </div>
      <div class="field"><label>バッテリー残量　<span id="setBatVal">30%</span></label>
        <input type="range" id="setBat" min="0" max="100" value="30">
      </div>
      <div class="toggle-row"><label>ステータスバーを表示</label>
        <span class="switch"><input type="checkbox" id="sbToggle" checked><span class="slider" onclick="this.previousElementSibling.click()"></span></span>
      </div>
      <div class="field"><label>アイコンの色</label><div class="colors" id="colorRow"></div></div>
      <div class="field">
        <label>アイコン画像</label>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="panel-btns">
          <button class="upload-btn" onclick="document.getElementById('fileInput').click()">画像を選ぶ</button>
          <button class="upload-btn" onclick="clearImg()">画像を消す</button>
        </div>
        <span class="file-name" id="fileName"></span>
      </div>
      <div class="toggle-row"><label>各メッセージの時刻を表示</label>
        <span class="switch"><input type="checkbox" id="timeToggle" checked><span class="slider" onclick="this.previousElementSibling.click()"></span></span>
      </div>
      <div class="toggle-row"><label>既読チェック（送信側）</label>
        <span class="switch"><input type="checkbox" id="checkToggle" checked><span class="slider" onclick="this.previousElementSibling.click()"></span></span>
      </div>
      <div class="sec-label">データ</div>
      <div class="panel-btns">
        <button class="upload-btn" onclick="loadSample()">📄 サンプルを表示</button>
        <button class="upload-btn" onclick="resetAll()">↺ リセット</button>
      </div>
      <div class="panel-btns"><button class="done-btn" onclick="closePanel()">完了</button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const chat=document.getElementById('chat');
  const avatar=document.getElementById('avatar');
  const input=document.getElementById('input');
  let avatarColor='linear-gradient(135deg,#4ca771,#2f7d52)';
  let avatarImg=null;
  let dir='out';

  // モック時刻（設定された初手時刻を起点に3〜5分ずつ進める）
  function parseTimeInput(v){ const p=v.split(':').map(Number); return (p.length===2&&!isNaN(p[0])&&!isNaN(p[1]))? p[0]*60+p[1] : 22*60+30; }
  let mockMinutes=22*60+30;
  function formatMockTime(m){ const h=Math.floor(m/60)%24; const min=m%60; return h.toString().padStart(2,'0')+':'+min.toString().padStart(2,'0'); }
  function advanceMockTime(){ mockMinutes+=Math.floor(Math.random()*3)+3; return formatMockTime(mockMinutes); }
  function updateStatusBarTime(){ const offset=Math.floor(Math.random()*5)+1; document.getElementById('sbTime').textContent=formatMockTime(mockMinutes+offset); }
  function updateSignal(lv){ ['sig1','sig2','sig3','sig4'].forEach((id,i)=>{ document.getElementById(id).style.opacity=i<lv?'1':'0.2'; }); }
  function updateWifi(lv){ const svg=document.getElementById('wifiSvg'); svg.style.display=lv===0?'none':''; ['wf1','wf2','wf3'].forEach((id,i)=>{ document.getElementById(id).style.opacity=i>=(3-lv)?'1':'0.2'; }); }
  function updateBattery(pct){ const fill=document.getElementById('batFill'); fill.style.width=pct+'%'; fill.className='bat-fill'+(pct<=10?' low':pct<=30?' mid':''); document.getElementById('setBat').value=pct; document.getElementById('setBatVal').textContent=pct+'%'; }

  // テーマカラー
  const themeColors=[
    '#4ca771','#3797f0','#17c1b7','#7c4dff','#e05f8a','#e8923a'
  ];
  let currentTheme=themeColors[0];
  function applyTheme(color){
    currentTheme=color;
    document.documentElement.style.setProperty('--out-bubble',color);
    if(document.body.classList.contains('dark'))
      document.body.style.setProperty('--out-bubble',color);
  }
  const themeRow=document.getElementById('themeRow');
  themeColors.forEach((c,i)=>{
    const s=document.createElement('div'); s.className='theme-swatch'+(i===0?' sel':''); s.style.background=c;
    s.onclick=()=>{
      applyTheme(c);
      document.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('sel')); s.classList.add('sel');
      scheduleSave();
    };
    themeRow.appendChild(s);
  });

  // アバターカラーパレット
  const palette=[
    'linear-gradient(135deg,#4ca771,#2f7d52)',
    'linear-gradient(135deg,#5aa0e0,#3a6ea5)',
    'linear-gradient(135deg,#e0915a,#c9603b)',
    'linear-gradient(135deg,#b06ef7,#5e35b1)',
    'linear-gradient(135deg,#e06a90,#b03d63)',
    'linear-gradient(135deg,#8d99ae,#43485a)'
  ];

  function makeRow(side,text,time){
    const row=document.createElement('div'); row.className='row '+side;
    const bubble=document.createElement('div'); bubble.className='bubble'; bubble.contentEditable='true'; bubble.textContent=text;

    const tm=document.createElement('span'); tm.className='time';
    const tv=document.createElement('span'); tv.className='time-val'; tv.contentEditable='true'; tv.textContent=time;
    // time-val内でのEnterキー・改行を防ぐ
    tv.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); tv.blur(); } });
    tm.appendChild(tv);
    if(side==='out'){
      const ck=document.createElement('span'); ck.className='check'; ck.textContent='✓';
      if(!document.getElementById('checkToggle').checked) ck.style.display='none';
      ck.title='タップで既読/未読切替';
      ck.addEventListener('click',e=>{ e.stopPropagation(); ck.classList.toggle('unread'); scheduleSave(); });
      tm.appendChild(ck);
    }

    const del=document.createElement('span'); del.className='del'; del.textContent='×';
    del.onclick=(e)=>{e.stopPropagation(); row.remove(); scheduleSave();};
    row.appendChild(bubble); row.appendChild(tm); row.appendChild(del);
    return row;
  }

  function setDir(d){
    dir=d;
    document.getElementById('dirIn').classList.toggle('active',d==='in');
    document.getElementById('dirOut').classList.toggle('active',d==='out');
    input.focus();
  }
  let typingRow=null;
  function toggleTyping(){
    const btn=document.getElementById('typingBtn');
    if(typingRow){ typingRow.remove(); typingRow=null; btn.classList.remove('active'); return; }
    typingRow=document.createElement('div'); typingRow.className='row in';
    const bubble=document.createElement('div'); bubble.className='bubble';
    bubble.style.cssText='display:flex;align-items:center;gap:5px;padding:10px 16px;';
    for(let i=0;i<3;i++){ const d=document.createElement('span'); d.className='typing-dot'; bubble.appendChild(d); }
    typingRow.appendChild(bubble); chat.appendChild(typingRow); typingRow.classList.add('new-msg'); chat.scrollTop=chat.scrollHeight;
    btn.classList.add('active');
  }
  function send(){
    const t=input.value.replace(/\s+$/,''); if(!t.trim()) return;
    const time=advanceMockTime();
    const row=makeRow(dir,t,time);
    const last=typingRow ? typingRow.previousElementSibling : chat.lastElementChild;
    if(last && !last.classList.contains(dir) && !last.classList.contains('day')) row.classList.add('gap');
    if(typingRow) chat.insertBefore(row,typingRow); else chat.appendChild(row);
    row.classList.add('new-msg');
    chat.scrollTop=chat.scrollHeight;
    input.value=''; autoGrow(); input.focus();
    updateStatusBarTime();
    scheduleSave();
  }
  input.addEventListener('keydown',e=>{ /* Enterは改行に任せる */ });
  function autoGrow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px'; chat.scrollTop=chat.scrollHeight; }
  input.addEventListener('input',autoGrow);

  function replayWithHide(){
    hideUI();
    setTimeout(replayLastMsg, 300);
  }
  function replayLastMsg(){
    const rows=[...chat.children].filter(el=>el.classList.contains('row')&&el!==typingRow);
    if(!rows.length) return;
    const last=rows[rows.length-1];
    const tv=last.querySelector('.time-val');
    if(tv) document.getElementById('sbTime').textContent=tv.textContent.trim();
    const isIn=last.classList.contains('in');

    // メッセージを隠す
    last.classList.remove('new-msg');
    last.style.visibility='hidden';
    void last.offsetWidth;
    chat.scrollTop=chat.scrollHeight;

    if(isIn){
      // 受信: タイピングインジケーター表示 → 消える → メッセージ出現
      const hadTyping=!!typingRow;
      let tmpTyping=null;
      if(!hadTyping){
        tmpTyping=document.createElement('div'); tmpTyping.className='row in';
        const bbl=document.createElement('div'); bbl.className='bubble';
        bbl.style.cssText='display:flex;align-items:center;gap:5px;padding:10px 16px;';
        for(let i=0;i<3;i++){ const d=document.createElement('span'); d.className='typing-dot'; bbl.appendChild(d); }
        tmpTyping.appendChild(bbl); chat.appendChild(tmpTyping);
        tmpTyping.classList.add('new-msg');
        chat.scrollTop=chat.scrollHeight;
      }
      setTimeout(()=>{
        if(tmpTyping){ tmpTyping.remove(); tmpTyping=null; }
        setTimeout(()=>{
          last.style.visibility='';
          last.classList.add('new-msg');
          chat.scrollTop=chat.scrollHeight;
        },150);
      },1400);
    } else {
      // 送信: 間をおいてメッセージ出現
      setTimeout(()=>{
        last.style.visibility='';
        last.classList.add('new-msg');
        chat.scrollTop=chat.scrollHeight;
      },400);
    }
  }
  function toggleToolbar(){ document.getElementById('toolbar').classList.toggle('open'); }
  function toggleDark(){
    document.body.classList.toggle('dark');
    document.getElementById('darkBtn').textContent=document.body.classList.contains('dark')?'☀ ライト':'🌙 ダーク';
    // ダーク切替後もテーマカラーを維持
    document.documentElement.style.setProperty('--out-bubble',currentTheme);
    scheduleSave();
  }
  let uiHidden=false;
  function hideUI(){
    uiHidden=true;
    document.getElementById('composer').style.display='none';
    document.getElementById('toolbar').classList.remove('open');
    document.getElementById('fab').style.display='none';
    document.querySelectorAll('.del').forEach(d=>d.style.display='none');
  }
  function showUI(){
    uiHidden=false;
    document.getElementById('composer').style.display='flex';
    document.getElementById('fab').style.display='';
    document.querySelectorAll('.del').forEach(d=>d.style.display='');
  }

  function openPanel(){ document.getElementById('overlay').classList.add('open'); }
  function closePanel(){ document.getElementById('overlay').classList.remove('open'); }

  const setName=document.getElementById('setName');
  setName.addEventListener('input',()=>{
    const v=setName.value||'?';
    document.getElementById('contactName').textContent=v;
    if(!avatarImg) avatar.textContent=(v.trim()[0]||'?');
  });
  document.getElementById('setFirstTime').addEventListener('input',function(){ mockMinutes=parseTimeInput(this.value); updateStatusBarTime(); });
  document.getElementById('setSig').addEventListener('change',function(){ updateSignal(+this.value); });
  document.getElementById('setWifi').addEventListener('change',function(){ updateWifi(+this.value); });
  document.getElementById('setBat').addEventListener('input',function(){ updateBattery(+this.value); });
  document.getElementById('sbToggle').addEventListener('change',function(){ document.getElementById('phone').classList.toggle('hide-statusbar',!this.checked); });
  const sbTimeEl=document.getElementById('sbTime');
  sbTimeEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); sbTimeEl.blur(); } });

  const colorRow=document.getElementById('colorRow');
  palette.forEach((g,i)=>{
    const s=document.createElement('div'); s.className='swatch'+(i===0?' sel':''); s.style.background=g;
    s.onclick=()=>{
      avatarColor=g; avatarImg=null;
      avatar.style.backgroundImage=g; avatar.textContent=(setName.value.trim()[0]||'?');
      document.getElementById('fileName').textContent='';
      document.querySelectorAll('#colorRow .swatch').forEach(x=>x.classList.remove('sel')); s.classList.add('sel');
      scheduleSave();
    };
    colorRow.appendChild(s);
  });

  document.getElementById('fileInput').addEventListener('change',function(e){
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      avatarImg=ev.target.result; avatar.style.backgroundImage='url('+avatarImg+')'; avatar.textContent='';
      document.getElementById('fileName').textContent=f.name;
      document.querySelectorAll('#colorRow .swatch').forEach(x=>x.classList.remove('sel'));
      scheduleSave();
    };
    r.readAsDataURL(f);
  });
  function clearImg(){
    avatarImg=null; avatar.style.backgroundImage=avatarColor;
    avatar.textContent=(setName.value.trim()[0]||'?'); document.getElementById('fileName').textContent='';
    scheduleSave();
  }

  document.getElementById('timeToggle').addEventListener('change',function(){ chat.classList.toggle('hide-time',!this.checked); });
  // Long-press on status bar or header to toggle UI
  let _pt=null,_px=0,_py=0;
  ['statusbarEl','headerEl'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{_px=e.clientX;_py=e.clientY;_pt=setTimeout(()=>{if(navigator.vibrate)navigator.vibrate(20);uiHidden?showUI():hideUI();},600);});
    el.addEventListener('pointerup',()=>clearTimeout(_pt));
    el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-_px,e.clientY-_py)>10)clearTimeout(_pt);});
    el.addEventListener('pointercancel',()=>clearTimeout(_pt));
  });

  updateSignal(4);
  updateWifi(3);
  updateBattery(30);
  updateStatusBarTime();

  document.getElementById('checkToggle').addEventListener('change',function(){
    const show=this.checked;
    document.querySelectorAll('.row.out .check').forEach(ck=>{ ck.style.display=show?'':'none'; });
  });

  /* ===== サンプル / ローカル保存 ===== */
  const LS_KEY='dmmock-state-v1';
  const SAMPLE_TEXT=
'はじめまして！\n'+
'履歴書の送付ありがとうございます😊\n'+
'早速ですが適性検査を実施いたしますので、以下の内容をご確認のうえご参加ください！\n'+
'＊ 日時：明日 18時\n'+
'＊ 場所：○○駅\n'+
'弊社担者が○○駅までお迎えにあがりますので、よろしくお願いいたします！🚶‍♂️🚶‍♀️\n'+
'お忙しいところ恐れ入りますが、ご確認のほどよろしくお願いいたします🙇';

  // 現在時刻ユーティリティ
  function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
  function fmtMin(m){ return formatMockTime(((m%1440)+1440)%1440); }
  function nowHM(){ return fmtMin(nowMinutes()); }

  function sampleState(){
    const t=nowHM();
    return {
      name:'もんめ', theme:themeColors[0], firstTime:t,
      sig:4, wifi:3, bat:30, sbShow:true, sbTime:t,
      avatarColor:palette[0], avatarImg:null,
      showTime:true, showCheck:true, dark:false, autoTime:true,
      msgs:[{ side:'in', text:SAMPLE_TEXT, time:t, unread:false, gap:false }]
    };
  }

  // 保存済みの会話を現在時刻へ寄せる（最後のメッセージ＝今、前後の間隔は維持）
  function retimeState(s){
    const msgs=s.msgs||[];
    if(!msgs.length){ s.firstTime=nowHM(); s.sbTime=nowHM(); return s; }
    const delta=nowMinutes()-parseTimeInput(msgs[msgs.length-1].time||'');
    msgs.forEach(m=>{ m.time=fmtMin(parseTimeInput(m.time||'')+delta); });
    s.firstTime=msgs[0].time;
    s.sbTime=nowHM();
    return s;
  }

  function collectMsgs(){
    return [...chat.children]
      .filter(el=>el.classList.contains('row') && el!==typingRow)
      .map(el=>({
        side: el.classList.contains('out')?'out':'in',
        text: el.querySelector('.bubble') ? el.querySelector('.bubble').textContent : '',
        time: el.querySelector('.time-val') ? el.querySelector('.time-val').textContent.trim() : '',
        unread: !!el.querySelector('.check.unread'),
        gap: el.classList.contains('gap')
      }));
  }

  function currentState(){
    return {
      name:setName.value,
      theme:currentTheme,
      firstTime:document.getElementById('setFirstTime').value,
      sig:+document.getElementById('setSig').value,
      wifi:+document.getElementById('setWifi').value,
      bat:+document.getElementById('setBat').value,
      sbShow:document.getElementById('sbToggle').checked,
      sbTime:document.getElementById('sbTime').textContent.trim(),
      avatarColor, avatarImg,
      showTime:document.getElementById('timeToggle').checked,
      showCheck:document.getElementById('checkToggle').checked,
      autoTime:document.getElementById('autoTimeToggle').checked,
      dark:document.body.classList.contains('dark'),
      msgs:collectMsgs()
    };
  }

  let _saveTimer=null;
  let _restoring=false;
  function save(){
    if(_restoring) return;
    try{ localStorage.setItem(LS_KEY,JSON.stringify(currentState())); }catch(e){}
  }
  function scheduleSave(){ clearTimeout(_saveTimer); _saveTimer=setTimeout(save,250); }

  function applyState(s){
    _restoring=true;

    // 名前 / アバター
    setName.value=s.name;
    document.getElementById('contactName').textContent=s.name||'?';
    avatarColor=s.avatarColor||palette[0];
    avatarImg=s.avatarImg||null;
    if(avatarImg){
      avatar.style.backgroundImage='url('+avatarImg+')'; avatar.textContent='';
      document.querySelectorAll('#colorRow .swatch').forEach(x=>x.classList.remove('sel'));
    }else{
      avatar.style.backgroundImage=avatarColor;
      avatar.textContent=((s.name||'?').trim()[0]||'?');
      const ci=palette.indexOf(avatarColor);
      document.querySelectorAll('#colorRow .swatch').forEach((x,i)=>x.classList.toggle('sel',i===ci));
    }
    document.getElementById('fileName').textContent='';

    // テーマカラー
    applyTheme(s.theme||themeColors[0]);
    const ti=themeColors.indexOf(currentTheme);
    document.querySelectorAll('.theme-swatch').forEach((x,i)=>x.classList.toggle('sel',i===ti));

    // ダーク
    const wantDark=!!s.dark;
    document.body.classList.toggle('dark',wantDark);
    document.getElementById('darkBtn').textContent=wantDark?'☀ ライト':'🌙 ダーク';
    document.documentElement.style.setProperty('--out-bubble',currentTheme);

    // ステータスバー
    document.getElementById('setFirstTime').value=s.firstTime||'22:30';
    mockMinutes=parseTimeInput(s.firstTime||'22:30');
    document.getElementById('setSig').value=String(s.sig);   updateSignal(s.sig);
    document.getElementById('setWifi').value=String(s.wifi); updateWifi(s.wifi);
    updateBattery(s.bat);
    document.getElementById('sbToggle').checked=!!s.sbShow;
    document.getElementById('phone').classList.toggle('hide-statusbar',!s.sbShow);
    document.getElementById('sbTime').textContent=s.sbTime||formatMockTime(mockMinutes);

    // 表示オプション（makeRowより先に反映させる）
    document.getElementById('timeToggle').checked=!!s.showTime;
    chat.classList.toggle('hide-time',!s.showTime);
    document.getElementById('checkToggle').checked=!!s.showCheck;
    document.getElementById('autoTimeToggle').checked=s.autoTime!==false;

    // メッセージ
    if(typingRow){ typingRow.remove(); typingRow=null; }
    document.getElementById('typingBtn').classList.remove('active');
    chat.innerHTML='';
    (s.msgs||[]).forEach(m=>{
      const row=makeRow(m.side,m.text,m.time);
      if(m.gap) row.classList.add('gap');
      if(m.unread){ const ck=row.querySelector('.check'); if(ck) ck.classList.add('unread'); }
      chat.appendChild(row);
    });
    // 最終メッセージの時刻を起点に次のメッセージ時刻を進める
    const msgs=s.msgs||[];
    if(msgs.length){
      const lastT=parseTimeInput(msgs[msgs.length-1].time||'');
      if(!isNaN(lastT)) mockMinutes=lastT;
    }
    chat.scrollTop=chat.scrollHeight;

    _restoring=false;
  }

  function loadSample(){
    applyState(sampleState());
    save();
    closePanel();
    document.getElementById('toolbar').classList.remove('open');
  }
  function resetAll(){
    if(!confirm('編集内容を消してサンプルに戻します。よろしいですか？')) return;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    loadSample();
  }

  // 変更を自動保存
  chat.addEventListener('input',scheduleSave);
  chat.addEventListener('blur',scheduleSave,true);
  document.getElementById('sbTime').addEventListener('input',scheduleSave);
  const panelEl=document.querySelector('.panel');
  panelEl.addEventListener('input',scheduleSave);
  panelEl.addEventListener('change',scheduleSave);

  // 初期表示：保存があれば復元、なければサンプル
  (function init(){
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
    let st=sampleState();
    if(saved && Array.isArray(saved.msgs)) st=(saved.autoTime!==false)?retimeState(saved):saved;
    applyState(st);
    save();
  })();

  function capture(){
    document.querySelectorAll('.del').forEach(d=>d.style.display='none');
    const composer=document.getElementById('composer'); const fab=document.getElementById('fab'); const toolbar=document.getElementById('toolbar');
    const cDisp=composer.style.display;
    composer.style.display='none'; fab.style.display='none'; toolbar.classList.remove('open');
    const darkBg=document.body.classList.contains('dark')?'#10141a':'#fff';
    html2canvas(document.getElementById('phone'),{backgroundColor:darkBg,scale:2}).then(c=>{
      const restore=()=>{
        if(!uiHidden){ document.querySelectorAll('.del').forEach(d=>d.style.display=''); composer.style.display=cDisp||'flex'; }
        fab.style.display='';
      };
      c.toBlob(async (blob)=>{
        const file=new File([blob],'message.png',{type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          try{ await navigator.share({files:[file]}); } catch(e){}
          restore(); return;
        }
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.download='message.png'; a.href=url; a.click();
        URL.revokeObjectURL(url); restore();
      },'image/png');
    });
  }
</script>
</body>
</html>
