<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Type</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 48px;
            gap: 20px;
        }

        header {
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        h1 {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.14em;
        }

        .hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.32);
            letter-spacing: 0.06em;
        }

        .stage {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .panel {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .row label {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.42);
            width: 74px;
            flex-shrink: 0;
        }

        .value {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 20px;
            background: transparent;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 1px;
            background: rgba(255, 255, 255, 0.22);
        }

        input[type=range]::-moz-range-track {
            height: 1px;
            background: rgba(255, 255, 255, 0.22);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            margin-top: -6.5px;
        }

        input[type=range]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            background: #fff;
        }

        .seg {
            display: flex;
            gap: 4px;
        }

        .seg button {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.12s;
        }

        .seg button:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .seg button.wide {
            width: 64px;
            letter-spacing: 0.08em;
        }

        .seg button.on {
            background: #fff;
            border-color: #fff;
            color: #0f0f0f;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .actions button {
            padding: 11px 0;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: transparent;
            color: rgba(255, 255, 255, 0.82);
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.1em;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.12s;
        }

        .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .actions button:active {
            background: rgba(255, 255, 255, 0.18);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(8px);
            background: #fff;
            color: #0f0f0f;
            font-size: 10px;
            letter-spacing: 0.08em;
            padding: 8px 14px;
            border-radius: 3px;
            opacity: 0;
            pointer-events: none;
            transition: 0.18s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <header>
        <h1>BLOB TYPE</h1>
        <span class="hint">tap cell / gap · hold to resize</span>
    </header>

    <div class="stage">
        <canvas id="cv"></canvas>
    </div>

    <div class="panel">
        <div class="row">
            <label>STYLE</label>
            <div class="seg" id="styleSeg"></div>
        </div>
        <div class="row">
            <label>WEIGHT</label>
            <input type="range" id="weight" min="0" max="1000" value="620">
            <span class="value" id="weightVal">62</span>
        </div>
        <div class="row" id="smoothRow">
            <label>SMOOTH</label>
            <input type="range" id="smooth" min="0" max="1000" value="250">
            <span class="value" id="smoothVal">25</span>
        </div>
        <div class="row" id="carveRow">
            <label>CARVE</label>
            <input type="range" id="carve" min="0" max="1000" value="500">
            <span class="value" id="carveVal">50</span>
        </div>
        <div class="row">
            <label>COLS</label>
            <div class="seg" id="colsSeg"></div>
            <label style="width:auto;margin-left:12px">ROWS</label>
            <div class="seg" id="rowsSeg"></div>
        </div>
        <div class="actions">
            <button id="btnClear">CLEAR</button>
            <button id="btnCopy">COPY SVG</button>
            <button id="btnSvg">SVG</button>
            <button id="btnPng">PNG</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== モデル =====================================================
        // セル間隔を 1 とする単位系で全部計算する。書き出し時だけ 100 倍する。
        const S = 1;
        const THRESHOLD = 1.0;
        const RES = 12;          // セル間隔あたりのサンプル数
        const MARGIN = 1;        // サンプリング領域の余白（セル）
        // BLOB（メタボール）用
        const BLOB_MIN = 0.30, BLOB_MAX = 0.54;
        const FADE_IN = 1.5;     // ここから寄与を落とし始める（セル単位）
        const FADE_OUT = 2.1;    // ここで寄与ゼロ
        // EDGE（距離場）用
        const EDGE_MIN = 0.14, EDGE_MAX = 0.72;
        const K_MAX = 0.30;      // 凹コーナーのフィレット半径の上限
        const CARVE_MAX = 0.62;  // OFF セルの円で削る半径の上限
        const SIZE_MIN = 0.25, SIZE_MAX = 2.2;

        const ON = 1, OFF = -1, NEUTRAL = 0;
        const NEXT = { 0: ON, 1: OFF, '-1': NEUTRAL };

        let cols = 4, rows = 5;
        let grid = new Map();    // "i,j" -> { v: ON|OFF, s: サイズ倍率 }。無ければ NEUTRAL
        let links = new Map();   // "i,j|i,j" -> true/false。自動判定の上書きだけ持つ
        let mode = 'edge';       // 'edge' | 'blob'
        let radius = 0.40;
        let smoothK = 0.09;
        let carve = 0.35;
        let loops = [];          // 平滑化後のポリライン（プレビューと書き出しで共用）

        const key = (i, j) => i + ',' + j;
        const stateAt = k => { const c = grid.get(k); return c ? c.v : NEUTRAL; };
        const sizeAt = k => { const c = grid.get(k); return c ? c.s : 1; };
        const isOn = (i, j) => stateAt(key(i, j)) === ON;
        function setCell(k, v, s) {
            if (v === NEUTRAL) grid.delete(k);
            else grid.set(k, { v, s: s === undefined ? sizeAt(k) : s });
        }
        const linkKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
        // 隣接した ON どうしは既定で繋がる。切りたい／繋ぎたいところだけ上書きする
        function linked(i, j, i2, j2) {
            if (!isOn(i, j) || !isOn(i2, j2)) return false;
            const lk = linkKey(key(i, j), key(i2, j2));
            return links.has(lk) ? links.get(lk) : true;
        }

        // ===== プリミティブ ===============================================
        // EDGE：ON セルを円、繋がったペアを線分として持ち、その距離場が図形になる。
        //       メタボールと違って辺が直線になり、角だけが円弧になる。
        //       セルごとに半径が違うので、線分は両端で太さの変わる円錐台。
        //       OFF セルの円はそこから引く。NEUTRAL は何もしない。
        // BLOB：ON セルの中心と半径だけ使う。
        let P = [];   // [ax, ay, bx, by, ra, rb, halfLen, midX, midY, maxR]
        let Q = [];   // OFF セルの円 [x, y, r, ...]
        let C = [];   // ON セルの中心 [x, y, r, ...]（BLOB 用）
        const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];   // 重複しない8近傍

        function buildPrims() {
            P = []; Q = []; C = [];
            const push = (ax, ay, bx, by, ra, rb) => {
                const hl = Math.hypot(bx - ax, by - ay) / 2;
                P.push([ax * S, ay * S, bx * S, by * S, ra, rb,
                        hl * S, (ax + bx) / 2 * S, (ay + by) / 2 * S, Math.max(ra, rb)]);
            };
            const on = [];
            for (const [k, c] of grid) {
                const [i, j] = k.split(',').map(Number);
                if (c.v === ON) { on.push([i, j, k]); C.push(i * S, j * S, radius * c.s); }
                else Q.push(i * S, j * S, carve * c.s);
            }
            const hasSeg = new Set();
            for (const [di, dj] of DIRS) {
                for (const [i, j] of on) {
                    if (!linked(i, j, i + di, j + dj)) continue;
                    const k0 = key(i, j), s0 = sizeAt(k0);
                    const kn = key(i + di, j + dj);
                    if (sizeAt(kn) !== s0) {           // 太さが変わるところは1本だけ引く
                        push(i, j, i + di, j + dj, radius * s0, radius * sizeAt(kn));
                        hasSeg.add(k0); hasSeg.add(kn);
                        continue;
                    }
                    // 同じ太さで一直線に並んだ分は1本の長い線分にまとめる。
                    // 短い線分を重ねると smin が至るところで効いて、直線が波打つ
                    if (linked(i - di, j - dj, i, j) && sizeAt(key(i - di, j - dj)) === s0) continue;
                    let n = 1;
                    while (linked(i + n * di, j + n * dj, i + (n + 1) * di, j + (n + 1) * dj)
                        && sizeAt(key(i + (n + 1) * di, j + (n + 1) * dj)) === s0) n++;
                    push(i, j, i + n * di, j + n * dj, radius * s0, radius * s0);
                    for (let m = 0; m <= n; m++) hasSeg.add(key(i + m * di, j + m * dj));
                }
            }
            // 線分を持たないセルだけ円を足す。持っているセルにも足すと smin で膨らむ
            for (const [i, j, k] of on)
                if (!hasSeg.has(k)) push(i, j, i, j, radius * sizeAt(k), radius * sizeAt(k));
        }

        // 多項式スムーズ min。凹んだ接合部に半径 k のフィレットが入る
        function smin(a, b, k) {
            if (k <= 0) return a < b ? a : b;
            const h = Math.max(k - Math.abs(a - b), 0) / k;
            return (a < b ? a : b) - h * h * k * 0.25;
        }

        // 両端の半径が違うカプセル（円錐台）の符号付き距離
        function coneSD(px, py, p) {
            const ax = p[0], ay = p[1], r1 = p[4], r2 = p[5];
            const bax = p[2] - ax, bay = p[3] - ay;
            const l2 = bax * bax + bay * bay;
            const pax = px - ax, pay = py - ay;
            if (l2 < 1e-12) return Math.sqrt(pax * pax + pay * pay) - r1;
            const rr = r1 - r2;
            const a2 = l2 - rr * rr;
            if (a2 <= 0) {   // 片方の円がもう片方を飲み込んでいる
                const bx = px - p[2], by = py - p[3];
                return Math.min(Math.sqrt(pax * pax + pay * pay) - r1,
                                Math.sqrt(bx * bx + by * by) - r2);
            }
            const il2 = 1 / l2;
            const y = pax * bax + pay * bay;
            const z = y - l2;
            const qx = pax * l2 - bax * y, qy = pay * l2 - bay * y;
            const x2 = qx * qx + qy * qy;
            const y2 = y * y * l2, z2 = z * z * l2;
            const k = Math.sign(rr) * rr * rr * x2;
            if (Math.sign(z) * a2 * z2 > k) return Math.sqrt(x2 + z2) * il2 - r2;
            if (Math.sign(y) * a2 * y2 < k) return Math.sqrt(x2 + y2) * il2 - r1;
            return (Math.sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
        }

        // ===== スカラー場 =================================================
        // 内側は f >= THRESHOLD。両モードとも同じ閾値に揃えてある
        function field(x, y) {
            if (mode === 'blob') {
                let sum = 0;
                for (let n = 0; n < C.length; n += 3) {
                    const dx = x - C[n], dy = y - C[n + 1];
                    const d2 = dx * dx + dy * dy;
                    if (d2 < 1e-9) return 1e9;
                    const d = Math.sqrt(d2);
                    if (d >= FADE_OUT) continue;
                    let w = 1;
                    if (d > FADE_IN) {
                        // 裾を滑らかに殺す。ハードクリップだと等値線にカクが出る
                        const t = (d - FADE_IN) / (FADE_OUT - FADE_IN);
                        w = 1 - t * t * (3 - 2 * t);
                    }
                    const r = C[n + 2];
                    sum += (r / d) * (r / d) * w;
                }
                return sum;
            }
            // 近い2本だけを混ぜる。全部に smin を重ねがけすると膨らみが累積して
            // 本来まっすぐな辺が波打つ
            let a1 = Infinity, a2 = Infinity;
            for (let n = 0; n < P.length; n++) {
                const p = P[n];
                const reach = a2 + smoothK + p[6] + p[9];   // 遠いプリミティブは触らない
                const ex = x - p[7], ey = y - p[8];
                if (ex * ex + ey * ey > reach * reach) continue;
                const sd = coneSD(x, y, p);
                if (sd < a1) { a2 = a1; a1 = sd; }
                else if (sd < a2) { a2 = sd; }
            }
            const inStroke = -smin(a1, a2, smoothK);   // >= 0 が内側
            if (!carve || !Q.length) return THRESHOLD + inStroke;
            // OFF セルの円の外側。参考にしたグリフの凹んだ辺は、
            // どれも OFF の円の弧になっている＝結んだ形から円を削っている
            let o1 = Infinity, o2 = Infinity;
            for (let n = 0; n < Q.length; n += 3) {
                const ex = x - Q[n], ey = y - Q[n + 1];
                const sd = Math.sqrt(ex * ex + ey * ey) - Q[n + 2];
                if (sd < o1) { o2 = o1; o1 = sd; }
                else if (sd < o2) { o2 = sd; }
            }
            const outHole = smin(o1, o2, smoothK);
            // 積集合。smin で継ぎ目にフィレットが入る
            // 距離場は線形なので、マーチングスクエアの補間がそのまま効く
            return THRESHOLD + smin(inStroke, outHole, smoothK);
        }

        // ===== マーチングスクエア =========================================
        // 交点は格子辺そのものに乗るので、辺ID で頂点を同一視する。
        // 浮動小数の座標をキーにすると繋ぎ損ねるため。
        function contour() {
            buildPrims();
            if (!P.length) return [];

            const x0 = -MARGIN, y0 = -MARGIN;
            const nx = (cols - 1 + MARGIN * 2) * RES;
            const ny = (rows - 1 + MARGIN * 2) * RES;
            const step = S / RES;
            const px = i => x0 + i * step;
            const py = j => y0 + j * step;

            const v = new Float32Array((nx + 1) * (ny + 1));
            for (let j = 0; j <= ny; j++)
                for (let i = 0; i <= nx; i++)
                    v[j * (nx + 1) + i] = field(px(i), py(j));
            const val = (i, j) => v[j * (nx + 1) + i];

            const pos = new Map();   // 辺ID -> [x, y]
            const adj = new Map();   // 辺ID -> [辺ID, ...]
            const lerp = (a, b) => (THRESHOLD - a) / (b - a);

            function hEdge(i, j) {           // (i,j)-(i+1,j)
                const id = 'h' + i + '_' + j;
                if (!pos.has(id)) pos.set(id, [px(i) + lerp(val(i, j), val(i + 1, j)) * step, py(j)]);
                return id;
            }
            function vEdge(i, j) {           // (i,j)-(i,j+1)
                const id = 'v' + i + '_' + j;
                if (!pos.has(id)) pos.set(id, [px(i), py(j) + lerp(val(i, j), val(i, j + 1)) * step]);
                return id;
            }
            function link(a, b) {
                if (!adj.has(a)) adj.set(a, []);
                if (!adj.has(b)) adj.set(b, []);
                adj.get(a).push(b);
                adj.get(b).push(a);
            }

            for (let j = 0; j < ny; j++) {
                for (let i = 0; i < nx; i++) {
                    const tl = val(i, j) >= THRESHOLD, tr = val(i + 1, j) >= THRESHOLD;
                    const br = val(i + 1, j + 1) >= THRESHOLD, bl = val(i, j + 1) >= THRESHOLD;
                    const c = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
                    if (c === 0 || c === 15) continue;
                    const T = () => hEdge(i, j), B = () => hEdge(i, j + 1);
                    const L = () => vEdge(i, j), R = () => vEdge(i + 1, j);
                    switch (c) {
                        case 1: case 14: link(L(), B()); break;
                        case 2: case 13: link(B(), R()); break;
                        case 3: case 12: link(L(), R()); break;
                        case 4: case 11: link(T(), R()); break;
                        case 6: case 9: link(T(), B()); break;
                        case 7: case 8: link(L(), T()); break;
                        case 5: case 10: {
                            // 曖昧ケース。セル中心の場の値で接続を決める
                            const center = field(px(i) + step / 2, py(j) + step / 2) >= THRESHOLD;
                            // TL/BR 側を切り落とすか、TR/BL 側を切り落とすか
                            const cutTLBR = (c === 5) ? center : !center;
                            if (cutTLBR) { link(L(), T()); link(B(), R()); }
                            else { link(T(), R()); link(L(), B()); }
                            break;
                        }
                    }
                }
            }

            // 辺IDは必ず2本のセグメントに共有される（＝次数2）ので素直に閉ループになる
            const seen = new Set();
            const out = [];
            for (const start of adj.keys()) {
                if (seen.has(start)) continue;
                const loop = [];
                let cur = start, prev = null;
                while (cur !== undefined && !seen.has(cur)) {
                    seen.add(cur);
                    loop.push(pos.get(cur));
                    const ns = adj.get(cur);
                    const next = ns.find(n => n !== prev && !seen.has(n));
                    prev = cur;
                    cur = next;
                }
                if (loop.length > 2) out.push(loop);
            }
            return out;
        }

        // ===== Chaikin =====================================================
        function chaikin(loop, times) {
            let p = loop;
            for (let t = 0; t < times; t++) {
                const q = [];
                for (let i = 0; i < p.length; i++) {
                    const a = p[i], b = p[(i + 1) % p.length];
                    q.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
                    q.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
                }
                p = q;
            }
            return p;
        }

        function signedArea(loop) {
            let a = 0;
            for (let i = 0; i < loop.length; i++) {
                const p = loop[i], q = loop[(i + 1) % loop.length];
                a += p[0] * q[1] - q[0] * p[1];
            }
            return a / 2;
        }

        function rebuild() {
            loops = contour()
                .map(l => chaikin(l, 2))
                .filter(l => Math.abs(signedArea(l)) > 2e-3); // サンプリングのゴミを落とす
        }

        // ===== 描画 =========================================================
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');

        function view() {
            // グリッド外形＋余白 0.8 セル。プレビューと SVG で同じ枠を使う
            const pad = 0.8;
            const w = (cols - 1) * S + pad * 2;
            const h = (rows - 1) * S + pad * 2;
            const side = Math.max(w, h);
            return { x: -pad - (side - w) / 2, y: -pad - (side - h) / 2, size: side };
        }

        function pathFromLoops(scale, ox, oy) {
            const p = new Path2D();
            for (const l of loops) {
                p.moveTo(ox + l[0][0] * scale, oy + l[0][1] * scale);
                for (let i = 1; i < l.length; i++) p.lineTo(ox + l[i][0] * scale, oy + l[i][1] * scale);
                p.closePath();
            }
            return p;
        }

        function draw() {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const rect = cv.getBoundingClientRect();
            cv.width = Math.round(rect.width * dpr);
            cv.height = Math.round(rect.height * dpr);
            const vb = view();
            const scale = cv.width / vb.size;
            const ox = -vb.x * scale, oy = -vb.y * scale;

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, cv.width, cv.height);

            // OFF セルは実際に削る半径のまま下敷きに描く。避けている円が見える
            ctx.fillStyle = '#efefef';
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = Math.max(1, dpr);
            for (const [k, c] of grid) {
                if (c.v !== OFF) continue;
                const [i, j] = k.split(',').map(Number);
                const gr = (mode === 'edge' && carve ? carve : 0.4 * S) * c.s * scale;
                ctx.beginPath();
                ctx.arc(ox + i * S * scale, oy + j * S * scale, gr, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = '#000';
            ctx.fill(pathFromLoops(scale, ox, oy), 'evenodd');

            // 切ってある接続に印。ここをタップすれば繋ぎ直せる
            ctx.strokeStyle = 'rgba(220,60,60,0.85)';
            ctx.lineWidth = 1.5 * dpr;
            for (const [lk, v] of links) {
                if (v) continue;
                const [ka, kb] = lk.split('|');
                const [ia, ja] = ka.split(',').map(Number);
                const [ib, jb] = kb.split(',').map(Number);
                if (!isOn(ia, ja) || !isOn(ib, jb)) continue;
                const mx = ox + (ia + ib) / 2 * S * scale, my = oy + (ja + jb) / 2 * S * scale;
                const g = 4 * dpr;
                ctx.beginPath();
                ctx.moveTo(mx - g, my - g); ctx.lineTo(mx + g, my + g);
                ctx.moveTo(mx + g, my - g); ctx.lineTo(mx - g, my + g);
                ctx.stroke();
            }

            // 格子が見えないと編集しづらいので、シルエットの上に印を置く
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    const k = key(i, j), v = stateAt(k);
                    const cx = ox + i * S * scale, cy = oy + j * S * scale;
                    ctx.beginPath();
                    if (v === OFF) {
                        // 抜きのセルだけリング。ひと目で他と区別がつく
                        ctx.strokeStyle = 'rgba(0,0,0,0.28)';
                        ctx.lineWidth = Math.max(1, dpr);
                        ctx.arc(cx, cy, 3.5 * dpr, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        // 大きさをいじったセルは点も大きくする
                        const rr = (v === ON ? 2.5 * (0.55 + 0.45 * sizeAt(k)) : 2.5) * dpr;
                        ctx.fillStyle = v === ON ? 'rgba(255,255,255,0.24)' : 'rgba(0,0,0,0.13)';
                        ctx.arc(cx, cy, rr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // 長押し中のセルは実寸のリングを出す
            if (sizing && pressK) {
                const [i, j] = pressK.split(',').map(Number);
                const base = stateAt(pressK) === OFF ? carve : radius;
                ctx.strokeStyle = 'rgba(220,60,60,0.9)';
                ctx.lineWidth = 1.5 * dpr;
                ctx.beginPath();
                ctx.arc(ox + i * S * scale, oy + j * S * scale, base * sizeAt(pressK) * scale, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function update() { rebuild(); draw(); }

        // ===== 入力 =========================================================
        // タップ：セルを NEUTRAL → ON → OFF と一巡
        // ドラッグ：最初のタップで決まった状態を塗り続ける
        // セルの隙間をタップ：その接続を切る／繋ぎ直す
        // 長押ししてドラッグ：そのセルの大きさを変える
        const LONG_PRESS = 320, DRAG_SLOP = 0.22, HOLD = 0.34, GAP_HIT = 0.30;
        let painting = false, paintTo = ON, sizing = false;
        let pressK = null, pressPt = null, startSize = 1, lpTimer = null;

        function toWorld(ev) {
            const rect = cv.getBoundingClientRect();
            const vb = view();
            const scale = rect.width / vb.size;
            return { x: (ev.clientX - rect.left) / scale + vb.x, y: (ev.clientY - rect.top) / scale + vb.y };
        }

        function pickCell(x, y) {
            const i = Math.round(x / S), j = Math.round(y / S);
            if (i < 0 || j < 0 || i >= cols || j >= rows) return null;
            if (Math.hypot(x - i * S, y - j * S) > HOLD * S) return null;
            return key(i, j);
        }

        // 隣接した ON ペアの中点。斜めは2本が同じ点で交差するので近いほうを採る
        function pickLink(x, y) {
            let best = null, bd = GAP_HIT * S;
            for (const [k, c] of grid) {
                if (c.v !== ON) continue;
                const [i, j] = k.split(',').map(Number);
                for (const [di, dj] of DIRS) {
                    if (!isOn(i + di, j + dj)) continue;
                    const mx = (i + di / 2) * S, my = (j + dj / 2) * S;
                    const d = Math.hypot(x - mx, y - my);
                    if (d < bd) { bd = d; best = linkKey(k, key(i + di, j + dj)); }
                }
            }
            return best;
        }

        function clearPress() {
            clearTimeout(lpTimer); lpTimer = null;
            pressK = null; painting = false; sizing = false;
        }

        cv.addEventListener('pointerdown', e => {
            const w = toWorld(e);
            const k = pickCell(w.x, w.y);
            if (k) {
                cv.setPointerCapture(e.pointerId);
                pressK = k; pressPt = w; painting = false; sizing = false;
                paintTo = NEXT[stateAt(k)];
                lpTimer = setTimeout(() => {
                    lpTimer = null; sizing = true;
                    if (stateAt(pressK) === NEUTRAL) setCell(pressK, ON, 1);
                    startSize = sizeAt(pressK);
                    update();
                }, LONG_PRESS);
                return;
            }
            const lk = pickLink(w.x, w.y);
            if (lk) {
                const [ka, kb] = lk.split('|');
                const [ia, ja] = ka.split(',').map(Number);
                const [ib, jb] = kb.split(',').map(Number);
                links.set(lk, !linked(ia, ja, ib, jb));
                update();
            }
        });

        cv.addEventListener('pointermove', e => {
            if (!pressK) return;
            const w = toWorld(e);
            if (sizing) {
                // 上へ引くと大きく、下へ引くと小さく
                const s = Math.min(SIZE_MAX, Math.max(SIZE_MIN, startSize + (pressPt.y - w.y) * 0.9));
                setCell(pressK, stateAt(pressK), Math.round(s * 20) / 20);
                update();
                return;
            }
            if (!painting && Math.hypot(w.x - pressPt.x, w.y - pressPt.y) > DRAG_SLOP * S) {
                clearTimeout(lpTimer); lpTimer = null;
                painting = true;
                setCell(pressK, paintTo);
            }
            if (painting) {
                const k = pickCell(w.x, w.y);
                if (k && stateAt(k) !== paintTo) setCell(k, paintTo);
                update();
            }
        });

        cv.addEventListener('pointerup', () => {
            const tap = pressK && !painting && !sizing;
            if (tap) setCell(pressK, paintTo);
            clearPress();
            update();   // 長押し中のリングを消すために必ず描き直す
        });
        cv.addEventListener('pointercancel', clearPress);

        // ===== コントロール =================================================
        const weight = document.getElementById('weight');
        const weightVal = document.getElementById('weightVal');
        const smooth = document.getElementById('smooth');
        const smoothVal = document.getElementById('smoothVal');
        const smoothRow = document.getElementById('smoothRow');
        const carveEl = document.getElementById('carve');
        const carveVal = document.getElementById('carveVal');
        const carveRow = document.getElementById('carveRow');

        function readSliders() {
            const t = weight.value / 1000;
            const lo = mode === 'blob' ? BLOB_MIN : EDGE_MIN;
            const hi = mode === 'blob' ? BLOB_MAX : EDGE_MAX;
            radius = lo + (hi - lo) * t;
            weightVal.textContent = Math.round(t * 100);
            const k = smooth.value / 1000;
            smoothK = K_MAX * k;
            smoothVal.textContent = Math.round(k * 100);
            const q = carveEl.value / 1000;
            carve = CARVE_MAX * q;
            carveVal.textContent = Math.round(q * 100);
        }
        for (const el of [weight, smooth, carveEl])
            el.addEventListener('input', () => { readSliders(); update(); });

        const styleSeg = document.getElementById('styleSeg');
        function refreshStyle() {
            styleSeg.innerHTML = '';
            for (const m of ['edge', 'blob']) {
                const b = document.createElement('button');
                b.textContent = m.toUpperCase();
                b.className = 'wide' + (m === mode ? ' on' : '');
                b.onclick = () => { mode = m; refreshStyle(); readSliders(); update(); };
                styleSeg.appendChild(b);
            }
            smoothRow.style.display = carveRow.style.display = mode === 'edge' ? '' : 'none';
        }

        function buildSeg(el, min, max, get, set) {
            el.innerHTML = '';
            for (let n = min; n <= max; n++) {
                const b = document.createElement('button');
                b.textContent = n;
                b.className = n === get() ? 'on' : '';
                b.onclick = () => { set(n); };
                el.appendChild(b);
            }
        }
        const colsSeg = document.getElementById('colsSeg');
        const rowsSeg = document.getElementById('rowsSeg');
        function refreshSegs() {
            buildSeg(colsSeg, 3, 6, () => cols, n => { resize(n, rows); });
            buildSeg(rowsSeg, 4, 7, () => rows, n => { resize(cols, n); });
        }
        function resize(c, r) {
            cols = c; rows = r;
            for (const k of [...grid.keys()]) {
                const [i, j] = k.split(',').map(Number);
                if (i >= cols || j >= rows) grid.delete(k);
            }
            for (const lk of [...links.keys()])
                if (lk.split('|').some(k => !grid.has(k))) links.delete(lk);
            refreshSegs();
            update();
        }

        document.getElementById('btnClear').onclick = () => { grid.clear(); links.clear(); update(); };

        // ===== 書き出し =====================================================
        // プレビューと同じ loops から作る。別計算しない
        function svgText() {
            const vb = view();
            const K = 100;
            const d = loops.map(l =>
                'M' + l.map(p => (p[0] * K).toFixed(2) + ' ' + (p[1] * K).toFixed(2)).join('L') + 'Z'
            ).join('');
            const size = (vb.size * K).toFixed(2);
            return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
                (vb.x * K).toFixed(2) + ' ' + (vb.y * K).toFixed(2) + ' ' + size + ' ' + size +
                '" width="' + size + '" height="' + size + '">\n' +
                '  <path d="' + d + '" fill="#000" fill-rule="evenodd"/>\n</svg>\n';
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove('show'), 1400);
        }

        function download(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        document.getElementById('btnSvg').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            download(new Blob([svgText()], { type: 'image/svg+xml' }), 'blob-type.svg');
        };

        document.getElementById('btnCopy').onclick = async () => {
            if (!loops.length) return toast('EMPTY');
            const text = svgText();
            try {
                await navigator.clipboard.writeText(text);
                toast('COPIED');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                toast('COPIED');
            }
        };

        document.getElementById('btnPng').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            const vb = view();
            const px = 1024;
            const c = document.createElement('canvas');
            c.width = c.height = px;
            const g = c.getContext('2d');
            g.fillStyle = '#fff';
            g.fillRect(0, 0, px, px);
            const scale = px / vb.size;
            const p = new Path2D();
            for (const l of loops) {
                p.moveTo((l[0][0] - vb.x) * scale, (l[0][1] - vb.y) * scale);
                for (let i = 1; i < l.length; i++) p.lineTo((l[i][0] - vb.x) * scale, (l[i][1] - vb.y) * scale);
                p.closePath();
            }
            g.fillStyle = '#000';
            g.fill(p, 'evenodd');
            c.toBlob(b => download(b, 'blob-type.png'), 'image/png');
        };

        // ===== 初期状態 =====================================================
        // 起動時は穴のある形（O）を置いておく。内側は OFF にして丸く抜く
        ['0,0', '1,0', '2,0', '3,0', '0,1', '3,1', '0,2', '3,2', '0,3', '3,3', '0,4', '1,4', '2,4', '3,4']
            .forEach(k => setCell(k, ON, 1));
        ['1,1', '2,1', '1,2', '2,2', '1,3', '2,3'].forEach(k => setCell(k, OFF, 1));
        refreshSegs();
        refreshStyle();
        readSliders();
        update();
        window.addEventListener('resize', draw);
    </script>
</body>

</html>
