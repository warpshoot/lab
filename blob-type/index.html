<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Type</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 48px;
            gap: 20px;
        }

        header {
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        h1 {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.14em;
        }

        .hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.32);
            letter-spacing: 0.06em;
        }

        .stage {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .panel {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .row label {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.42);
            width: 74px;
            flex-shrink: 0;
        }

        .value {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 20px;
            background: transparent;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 1px;
            background: rgba(255, 255, 255, 0.22);
        }

        input[type=range]::-moz-range-track {
            height: 1px;
            background: rgba(255, 255, 255, 0.22);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            margin-top: -6.5px;
        }

        input[type=range]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            background: #fff;
        }

        .seg {
            display: flex;
            gap: 4px;
        }

        .seg button {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.12s;
        }

        .seg button:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .seg button.wide {
            width: 64px;
            letter-spacing: 0.08em;
        }

        .seg button.on {
            background: #fff;
            border-color: #fff;
            color: #0f0f0f;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .actions button {
            padding: 11px 0;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: transparent;
            color: rgba(255, 255, 255, 0.82);
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.1em;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.12s;
        }

        .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .actions button:active {
            background: rgba(255, 255, 255, 0.18);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(8px);
            background: #fff;
            color: #0f0f0f;
            font-size: 10px;
            letter-spacing: 0.08em;
            padding: 8px 14px;
            border-radius: 3px;
            opacity: 0;
            pointer-events: none;
            transition: 0.18s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <header>
        <h1>BLOB TYPE</h1>
        <span class="hint">tap: peg · drag the band</span>
    </header>

    <div class="stage">
        <canvas id="cv"></canvas>
    </div>

    <div class="panel">
        <div class="row">
            <label>STYLE</label>
            <div class="seg" id="styleSeg"></div>
            <label style="width:auto;margin-left:12px">VIEW</label>
            <div class="seg" id="viewSeg"></div>
        </div>
        <div class="row">
            <label>WEIGHT</label>
            <input type="range" id="weight" min="0" max="1000" value="860">
            <span class="value" id="weightVal">86</span>
        </div>
        <div class="row">
            <label>GAP</label>
            <input type="range" id="gap" min="0" max="1000" value="460">
            <span class="value" id="gapVal">46</span>
        </div>
        <div class="row">
            <label>COLS</label>
            <div class="seg" id="colsSeg"></div>
            <label style="width:auto;margin-left:12px">ROWS</label>
            <div class="seg" id="rowsSeg"></div>
        </div>
        <div class="actions">
            <button id="btnClear">CLEAR</button>
            <button id="btnCopy">COPY SVG</button>
            <button id="btnSvg">SVG</button>
            <button id="btnPng">PNG</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== モデル =====================================================
        // セル間隔を 1 とする単位系で全部計算する。書き出し時だけ 100 倍する。
        //
        // プレートに杭を打ち、その外側に糸を張ったもの、と考える。
        // ON の杭は距離に関係なく必ず糸の内側に入るので、素の形は ON の杭
        // ぜんぶの凸包になる。OFF の杭は糸の外側から押し込んで形を彫る。
        // NEUTRAL は杭が打たれていないので糸が素通りする。
        //
        // 杭どうしは絶対に重ならない（半径は杭間隔の半分まで）。これが効いていて、
        // 重ならない円は隙間を囲めないので、押し込みの合間に取り残された島は
        // 発生しない。糸の内側に完全に入った杭は、そのまま真円の穴になる。
        const S = 1;
        const THRESHOLD = 1.0;
        const RES = 12;          // セル間隔あたりのサンプル数
        const MARGIN = 1;        // サンプリング領域の余白（セル）
        // BLOB（メタボール）用
        const BLOB_MIN = 0.30, BLOB_MAX = 0.54;
        const FADE_IN = 1.5;     // ここから寄与を落とし始める（セル単位）
        const FADE_OUT = 2.1;    // ここで寄与ゼロ
        // EDGE（糸）用。杭間隔の半分に対する割合
        const EDGE_MIN = 0.30, EDGE_MAX = 0.97;   // 1.0 ちょうどは杭が接して糸の通り道が消える
        // 格子の縦横比（行間 ÷ 列間）。面積は保つので、行間を広げると列間が詰まる
        const GAP_MIN = 0.55, GAP_MAX = 1.80;

        const ON = 1, OFF = -1, NEUTRAL = 0;

        let cols = 4, rows = 5;
        let grid = new Map();    // "i,j" -> ON | OFF。持っていないセルは NEUTRAL
        let mode = 'edge';       // 'edge' | 'blob'
        let radius = 0.55;
        let gap = 1;             // 格子の縦横比
        let sx = 1, sy = 1;      // 列間・行間。sx * sy = 1 に保つ
        let outline = false;     // 輪郭線だけ表示するモード
        let loops = [];          // 張り直したポリライン（プレビューと書き出しで共用）

        const key = (i, j) => i + ',' + j;
        const stateAt = k => grid.get(k) || NEUTRAL;
        // 格子の座標。行間だけ可変
        const CX = i => i * sx;
        const CY = j => j * sy;
        function setCell(k, v) { if (v === NEUTRAL) grid.delete(k); else grid.set(k, v); }

        let PUSH = [];   // OFF 円の中心 [[x, y], ...]
        let ONC = [];    // ON 円の中心 [[x, y], ...]

        function convexHull(pts) {
            if (pts.length < 3) return pts.slice();
            const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
            const half = src => {
                const h = [];
                for (const q of src) {
                    while (h.length >= 2 && cross(h[h.length - 2], h[h.length - 1], q) <= 0) h.pop();
                    h.push(q);
                }
                h.pop();
                return h;
            };
            const hull = half(p).concat(half(p.slice().reverse()));
            return hull.length ? hull : p.slice(0, 2);
        }

        function build() {
            ONC = []; PUSH = [];
            for (const [k, v] of grid) {
                const [i, j] = k.split(',').map(Number);
                (v === ON ? ONC : PUSH).push([CX(i), CY(j)]);
            }
        }

        // 点 (x, y) から線分 p までの距離
        function segDist(x, y, p) {
            const vx = p[2] - p[0], vy = p[3] - p[1];
            const wx = x - p[0], wy = y - p[1];
            const vv = vx * vx + vy * vy;
            let t = vv > 0 ? (wx * vx + wy * vy) / vv : 0;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const dx = wx - t * vx, dy = wy - t * vy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // ===== スカラー場 =================================================
        // 内側は f >= THRESHOLD。両モードとも同じ閾値に揃えてある
        // BLOB スタイル専用。EDGE は等値線を使わない
        function field(x, y) {
            {
                let sum = 0;
                for (let n = 0; n < ONC.length; n++) {
                    const dx = x - ONC[n][0], dy = y - ONC[n][1];
                    const d2 = dx * dx + dy * dy;
                    if (d2 < 1e-9) return 1e9;
                    const d = Math.sqrt(d2);
                    if (d >= FADE_OUT) continue;
                    let w = 1;
                    if (d > FADE_IN) {
                        // 裾を滑らかに殺す。ハードクリップだと等値線にカクが出る
                        const t = (d - FADE_IN) / (FADE_OUT - FADE_IN);
                        w = 1 - t * t * (3 - 2 * t);
                    }
                    sum += (radius / d) * (radius / d) * w;
                }
                return sum;
            }
        }

        // ===== マーチングスクエア =========================================
        // 交点は格子辺そのものに乗るので、辺ID で頂点を同一視する。
        // 浮動小数の座標をキーにすると繋ぎ損ねるため。
        function contour() {
            build();
            if (!ONC.length) return [];

            const x0 = -MARGIN, y0 = -MARGIN;
            const step = S / RES;
            const nx = Math.ceil(((cols - 1) * sx + MARGIN * 2) / step);
            const ny = Math.ceil(((rows - 1) * sy + MARGIN * 2) / step);
            const px = i => x0 + i * step;
            const py = j => y0 + j * step;

            const v = new Float32Array((nx + 1) * (ny + 1));
            for (let j = 0; j <= ny; j++)
                for (let i = 0; i <= nx; i++)
                    v[j * (nx + 1) + i] = field(px(i), py(j));
            const val = (i, j) => v[j * (nx + 1) + i];

            const pos = new Map();   // 辺ID -> [x, y]
            const adj = new Map();   // 辺ID -> [辺ID, ...]
            const lerp = (a, b) => (THRESHOLD - a) / (b - a);

            function hEdge(i, j) {           // (i,j)-(i+1,j)
                const id = 'h' + i + '_' + j;
                if (!pos.has(id)) pos.set(id, [px(i) + lerp(val(i, j), val(i + 1, j)) * step, py(j)]);
                return id;
            }
            function vEdge(i, j) {           // (i,j)-(i,j+1)
                const id = 'v' + i + '_' + j;
                if (!pos.has(id)) pos.set(id, [px(i), py(j) + lerp(val(i, j), val(i, j + 1)) * step]);
                return id;
            }
            function link(a, b) {
                if (!adj.has(a)) adj.set(a, []);
                if (!adj.has(b)) adj.set(b, []);
                adj.get(a).push(b);
                adj.get(b).push(a);
            }

            for (let j = 0; j < ny; j++) {
                for (let i = 0; i < nx; i++) {
                    const tl = val(i, j) >= THRESHOLD, tr = val(i + 1, j) >= THRESHOLD;
                    const br = val(i + 1, j + 1) >= THRESHOLD, bl = val(i, j + 1) >= THRESHOLD;
                    const c = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
                    if (c === 0 || c === 15) continue;
                    const T = () => hEdge(i, j), B = () => hEdge(i, j + 1);
                    const L = () => vEdge(i, j), R = () => vEdge(i + 1, j);
                    switch (c) {
                        case 1: case 14: link(L(), B()); break;
                        case 2: case 13: link(B(), R()); break;
                        case 3: case 12: link(L(), R()); break;
                        case 4: case 11: link(T(), R()); break;
                        case 6: case 9: link(T(), B()); break;
                        case 7: case 8: link(L(), T()); break;
                        case 5: case 10: {
                            // 曖昧ケース。セル中心の場の値で接続を決める
                            const center = field(px(i) + step / 2, py(j) + step / 2) >= THRESHOLD;
                            // TL/BR 側を切り落とすか、TR/BL 側を切り落とすか
                            const cutTLBR = (c === 5) ? center : !center;
                            if (cutTLBR) { link(L(), T()); link(B(), R()); }
                            else { link(T(), R()); link(L(), B()); }
                            break;
                        }
                    }
                }
            }

            // 辺IDは必ず2本のセグメントに共有される（＝次数2）ので素直に閉ループになる
            const seen = new Set();
            const out = [];
            for (const start of adj.keys()) {
                if (seen.has(start)) continue;
                const loop = [];
                let cur = start, prev = null;
                while (cur !== undefined && !seen.has(cur)) {
                    seen.add(cur);
                    loop.push(pos.get(cur));
                    const ns = adj.get(cur);
                    const next = ns.find(n => n !== prev && !seen.has(n));
                    prev = cur;
                    cur = next;
                }
                if (loop.length > 2) out.push(loop);
            }
            return out;
        }

        // ===== Chaikin =====================================================
        function chaikin(loop, times) {
            let p = loop;
            for (let t = 0; t < times; t++) {
                const q = [];
                for (let i = 0; i < p.length; i++) {
                    const a = p[i], b = p[(i + 1) % p.length];
                    q.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
                    q.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
                }
                p = q;
            }
            return p;
        }

        function signedArea(loop) {
            let a = 0;
            for (let i = 0; i < loop.length; i++) {
                const p = loop[i], q = loop[(i + 1) % loop.length];
                a += p[0] * q[1] - q[0] * p[1];
            }
            return a / 2;
        }

        function pointInPoly(p, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const a = poly[j], b = poly[i];
                if ((a[1] > p[1]) !== (b[1] > p[1])
                    && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
            }
            return inside;
        }

        function circlePoly(c, r) {
            const out = [];
            for (let n = 0; n < 72; n++) {
                const a = n / 72 * Math.PI * 2;
                out.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]);
            }
            return out;
        }

        // ===== 輪ゴムを解く ===============================================
        // 杭はすべて障害物。輪ゴムは接点の列でできていて、各接点は
        // その杭を内側に抱えている（s=+1）か、外側へ押しのけている（s=-1）か
        // のどちらか。列さえ決まれば、形は共通接線と弧だけで一意に決まる。
        //
        // 解き方：内側の杭ぜんぶを囲む凸包から始めて、
        //   1. 外しても誰にも当たらない接点を外す（張力で外れる）
        //   2. 接線が突っ切っている杭を挿す
        //   3. 側が違う杭（外側のはずが中に入っている等）を挿す
        // が収束するまで回す。1 があるので、常に短いほうの経路に落ちる

        // 半径の等しい2円に、指定した側で接する直線
        function linkOf(a, b) {
            const dx = b.c[0] - a.c[0], dy = b.c[1] - a.c[1];
            const L = Math.hypot(dx, dy);
            const k = (a.s - b.s) * radius;
            if (L < 1e-9 || Math.abs(k) > L) return null;
            const phi = Math.atan2(dy, dx) - Math.acos(k / L);
            const nx = Math.cos(phi), ny = Math.sin(phi);
            return {
                pa: [a.c[0] + a.s * radius * nx, a.c[1] + a.s * radius * ny],
                pb: [b.c[0] + b.s * radius * nx, b.c[1] + b.s * radius * ny]
            };
        }

        function arcOf(ct, from, to) {
            const c = ct.c, dir = ct.s;   // 抱えている杭は左回り、押しのけている杭は右回り
            const a0 = Math.atan2(from[1] - c[1], from[0] - c[0]);
            const a1 = Math.atan2(to[1] - c[1], to[0] - c[0]);
            let sweep = (a1 - a0) * dir;
            while (sweep < 0) sweep += Math.PI * 2;
            const steps = Math.max(1, Math.ceil(sweep / (Math.PI / 60)));
            const out = [];
            for (let n = 0; n <= steps; n++) {
                const a = a0 + dir * sweep * n / steps;
                out.push([c[0] + Math.cos(a) * radius, c[1] + Math.sin(a) * radius]);
            }
            return out;
        }

        let pathOwner = [];   // 輪郭の各点が、どの接点の弧から来たか

        function pathOf(cts) {
            const m = cts.length;
            if (!m) return null;
            if (m === 1) {
                const c = circlePoly(cts[0].c, radius);
                pathOwner = c.map(() => 0);
                return c;
            }
            const links = [];
            for (let i = 0; i < m; i++) {
                const L = linkOf(cts[i], cts[(i + 1) % m]);
                if (!L) return null;
                links.push(L);
            }
            const out = [];
            pathOwner = [];
            for (let i = 0; i < m; i++) {
                const arc = arcOf(cts[i], links[(i - 1 + m) % m].pb, links[i].pa);
                out.push(...arc);
                for (let n = 0; n < arc.length; n++) pathOwner.push(i);
            }
            return out;
        }

        // 線分 pa-pb が、両端の接点以外の杭に当たっていないか
        const segBuf = [0, 0, 0, 0];
        function blockedBy(pa, pb, pegs, skipA, skipB) {
            segBuf[0] = pa[0]; segBuf[1] = pa[1]; segBuf[2] = pb[0]; segBuf[3] = pb[1];
            let hit = -1, worst = radius - 1e-4;
            for (let i = 0; i < pegs.length; i++) {
                if (i === skipA || i === skipB) continue;
                const d = segDist(pegs[i].c[0], pegs[i].c[1], segBuf);
                if (d < worst) { worst = d; hit = i; }
            }
            return hit;
        }

        // 直線どうしの交差。弧は杭が重ならない以上ぶつからないので直線だけ見る
        function segCross(p1, p2, p3, p4) {
            const d = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
            const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
            return d1 * d2 < 0 && d3 * d4 < 0;
        }

        function solveBand() {
            const pegs = [];
            for (const [k, v] of grid) {
                const [i, j] = k.split(',').map(Number);
                pegs.push({ c: [CX(i), CY(j)], s: v === ON ? 1 : -1, k });
            }
            const inside = pegs.filter(p => p.s > 0);
            if (!inside.length) return null;
            // 杭ひとつなら、その杭に巻きついた輪ゴム＝ただの円
            if (inside.length === 1 && pegs.length === 1) return [pegs[0]];

            // 初期状態：抱える杭ぜんぶの凸包（左回り）
            let hull = convexHull(inside.map(p => p.c));
            if (hull.length > 2 && signedArea(hull) < 0) hull.reverse();
            let cts = hull.map(h => pegs.findIndex(p => p.c[0] === h[0] && p.c[1] === h[1]));
            if (cts.length < 1) cts = [pegs.indexOf(inside[0])];

            const ctOf = i => pegs[i];

            // 接線が杭を突っ切らず、糸どうしも交差していないか。
            // 交差を見ないと、深いスリットを作ったときに二重巻きの線が出る
            function links(list) {
                const cs = list.map(ctOf);
                const out = [];
                for (let i = 0; i < list.length; i++) {
                    const L = linkOf(cs[i], cs[(i + 1) % list.length]);
                    if (!L) return null;
                    out.push(L);
                }
                return out;
            }

            function taut(list) {
                if (list.length < 2) return true;
                const ls = links(list);
                if (!ls) return false;
                for (let i = 0; i < list.length; i++) {
                    const j = (i + 1) % list.length;
                    if (blockedBy(ls[i].pa, ls[i].pb, pegs, list[i], list[j]) >= 0) return false;
                }
                for (let i = 0; i < ls.length; i++)
                    for (let j = i + 2; j < ls.length; j++) {
                        if (i === 0 && j === ls.length - 1) continue;
                        if (segCross(ls[i].pa, ls[i].pb, ls[j].pa, ls[j].pb)) return false;
                    }
                return true;
            }

            // そのうえで、どの杭も指定どおりの側にいること
            function valid(list) {
                if (list.length < 1) return false;
                if (!taut(list)) return false;
                const pts = pathOf(list.map(ctOf));
                if (!pts) return false;
                for (let i = 0; i < pegs.length; i++) {
                    if (list.includes(i)) continue;
                    if ((pegs[i].s > 0) !== pointInPoly(pegs[i].c, pts)) return false;
                }
                return true;
            }

            for (let iter = 0; iter < 300; iter++) {
                let changed = false;

                // 1. 接線が突っ切っている杭を挿す
                for (let i = 0; i < cts.length && !changed; i++) {
                    const j = (i + 1) % cts.length;
                    if (cts.length < 2) break;
                    const L = linkOf(ctOf(cts[i]), ctOf(cts[j]));
                    if (!L) continue;
                    const hit = blockedBy(L.pa, L.pb, pegs, cts[i], cts[j]);
                    if (hit < 0) continue;
                    cts.splice(i + 1, 0, hit);
                    changed = true;
                }
                if (changed) continue;

                // 2. 側が違う杭を、いちばん伸びの小さい辺に挿す
                const pts = pathOf(cts.map(ctOf));
                if (!pts) break;
                const pending = [];
                for (let i = 0; i < pegs.length && !changed; i++) {
                    if (cts.includes(i)) continue;
                    if ((pegs[i].s > 0) === pointInPoly(pegs[i].c, pts)) continue;
                    // いちばん近い辺に挿す。伸びの少なさで選ぶと、深く入り込んだ杭が
                    // 遠くの辺に繋がって糸が絡まる。近い辺から順に入れていけば、
                    // 何本もの杭が同じスリットに素直に並ぶ
                    const cand = [];
                    for (let e = 0; e < cts.length; e++) {
                        const a = ctOf(cts[e]), b = ctOf(cts[(e + 1) % cts.length]);
                        const L1 = linkOf(a, pegs[i]), L2 = linkOf(pegs[i], b);
                        if (!L1 || !L2) continue;
                        const L0 = cts.length > 1 ? linkOf(a, b) : null;
                        const near = L0
                            ? segDist(pegs[i].c[0], pegs[i].c[1],
                                [L0.pa[0], L0.pa[1], L0.pb[0], L0.pb[1]])
                            : 0;
                        cand.push({ at: e, add: near });
                    }
                    cand.sort((x, y) => x.add - y.add);
                    // 近い順に見て、糸が交差しない位置に入れる。
                    // どこに入れても交差するなら、この杭は後回しにする。
                    // 先に別の杭が入って形が変われば、素直に入る場所ができる
                    let at = -1;
                    for (const c of cand) {
                        const trial = cts.slice(0, c.at + 1).concat([i], cts.slice(c.at + 1));
                        if (taut(trial)) { at = c.at; break; }
                    }
                    if (at < 0) { pending.push(i); continue; }
                    cts.splice(at + 1, 0, i);
                    changed = true;
                }
                // 全部が後回しになったら、いちばん近い場所に押し込んで先へ進める
                if (!changed && pending.length) {
                    const i = pending[0];
                    let at = 0, best = Infinity;
                    for (let e = 0; e < cts.length; e++) {
                        const a = ctOf(cts[e]), b = ctOf(cts[(e + 1) % cts.length]);
                        const L0 = cts.length > 1 ? linkOf(a, b) : null;
                        if (!L0) continue;
                        const d = segDist(pegs[i].c[0], pegs[i].c[1],
                            [L0.pa[0], L0.pa[1], L0.pb[0], L0.pb[1]]);
                        if (d < best) { best = d; at = e; }
                    }
                    cts.splice(at + 1, 0, i);
                    changed = true;
                }
                if (changed) continue;

                // 3. 外しても条件を満たす接点は、張力で外れる
                for (let i = 0; i < cts.length; i++) {
                    const trial = cts.slice(0, i).concat(cts.slice(i + 1));
                    if (!trial.length || !valid(trial)) continue;
                    cts = trial;
                    changed = true;
                    break;
                }
                if (!changed) break;
            }
            return cts.map(i => pegs[i]);
        }

        let bandContacts = null;   // いま張られている輪ゴムの接点列

        function rebuild() {
            if (mode === 'blob') {
                loops = contour().map(l => chaikin(l, 2))
                    .filter(l => Math.abs(signedArea(l)) > 2e-3);
                return;
            }
            build();
            bandContacts = solveBand();
            const outer = bandContacts && pathOf(bandContacts);
            if (!outer) { loops = []; bandContacts = null; return; }
            loops = [outer];
        }

        // ===== 描画 =========================================================
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');

        function view() {
            // グリッド外形＋余白 0.8 セル。プレビューと SVG で同じ枠を使う。
            // 枠は縦横比がいちばん伸びたときに合わせて固定する。現在の外形で
            // 取ると、縦が横を追い越したところで基準が入れ替わり、
            // スライダを一方向に動かしているのに拡大率が反転する
            const pad = 0.8;
            const w = (cols - 1) * sx + pad * 2;
            const h = (rows - 1) * sy + pad * 2;
            const side = Math.max((cols - 1) / Math.sqrt(GAP_MIN),
                                  (rows - 1) * Math.sqrt(GAP_MAX)) + pad * 2;
            return { x: -pad - (side - w) / 2, y: -pad - (side - h) / 2, size: side };
        }

        function polyPath(pts, scale, ox, oy) {
            const p = new Path2D();
            p.moveTo(ox + pts[0][0] * scale, oy + pts[0][1] * scale);
            for (let i = 1; i < pts.length; i++) p.lineTo(ox + pts[i][0] * scale, oy + pts[i][1] * scale);
            p.closePath();
            return p;
        }

        function pathFromLoops(scale, ox, oy) {
            const p = new Path2D();
            for (const l of loops) {
                p.moveTo(ox + l[0][0] * scale, oy + l[0][1] * scale);
                for (let i = 1; i < l.length; i++) p.lineTo(ox + l[i][0] * scale, oy + l[i][1] * scale);
                p.closePath();
            }
            return p;
        }

        function draw() {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const rect = cv.getBoundingClientRect();
            cv.width = Math.round(rect.width * dpr);
            cv.height = Math.round(rect.height * dpr);
            const vb = view();
            const scale = cv.width / vb.size;
            const ox = -vb.x * scale, oy = -vb.y * scale;

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, cv.width, cv.height);

            const cr = (mode === 'edge' ? radius : 0.4 * S) * scale;
            // ドラッグ中は、張り直したあとの形ではなく、いま指で伸ばしている形を出す。
            // 張り直した形だけを見せると、掴んだ辺が指について来ないので
            // 別の辺が動いたように見える
            const stretched = (dragging && restPath && dragPos)
                ? [[dragPos.x, dragPos.y]].concat(restPath) : null;

            if (outline) {
                // 糸がどの円に張られているかを見るモード。
                // 円を実寸で見せて、輪郭は線だけにする
                for (const [k, v] of grid) {
                    const [i, j] = k.split(',').map(Number);
                    ctx.beginPath();
                    ctx.arc(ox + CX(i) * scale, oy + CY(j) * scale,
                            cr, 0, Math.PI * 2);
                    if (v === ON) {
                        ctx.fillStyle = '#e6e6e6';
                        ctx.fill();
                    } else {
                        // 内側から押している円は塗らずに破線で
                        ctx.fillStyle = '#fafafa';
                        ctx.fill();
                        ctx.strokeStyle = '#cfcfcf';
                        ctx.lineWidth = Math.max(1, dpr);
                        ctx.setLineDash([4 * dpr, 3 * dpr]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
                ctx.strokeStyle = '#e03131';
                ctx.lineWidth = 1.6 * dpr;
                ctx.stroke(stretched ? polyPath(stretched, scale, ox, oy)
                                     : pathFromLoops(scale, ox, oy));
            } else {
                // OFF セルは実寸で下敷きに描く。押している円が見える
                ctx.fillStyle = '#efefef';
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = Math.max(1, dpr);
                for (const [k, v] of grid) {
                    if (v !== OFF) continue;
                    const [i, j] = k.split(',').map(Number);
                    ctx.beginPath();
                    ctx.arc(ox + CX(i) * scale, oy + CY(j) * scale, cr, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.fillStyle = '#000';
                ctx.fill(stretched ? polyPath(stretched, scale, ox, oy)
                                   : pathFromLoops(scale, ox, oy), 'evenodd');
            }

            // 掴んでいる点
            if (dragging && dragPos) {
                ctx.fillStyle = 'rgba(220,60,60,0.9)';
                ctx.beginPath();
                ctx.arc(ox + dragPos.x * scale, oy + dragPos.y * scale, 4 * dpr, 0, Math.PI * 2);
                ctx.fill();
            }

            // 格子が見えないと編集しづらいので、シルエットの上に印を置く
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    const v = stateAt(key(i, j));
                    const cx = ox + CX(i) * scale, cy = oy + CY(j) * scale;
                    ctx.beginPath();
                    if (v === OFF) {
                        // 押し込む円だけリング。ひと目で他と区別がつく
                        ctx.strokeStyle = 'rgba(0,0,0,0.28)';
                        ctx.lineWidth = Math.max(1, dpr);
                        ctx.arc(cx, cy, 3.5 * dpr, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = v === ON
                            ? (outline ? 'rgba(0,0,0,0.30)' : 'rgba(255,255,255,0.24)')
                            : 'rgba(0,0,0,0.2)';
                        ctx.arc(cx, cy, 2.5 * dpr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }


        function update() { rebuild(); draw(); }

        // ===== 入力 =========================================================
        // タップ：杭を打つ／抜く。ドラッグで連続して打てる
        // 輪ゴムを掴んでドラッグ：跨いだ杭の内外が入れ替わる
        //   （＝輪ゴムをその杭の向こう側へ引っ掛ける／外す）
        const HOLD = 0.34, GRAB = 0.30;
        let painting = false, paintTo = ON;
        let dragging = false, startPos = null, dragPos = null;
        let anchorA = null, anchorB = null, anchorKeys = null, origState = null;
        let origSpan = null;   // 掴んだときの、留め具から留め具までの輪郭
        let restPath = null;   // 掴んでいない側の輪郭。ここは動かない
        // restPath の両端が、掴んだ辺が留め具から離れる接点そのものなので、
        // 伸ばした輪ゴムは「ポインタ＋動いていない側」で作れる

        function toWorld(ev) {
            const rect = cv.getBoundingClientRect();
            const vb = view();
            const scale = rect.width / vb.size;
            return { x: (ev.clientX - rect.left) / scale + vb.x, y: (ev.clientY - rect.top) / scale + vb.y };
        }

        function pickCell(x, y) {
            const i = Math.round(x / sx), j = Math.round(y / sy);
            if (i < 0 || j < 0 || i >= cols || j >= rows) return null;
            if (Math.hypot(x - CX(i), y - CY(j)) > HOLD * S) return null;
            return key(i, j);
        }

        // 輪ゴムまでの距離
        function bandDist(x, y) {
            if (mode !== 'edge' || !loops.length) return Infinity;
            const e = [0, 0, 0, 0];
            let d = Infinity;
            for (const loop of loops)
                for (let i = 0, j = loop.length - 1; i < loop.length; j = i++) {
                    e[0] = loop[j][0]; e[1] = loop[j][1]; e[2] = loop[i][0]; e[3] = loop[i][1];
                    const dd = segDist(x, y, e);
                    if (dd < d) d = dd;
                }
            return d;
        }

        // 掴んだ辺の両端の杭を留め具にする。ここが動かないので、
        // どれだけ深く引いても操作の対象が別の辺に乗り移らない
        function grabAnchors(x, y) {
            const loop = loops[0];
            if (!loop || !bandContacts || !pathOwner.length) return false;
            let n = 0, bd = Infinity;
            for (let i = 0; i < loop.length; i++) {
                const d = Math.hypot(x - loop[i][0], y - loop[i][1]);
                if (d < bd) { bd = d; n = i; }
            }
            const m = bandContacts.length;
            const o = pathOwner[n], o2 = pathOwner[(n + 1) % loop.length];
            // 直線を掴んだなら両端の接点、弧を掴んだならその前後の接点を留める
            const ia = o === o2 ? (o - 1 + m) % m : o;
            const ib = o === o2 ? (o + 1) % m : o2;
            anchorA = bandContacts[ia].c;
            anchorB = bandContacts[ib].c;
            anchorKeys = [bandContacts[ia].k, bandContacts[ib].k];
            // 留め具から留め具までの、元の輪郭をそのまま取っておく。
            // 掃いた範囲はこれと V のあいだで測る。留め具を結ぶ直線で測ると、
            // 外へ張り出している杭を内側へ押し出せない
            let sa = -1, sb = -1;
            for (let i = 0; i < loop.length; i++) if (pathOwner[i] === ia) sa = i;
            for (let i = 0; i < loop.length; i++) if (pathOwner[i] === ib) { sb = i; break; }
            origSpan = [anchorA];
            restPath = [];
            if (sa >= 0 && sb >= 0) {
                for (let i = (sa + 1) % loop.length; i !== sb; i = (i + 1) % loop.length)
                    origSpan.push(loop[i]);
                for (let i = sb; i !== sa; i = (i + 1) % loop.length) restPath.push(loop[i]);
                restPath.push(loop[sa]);
            }
            origSpan.push(anchorB);
            return restPath.length > 1;
        }

        // 引っぱったあとの輪ゴム全体（動かしていない部分＋V）を作って、
        // 各杭がその内側かどうかで決める。
        // 掴んだ辺と V だけで囲むと、遠くまで引いたときに V の脚が図形の
        // 反対側を横切って、無関係な杭まで巻き込む
        function applyDrag(pos) {
            const moved = [[pos.x, pos.y]].concat(restPath);
            let any = false;
            const next = new Map();
            for (const [k, v] of origState) {
                const [i, j] = k.split(',').map(Number);
                const nv = anchorKeys.includes(k) ? v
                    : (pointInPoly([CX(i), CY(j)], moved) ? ON : OFF);
                next.set(k, nv);
                if (nv === ON) any = true;
            }
            if (!any) return false;                       // 抱える杭が無くなると張れない
            let changed = false;
            for (const [k, v] of next) if (stateAt(k) !== v) { setCell(k, v); changed = true; }
            return changed;
        }

        cv.addEventListener('pointerdown', e => {
            const w = toWorld(e);
            const k = pickCell(w.x, w.y);
            // 輪ゴムと杭の、近いほうを掴む。
            // 空セルより輪ゴムを優先しないと、直線の真ん中を掴もうとしたときに
            // その辺りのセルに杭が生えてしまう
            const db = bandDist(w.x, w.y);
            const dk = k ? Math.hypot(w.x - CX(+k.split(',')[0]), w.y - CY(+k.split(',')[1])) : Infinity;
            if (db < GRAB * S && db < dk && grabAnchors(w.x, w.y)) {
                cv.setPointerCapture(e.pointerId);
                dragging = true; startPos = dragPos = w;
                origState = new Map(grid);
                draw();
                return;
            }
            if (!k) return;
            cv.setPointerCapture(e.pointerId);
            painting = true;
            paintTo = stateAt(k) === NEUTRAL ? ON : NEUTRAL;
            setCell(k, paintTo);
            update();
        });

        cv.addEventListener('pointermove', e => {
            const w = toWorld(e);
            if (dragging) {
                dragPos = w;
                if (applyDrag(w)) update(); else draw();
                return;
            }
            if (!painting) return;
            const k = pickCell(w.x, w.y);
            if (k && stateAt(k) !== paintTo) { setCell(k, paintTo); update(); }
        });

        cv.addEventListener('pointerup', e => {
            // 輪ゴムを掴んだまま動かさなかったら、その場のタップとして扱う。
            // 輪ゴムが掛かっている杭も抜けるようにするため
            if (dragging) {
                const w = toWorld(e);
                if (Math.hypot(w.x - startPos.x, w.y - startPos.y) < 0.1 * S) {
                    const k = pickCell(w.x, w.y);
                    if (k) setCell(k, stateAt(k) === NEUTRAL ? ON : NEUTRAL);
                }
            }
            painting = false; dragging = false; origState = null; origSpan = restPath = null;
            update();
        });
        cv.addEventListener('pointercancel', () => {
            if (dragging && origState) for (const [k, v] of origState) setCell(k, v);
            painting = false; dragging = false; origState = null; origSpan = restPath = null; origSpan = null;
            update();
        });

        // ===== コントロール =================================================
        const weight = document.getElementById('weight');
        const weightVal = document.getElementById('weightVal');
        const gapEl = document.getElementById('gap');
        const gapValEl = document.getElementById('gapVal');

        function readSliders() {
            const g = gapEl.value / 1000;
            gap = GAP_MIN + (GAP_MAX - GAP_MIN) * g;
            sx = S / Math.sqrt(gap);
            sy = S * Math.sqrt(gap);
            gapValEl.textContent = Math.round(g * 100);
            const t = weight.value / 1000;
            // 杭は重ならない。半径の上限は最小の杭間隔の半分で、
            // そこに達すると隣の杭とちょうど接する
            radius = mode === 'blob'
                ? BLOB_MIN + (BLOB_MAX - BLOB_MIN) * t
                : Math.min(sx, sy) * 0.5 * (EDGE_MIN + (EDGE_MAX - EDGE_MIN) * t);
            weightVal.textContent = Math.round(t * 100);
        }
        for (const el of [weight, gapEl])
            el.addEventListener('input', () => { readSliders(); update(); });

        const viewSeg = document.getElementById('viewSeg');
        function refreshView() {
            viewSeg.innerHTML = '';
            for (const [v, label] of [[false, 'SOLID'], [true, 'LINE']]) {
                const b = document.createElement('button');
                b.textContent = label;
                b.className = 'wide' + (v === outline ? ' on' : '');
                b.onclick = () => { outline = v; refreshView(); draw(); };
                viewSeg.appendChild(b);
            }
        }

        const styleSeg = document.getElementById('styleSeg');
        function refreshStyle() {
            styleSeg.innerHTML = '';
            for (const m of ['edge', 'blob']) {
                const b = document.createElement('button');
                b.textContent = m.toUpperCase();
                b.className = 'wide' + (m === mode ? ' on' : '');
                b.onclick = () => { mode = m; refreshStyle(); readSliders(); update(); };
                styleSeg.appendChild(b);
            }
        }

        function buildSeg(el, min, max, get, set) {
            el.innerHTML = '';
            for (let n = min; n <= max; n++) {
                const b = document.createElement('button');
                b.textContent = n;
                b.className = n === get() ? 'on' : '';
                b.onclick = () => { set(n); };
                el.appendChild(b);
            }
        }
        const colsSeg = document.getElementById('colsSeg');
        const rowsSeg = document.getElementById('rowsSeg');
        function refreshSegs() {
            buildSeg(colsSeg, 3, 6, () => cols, n => { resize(n, rows); });
            buildSeg(rowsSeg, 4, 7, () => rows, n => { resize(cols, n); });
        }
        function resize(c, r) {
            cols = c; rows = r;
            for (const k of [...grid.keys()]) {
                const [i, j] = k.split(',').map(Number);
                if (i >= cols || j >= rows) grid.delete(k);
            }
            refreshSegs();
            update();
        }

        document.getElementById('btnClear').onclick = () => { grid.clear(); update(); };

        // ===== 書き出し =====================================================
        // プレビューと同じ loops から作る。別計算しない
        function svgText() {
            const vb = view();
            const K = 100;
            const d = loops.map(l =>
                'M' + l.map(p => (p[0] * K).toFixed(2) + ' ' + (p[1] * K).toFixed(2)).join('L') + 'Z'
            ).join('');
            const size = (vb.size * K).toFixed(2);
            // プレビューと同じ見え方で出す
            const paint = outline
                ? 'fill="none" stroke="#e03131" stroke-width="' + (1.6 / 540 * vb.size * K).toFixed(2) + '"'
                : 'fill="#000" fill-rule="evenodd"';
            return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
                (vb.x * K).toFixed(2) + ' ' + (vb.y * K).toFixed(2) + ' ' + size + ' ' + size +
                '" width="' + size + '" height="' + size + '">\n' +
                '  <path d="' + d + '" ' + paint + '/>\n</svg>\n';
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove('show'), 1400);
        }

        function download(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        document.getElementById('btnSvg').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            download(new Blob([svgText()], { type: 'image/svg+xml' }), 'blob-type.svg');
        };

        document.getElementById('btnCopy').onclick = async () => {
            if (!loops.length) return toast('EMPTY');
            const text = svgText();
            try {
                await navigator.clipboard.writeText(text);
                toast('COPIED');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                toast('COPIED');
            }
        };

        document.getElementById('btnPng').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            const vb = view();
            const px = 1024;
            const c = document.createElement('canvas');
            c.width = c.height = px;
            const g = c.getContext('2d');
            g.fillStyle = '#fff';
            g.fillRect(0, 0, px, px);
            const scale = px / vb.size;
            const p = new Path2D();
            for (const l of loops) {
                p.moveTo((l[0][0] - vb.x) * scale, (l[0][1] - vb.y) * scale);
                for (let i = 1; i < l.length; i++) p.lineTo((l[i][0] - vb.x) * scale, (l[i][1] - vb.y) * scale);
                p.closePath();
            }
            if (outline) {
                g.strokeStyle = '#e03131';
                g.lineWidth = px / 540 * 1.6;
                g.stroke(p);
            } else {
                g.fillStyle = '#000';
                g.fill(p, 'evenodd');
            }
            c.toBlob(b => download(b, 'blob-type.png'), 'image/png');
        };

        // ===== 初期状態 =====================================================
        // 起動時のかたち。バーと縦棒の杭を輪ゴムで囲み、両脇から押し込んである
        cols = 5; rows = 4;
        ['0,3', '1,3', '2,3', '3,3', '4,3', '2,0', '2,1', '2,2'].forEach(k => setCell(k, ON));
        ['1,1', '3,1', '1,2', '3,2'].forEach(k => setCell(k, OFF));

        refreshSegs();
        refreshStyle();
        refreshView();
        readSliders();
        update();
        window.addEventListener('resize', draw);
    </script>
</body>

</html>
