<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Type</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 48px;
            gap: 20px;
        }

        header {
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        h1 {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.14em;
        }

        .hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.32);
            letter-spacing: 0.06em;
        }

        .stage {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .panel {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .row label {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.42);
            width: 74px;
            flex-shrink: 0;
        }

        .value {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 20px;
            background: transparent;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 1px;
            background: rgba(255, 255, 255, 0.22);
        }

        input[type=range]::-moz-range-track {
            height: 1px;
            background: rgba(255, 255, 255, 0.22);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            margin-top: -6.5px;
        }

        input[type=range]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            background: #fff;
        }

        .seg {
            display: flex;
            gap: 4px;
        }

        .seg button {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.12s;
        }

        .seg button:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .seg button.wide {
            width: 64px;
            letter-spacing: 0.08em;
        }

        .seg button.on {
            background: #fff;
            border-color: #fff;
            color: #0f0f0f;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .actions button {
            padding: 11px 0;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: transparent;
            color: rgba(255, 255, 255, 0.82);
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.1em;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.12s;
        }

        .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .actions button:active {
            background: rgba(255, 255, 255, 0.18);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(8px);
            background: #fff;
            color: #0f0f0f;
            font-size: 10px;
            letter-spacing: 0.08em;
            padding: 8px 14px;
            border-radius: 3px;
            opacity: 0;
            pointer-events: none;
            transition: 0.18s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <header>
        <h1>BLOB TYPE</h1>
        <span class="hint">tap: · → fill → hole</span>
    </header>

    <div class="stage">
        <canvas id="cv"></canvas>
    </div>

    <div class="panel">
        <div class="row">
            <label>STYLE</label>
            <div class="seg" id="styleSeg"></div>
            <label style="width:auto;margin-left:12px">VIEW</label>
            <div class="seg" id="viewSeg"></div>
        </div>
        <div class="row">
            <label>WEIGHT</label>
            <input type="range" id="weight" min="0" max="1000" value="860">
            <span class="value" id="weightVal">86</span>
        </div>
        <div class="row">
            <label>GAP</label>
            <input type="range" id="gap" min="0" max="1000" value="460">
            <span class="value" id="gapVal">46</span>
        </div>
        <div class="row">
            <label>COLS</label>
            <div class="seg" id="colsSeg"></div>
            <label style="width:auto;margin-left:12px">ROWS</label>
            <div class="seg" id="rowsSeg"></div>
        </div>
        <div class="actions">
            <button id="btnClear">CLEAR</button>
            <button id="btnCopy">COPY SVG</button>
            <button id="btnSvg">SVG</button>
            <button id="btnPng">PNG</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== モデル =====================================================
        // セル間隔を 1 とする単位系で全部計算する。書き出し時だけ 100 倍する。
        //
        // プレートに杭を打ち、その外側に糸を張ったもの、と考える。
        // ON の杭は距離に関係なく必ず糸の内側に入るので、素の形は ON の杭
        // ぜんぶの凸包になる。OFF の杭は糸の外側から押し込んで形を彫る。
        // NEUTRAL は杭が打たれていないので糸が素通りする。
        //
        // 杭どうしは絶対に重ならない（半径は杭間隔の半分まで）。これが効いていて、
        // 重ならない円は隙間を囲めないので、押し込みの合間に取り残された島は
        // 発生しない。糸の内側に完全に入った杭は、そのまま真円の穴になる。
        const S = 1;
        const THRESHOLD = 1.0;
        const RES = 12;          // セル間隔あたりのサンプル数
        const MARGIN = 1;        // サンプリング領域の余白（セル）
        // BLOB（メタボール）用
        const BLOB_MIN = 0.30, BLOB_MAX = 0.54;
        const FADE_IN = 1.5;     // ここから寄与を落とし始める（セル単位）
        const FADE_OUT = 2.1;    // ここで寄与ゼロ
        // EDGE（糸）用。杭間隔の半分に対する割合
        const EDGE_MIN = 0.30, EDGE_MAX = 0.97;   // 1.0 ちょうどは杭が接して糸の通り道が消える
        const GAP_MIN = 0.62, GAP_MAX = 1.45;   // 行間（列間を1としたときの比）

        const ON = 1, OFF = -1, NEUTRAL = 0;
        const NEXT = { 0: ON, 1: OFF, '-1': NEUTRAL };

        let cols = 4, rows = 5;
        let grid = new Map();    // "i,j" -> ON | OFF。持っていないセルは NEUTRAL
        let mode = 'edge';       // 'edge' | 'blob'
        let radius = 0.55;
        let gapY = 1;            // 行間。円の間隔を変えると張り方が変わる
        let outline = false;     // 輪郭線だけ表示するモード
        let loops = [];          // 張り直したポリライン（プレビューと書き出しで共用）

        const key = (i, j) => i + ',' + j;
        const stateAt = k => grid.get(k) || NEUTRAL;
        // 格子の座標。行間だけ可変
        const CX = i => i * S;
        const CY = j => j * S * gapY;
        function setCell(k, v) { if (v === NEUTRAL) grid.delete(k); else grid.set(k, v); }

        let HULL = [];   // ON 円の中心の凸包
        let PUSH = [];   // OFF 円の中心 [[x, y], ...]
        let ONC = [];    // ON 円の中心 [[x, y], ...]

        function convexHull(pts) {
            if (pts.length < 3) return pts.slice();
            const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
            const half = src => {
                const h = [];
                for (const q of src) {
                    while (h.length >= 2 && cross(h[h.length - 2], h[h.length - 1], q) <= 0) h.pop();
                    h.push(q);
                }
                h.pop();
                return h;
            };
            const hull = half(p).concat(half(p.slice().reverse()));
            return hull.length ? hull : p.slice(0, 2);
        }

        function build() {
            ONC = []; PUSH = [];
            for (const [k, v] of grid) {
                const [i, j] = k.split(',').map(Number);
                (v === ON ? ONC : PUSH).push([CX(i), CY(j)]);
            }
            HULL = convexHull(ONC);
        }

        // 点 (x, y) から線分 p までの距離
        function segDist(x, y, p) {
            const vx = p[2] - p[0], vy = p[3] - p[1];
            const wx = x - p[0], wy = y - p[1];
            const vv = vx * vx + vy * vy;
            let t = vv > 0 ? (wx * vx + wy * vy) / vv : 0;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const dx = wx - t * vx, dy = wy - t * vy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // ON 円の中心がつくる凸包までの符号付き距離（内側が負）
        const edgeBuf = [0, 0, 0, 0];
        function hullSD(x, y) {
            const n = HULL.length;
            if (!n) return Infinity;
            if (n === 1) return Math.hypot(x - HULL[0][0], y - HULL[0][1]);
            let d = Infinity, inside = false;
            for (let i = 0, j = n - 1; i < n; j = i++) {
                const a = HULL[j], b = HULL[i];
                edgeBuf[0] = a[0]; edgeBuf[1] = a[1]; edgeBuf[2] = b[0]; edgeBuf[3] = b[1];
                const dd = segDist(x, y, edgeBuf);
                if (dd < d) d = dd;
                if (n > 2 && (a[1] > y) !== (b[1] > y)
                    && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
            }
            return inside ? -d : d;
        }

        // ===== スカラー場 =================================================
        // 内側は f >= THRESHOLD。両モードとも同じ閾値に揃えてある
        function field(x, y) {
            if (mode === 'blob') {
                let sum = 0;
                for (let n = 0; n < ONC.length; n++) {
                    const dx = x - ONC[n][0], dy = y - ONC[n][1];
                    const d2 = dx * dx + dy * dy;
                    if (d2 < 1e-9) return 1e9;
                    const d = Math.sqrt(d2);
                    if (d >= FADE_OUT) continue;
                    let w = 1;
                    if (d > FADE_IN) {
                        // 裾を滑らかに殺す。ハードクリップだと等値線にカクが出る
                        const t = (d - FADE_IN) / (FADE_OUT - FADE_IN);
                        w = 1 - t * t * (3 - 2 * t);
                    }
                    sum += (radius / d) * (radius / d) * w;
                }
                return sum;
            }
            // 凸包を半径ぶん太らせたものから、OFF の円を引く。
            // ここで出るのは張り直し前の形で、位相を決めるためだけに使う
            let f = radius - hullSD(x, y);
            for (let n = 0; n < PUSH.length; n++) {
                const dx = x - PUSH[n][0], dy = y - PUSH[n][1];
                const g = Math.sqrt(dx * dx + dy * dy) - radius;
                if (g < f) f = g;
            }
            return THRESHOLD + f;
        }

        // ===== マーチングスクエア =========================================
        // 交点は格子辺そのものに乗るので、辺ID で頂点を同一視する。
        // 浮動小数の座標をキーにすると繋ぎ損ねるため。
        function contour() {
            build();
            if (!ONC.length) return [];

            const x0 = -MARGIN, y0 = -MARGIN;
            const step = S / RES;
            const nx = Math.ceil(((cols - 1) * S + MARGIN * 2) / step);
            const ny = Math.ceil((CY(rows - 1) + MARGIN * 2) / step);
            const px = i => x0 + i * step;
            const py = j => y0 + j * step;

            const v = new Float32Array((nx + 1) * (ny + 1));
            for (let j = 0; j <= ny; j++)
                for (let i = 0; i <= nx; i++)
                    v[j * (nx + 1) + i] = field(px(i), py(j));
            const val = (i, j) => v[j * (nx + 1) + i];

            const pos = new Map();   // 辺ID -> [x, y]
            const adj = new Map();   // 辺ID -> [辺ID, ...]
            const lerp = (a, b) => (THRESHOLD - a) / (b - a);

            function hEdge(i, j) {           // (i,j)-(i+1,j)
                const id = 'h' + i + '_' + j;
                if (!pos.has(id)) pos.set(id, [px(i) + lerp(val(i, j), val(i + 1, j)) * step, py(j)]);
                return id;
            }
            function vEdge(i, j) {           // (i,j)-(i,j+1)
                const id = 'v' + i + '_' + j;
                if (!pos.has(id)) pos.set(id, [px(i), py(j) + lerp(val(i, j), val(i, j + 1)) * step]);
                return id;
            }
            function link(a, b) {
                if (!adj.has(a)) adj.set(a, []);
                if (!adj.has(b)) adj.set(b, []);
                adj.get(a).push(b);
                adj.get(b).push(a);
            }

            for (let j = 0; j < ny; j++) {
                for (let i = 0; i < nx; i++) {
                    const tl = val(i, j) >= THRESHOLD, tr = val(i + 1, j) >= THRESHOLD;
                    const br = val(i + 1, j + 1) >= THRESHOLD, bl = val(i, j + 1) >= THRESHOLD;
                    const c = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
                    if (c === 0 || c === 15) continue;
                    const T = () => hEdge(i, j), B = () => hEdge(i, j + 1);
                    const L = () => vEdge(i, j), R = () => vEdge(i + 1, j);
                    switch (c) {
                        case 1: case 14: link(L(), B()); break;
                        case 2: case 13: link(B(), R()); break;
                        case 3: case 12: link(L(), R()); break;
                        case 4: case 11: link(T(), R()); break;
                        case 6: case 9: link(T(), B()); break;
                        case 7: case 8: link(L(), T()); break;
                        case 5: case 10: {
                            // 曖昧ケース。セル中心の場の値で接続を決める
                            const center = field(px(i) + step / 2, py(j) + step / 2) >= THRESHOLD;
                            // TL/BR 側を切り落とすか、TR/BL 側を切り落とすか
                            const cutTLBR = (c === 5) ? center : !center;
                            if (cutTLBR) { link(L(), T()); link(B(), R()); }
                            else { link(T(), R()); link(L(), B()); }
                            break;
                        }
                    }
                }
            }

            // 辺IDは必ず2本のセグメントに共有される（＝次数2）ので素直に閉ループになる
            const seen = new Set();
            const out = [];
            for (const start of adj.keys()) {
                if (seen.has(start)) continue;
                const loop = [];
                let cur = start, prev = null;
                while (cur !== undefined && !seen.has(cur)) {
                    seen.add(cur);
                    loop.push(pos.get(cur));
                    const ns = adj.get(cur);
                    const next = ns.find(n => n !== prev && !seen.has(n));
                    prev = cur;
                    cur = next;
                }
                if (loop.length > 2) out.push(loop);
            }
            return out;
        }

        // ===== Chaikin =====================================================
        function chaikin(loop, times) {
            let p = loop;
            for (let t = 0; t < times; t++) {
                const q = [];
                for (let i = 0; i < p.length; i++) {
                    const a = p[i], b = p[(i + 1) % p.length];
                    q.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
                    q.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
                }
                p = q;
            }
            return p;
        }

        // ===== 糸を張り直す =================================================
        // 等値線は位相を決めるためだけのもの。ピンと張った糸は、円に当たらない
        // 限り次の接点まで直線で行くので、要らない頂点を落として結び直す。
        //
        // 落としてよいのは、飛ばす弦がどの円にも当たらず、かつ
        // 三角形 abc の中に円の中心が入っていないとき。後者を見ないと、
        // 離れた2円のあいだで糸がくびれて千切れる
        function tighten(loop) {
            const EPS = 1e-4;
            const cs = ONC.concat(PUSH);   // 糸はどの杭も跨げない
            if (!cs.length) return loop;
            const chord = [0, 0, 0, 0];
            const clear = (a, b) => {
                chord[0] = a[0]; chord[1] = a[1]; chord[2] = b[0]; chord[3] = b[1];
                for (let n = 0; n < cs.length; n++)
                    if (segDist(cs[n][0], cs[n][1], chord) < radius - EPS) return false;
                return true;
            };
            const side = (p, a, b) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
            const hits = (list, a, b, c) => {
                for (let n = 0; n < list.length; n++) {
                    const p = list[n];
                    const s1 = side(p, a, b), s2 = side(p, b, c), s3 = side(p, c, a);
                    if ((s1 > 0 && s2 > 0 && s3 > 0) || (s1 < 0 && s2 < 0 && s3 < 0)) return true;
                }
                return false;
            };
            // 凸の頂点を落とすと三角形のぶん縮み、凹の頂点なら膨らむ。
            // 縮む手は ON の杭を外に出してはいけない。膨らむ手は OFF の杭を
            // 飲み込んではいけない。両方を一律に守ると、糸が押し込む杭の
            // 裏側まで回り込んだまま外れなくなる
            const orient = signedArea(loop) > 0 ? 1 : -1;
            let pts = loop;
            for (let pass = 0; pass < 40; pass++) {
                const n = pts.length;
                if (n < 5) break;
                const out = [];
                let skip = false, removed = false;
                for (let i = 0; i < n; i++) {
                    if (skip) { skip = false; out.push(pts[i]); continue; }
                    const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
                    const turn = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
                    const guard = turn * orient > 0 ? ONC : PUSH;
                    if (clear(a, c) && !hits(guard, a, b, c)) {
                        // 隣どうしを同じ回で落とすと三角形の判定が成り立たなくなる
                        skip = true; removed = true;
                        continue;
                    }
                    out.push(b);
                }
                if (!removed || out.length < 5) break;
                pts = out;
            }
            return pts;
        }

        function signedArea(loop) {
            let a = 0;
            for (let i = 0; i < loop.length; i++) {
                const p = loop[i], q = loop[(i + 1) % loop.length];
                a += p[0] * q[1] - q[0] * p[1];
            }
            return a / 2;
        }

        function pointInPoly(p, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const a = poly[j], b = poly[i];
                if ((a[1] > p[1]) !== (b[1] > p[1])
                    && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
            }
            return inside;
        }

        function distToPoly(p, poly) {
            const e = [0, 0, 0, 0];
            let d = Infinity;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                e[0] = poly[j][0]; e[1] = poly[j][1]; e[2] = poly[i][0]; e[3] = poly[i][1];
                const dd = segDist(p[0], p[1], e);
                if (dd < d) d = dd;
            }
            return d;
        }

        function circlePoly(c, r) {
            const out = [];
            for (let n = 0; n < 64; n++) {
                const a = n / 64 * Math.PI * 2;
                out.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]);
            }
            return out;
        }

        function rebuild() {
            if (mode === 'blob') {
                loops = contour().map(l => chaikin(l, 2))
                    .filter(l => Math.abs(signedArea(l)) > 2e-3);
                return;
            }
            const raw = contour();
            if (!raw.length) { loops = []; return; }
            // 外周は一本の糸。面積が最大のループがそれ
            let outer = raw[0], best = -1;
            for (const l of raw) {
                const a = Math.abs(signedArea(l));
                if (a > best) { best = a; outer = l; }
            }
            outer = tighten(outer);   // 張り直すので平滑化はしない
            loops = [outer];
            // 糸の内側に完全に入った杭は、そのまま真円の穴になる。
            // 等値線が出す他のループ（接する杭どうしの隙間に取り残された島など）は
            // 捨てる。糸が届かない場所に図形はできない
            for (const c of PUSH) {
                if (!pointInPoly(c, outer)) continue;
                if (distToPoly(c, outer) < radius - 1e-6) continue;
                loops.push(circlePoly(c, radius));
            }
        }

        // ===== 描画 =========================================================
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');

        function view() {
            // グリッド外形＋余白 0.8 セル。プレビューと SVG で同じ枠を使う
            const pad = 0.8;
            const w = (cols - 1) * S + pad * 2;
            const h = CY(rows - 1) + pad * 2;
            const side = Math.max(w, h);
            return { x: -pad - (side - w) / 2, y: -pad - (side - h) / 2, size: side };
        }

        function pathFromLoops(scale, ox, oy) {
            const p = new Path2D();
            for (const l of loops) {
                p.moveTo(ox + l[0][0] * scale, oy + l[0][1] * scale);
                for (let i = 1; i < l.length; i++) p.lineTo(ox + l[i][0] * scale, oy + l[i][1] * scale);
                p.closePath();
            }
            return p;
        }

        function draw() {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const rect = cv.getBoundingClientRect();
            cv.width = Math.round(rect.width * dpr);
            cv.height = Math.round(rect.height * dpr);
            const vb = view();
            const scale = cv.width / vb.size;
            const ox = -vb.x * scale, oy = -vb.y * scale;

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, cv.width, cv.height);

            const cr = (mode === 'edge' ? radius : 0.4 * S) * scale;

            if (outline) {
                // 糸がどの円に張られているかを見るモード。
                // 円を実寸で見せて、輪郭は線だけにする
                for (const [k, v] of grid) {
                    const [i, j] = k.split(',').map(Number);
                    ctx.beginPath();
                    ctx.arc(ox + CX(i) * scale, oy + CY(j) * scale,
                            cr, 0, Math.PI * 2);
                    if (v === ON) {
                        ctx.fillStyle = '#e6e6e6';
                        ctx.fill();
                    } else {
                        // 内側から押している円は塗らずに破線で
                        ctx.fillStyle = '#fafafa';
                        ctx.fill();
                        ctx.strokeStyle = '#cfcfcf';
                        ctx.lineWidth = Math.max(1, dpr);
                        ctx.setLineDash([4 * dpr, 3 * dpr]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
                ctx.strokeStyle = '#e03131';
                ctx.lineWidth = 1.6 * dpr;
                ctx.stroke(pathFromLoops(scale, ox, oy));
            } else {
                // OFF セルは実寸で下敷きに描く。押している円が見える
                ctx.fillStyle = '#efefef';
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = Math.max(1, dpr);
                for (const [k, v] of grid) {
                    if (v !== OFF) continue;
                    const [i, j] = k.split(',').map(Number);
                    ctx.beginPath();
                    ctx.arc(ox + CX(i) * scale, oy + CY(j) * scale, cr, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.fillStyle = '#000';
                ctx.fill(pathFromLoops(scale, ox, oy), 'evenodd');
            }

            // 格子が見えないと編集しづらいので、シルエットの上に印を置く
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    const v = stateAt(key(i, j));
                    const cx = ox + CX(i) * scale, cy = oy + CY(j) * scale;
                    ctx.beginPath();
                    if (v === OFF) {
                        // 押し込む円だけリング。ひと目で他と区別がつく
                        ctx.strokeStyle = 'rgba(0,0,0,0.28)';
                        ctx.lineWidth = Math.max(1, dpr);
                        ctx.arc(cx, cy, 3.5 * dpr, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = v === ON
                            ? (outline ? 'rgba(0,0,0,0.30)' : 'rgba(255,255,255,0.24)')
                            : 'rgba(0,0,0,0.13)';
                        ctx.arc(cx, cy, 2.5 * dpr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }


        function update() { rebuild(); draw(); }

        // ===== 入力 =========================================================
        // タップ：セルを NEUTRAL → ON → OFF と一巡
        // ドラッグ：最初に触れたセルで決まった状態を塗り続ける
        const HOLD = 0.34;
        let painting = false, paintTo = ON;

        function toWorld(ev) {
            const rect = cv.getBoundingClientRect();
            const vb = view();
            const scale = rect.width / vb.size;
            return { x: (ev.clientX - rect.left) / scale + vb.x, y: (ev.clientY - rect.top) / scale + vb.y };
        }

        function pickCell(x, y) {
            const i = Math.round(x / S), j = Math.round(y / (S * gapY));
            if (i < 0 || j < 0 || i >= cols || j >= rows) return null;
            if (Math.hypot(x - CX(i), y - CY(j)) > HOLD * S) return null;
            return key(i, j);
        }

        cv.addEventListener('pointerdown', e => {
            const w = toWorld(e);
            const k = pickCell(w.x, w.y);
            if (!k) return;
            cv.setPointerCapture(e.pointerId);
            painting = true;
            paintTo = NEXT[stateAt(k)];
            setCell(k, paintTo);
            update();
        });

        cv.addEventListener('pointermove', e => {
            if (!painting) return;
            const w = toWorld(e);
            const k = pickCell(w.x, w.y);
            if (k && stateAt(k) !== paintTo) { setCell(k, paintTo); update(); }
        });

        const stopPaint = () => { painting = false; };
        cv.addEventListener('pointerup', stopPaint);
        cv.addEventListener('pointercancel', stopPaint);

        // ===== コントロール =================================================
        const weight = document.getElementById('weight');
        const weightVal = document.getElementById('weightVal');
        const gapEl = document.getElementById('gap');
        const gapValEl = document.getElementById('gapVal');

        function readSliders() {
            const g = gapEl.value / 1000;
            gapY = GAP_MIN + (GAP_MAX - GAP_MIN) * g;
            gapValEl.textContent = Math.round(g * 100);
            const t = weight.value / 1000;
            // 杭は重ならない。半径の上限は最小の杭間隔の半分で、
            // そこに達すると隣の杭とちょうど接する
            radius = mode === 'blob'
                ? BLOB_MIN + (BLOB_MAX - BLOB_MIN) * t
                : Math.min(S, S * gapY) * 0.5 * (EDGE_MIN + (EDGE_MAX - EDGE_MIN) * t);
            weightVal.textContent = Math.round(t * 100);
        }
        for (const el of [weight, gapEl])
            el.addEventListener('input', () => { readSliders(); update(); });

        const viewSeg = document.getElementById('viewSeg');
        function refreshView() {
            viewSeg.innerHTML = '';
            for (const [v, label] of [[false, 'SOLID'], [true, 'LINE']]) {
                const b = document.createElement('button');
                b.textContent = label;
                b.className = 'wide' + (v === outline ? ' on' : '');
                b.onclick = () => { outline = v; refreshView(); draw(); };
                viewSeg.appendChild(b);
            }
        }

        const styleSeg = document.getElementById('styleSeg');
        function refreshStyle() {
            styleSeg.innerHTML = '';
            for (const m of ['edge', 'blob']) {
                const b = document.createElement('button');
                b.textContent = m.toUpperCase();
                b.className = 'wide' + (m === mode ? ' on' : '');
                b.onclick = () => { mode = m; refreshStyle(); readSliders(); update(); };
                styleSeg.appendChild(b);
            }
        }

        function buildSeg(el, min, max, get, set) {
            el.innerHTML = '';
            for (let n = min; n <= max; n++) {
                const b = document.createElement('button');
                b.textContent = n;
                b.className = n === get() ? 'on' : '';
                b.onclick = () => { set(n); };
                el.appendChild(b);
            }
        }
        const colsSeg = document.getElementById('colsSeg');
        const rowsSeg = document.getElementById('rowsSeg');
        function refreshSegs() {
            buildSeg(colsSeg, 3, 6, () => cols, n => { resize(n, rows); });
            buildSeg(rowsSeg, 4, 7, () => rows, n => { resize(cols, n); });
        }
        function resize(c, r) {
            cols = c; rows = r;
            for (const k of [...grid.keys()]) {
                const [i, j] = k.split(',').map(Number);
                if (i >= cols || j >= rows) grid.delete(k);
            }
            refreshSegs();
            update();
        }

        document.getElementById('btnClear').onclick = () => { grid.clear(); update(); };

        // ===== 書き出し =====================================================
        // プレビューと同じ loops から作る。別計算しない
        function svgText() {
            const vb = view();
            const K = 100;
            const d = loops.map(l =>
                'M' + l.map(p => (p[0] * K).toFixed(2) + ' ' + (p[1] * K).toFixed(2)).join('L') + 'Z'
            ).join('');
            const size = (vb.size * K).toFixed(2);
            // プレビューと同じ見え方で出す
            const paint = outline
                ? 'fill="none" stroke="#e03131" stroke-width="' + (1.6 / 540 * vb.size * K).toFixed(2) + '"'
                : 'fill="#000" fill-rule="evenodd"';
            return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
                (vb.x * K).toFixed(2) + ' ' + (vb.y * K).toFixed(2) + ' ' + size + ' ' + size +
                '" width="' + size + '" height="' + size + '">\n' +
                '  <path d="' + d + '" ' + paint + '/>\n</svg>\n';
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove('show'), 1400);
        }

        function download(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        document.getElementById('btnSvg').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            download(new Blob([svgText()], { type: 'image/svg+xml' }), 'blob-type.svg');
        };

        document.getElementById('btnCopy').onclick = async () => {
            if (!loops.length) return toast('EMPTY');
            const text = svgText();
            try {
                await navigator.clipboard.writeText(text);
                toast('COPIED');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                toast('COPIED');
            }
        };

        document.getElementById('btnPng').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            const vb = view();
            const px = 1024;
            const c = document.createElement('canvas');
            c.width = c.height = px;
            const g = c.getContext('2d');
            g.fillStyle = '#fff';
            g.fillRect(0, 0, px, px);
            const scale = px / vb.size;
            const p = new Path2D();
            for (const l of loops) {
                p.moveTo((l[0][0] - vb.x) * scale, (l[0][1] - vb.y) * scale);
                for (let i = 1; i < l.length; i++) p.lineTo((l[i][0] - vb.x) * scale, (l[i][1] - vb.y) * scale);
                p.closePath();
            }
            if (outline) {
                g.strokeStyle = '#e03131';
                g.lineWidth = px / 540 * 1.6;
                g.stroke(p);
            } else {
                g.fillStyle = '#000';
                g.fill(p, 'evenodd');
            }
            c.toBlob(b => download(b, 'blob-type.png'), 'image/png');
        };

        // ===== 初期状態 =====================================================
        // 起動時は穴のある形。糸の内側に入った杭がそのまま真円の穴になる
        for (let j = 0; j < 5; j++)
            for (let i = 0; i < 4; i++) setCell(key(i, j), ON);
        setCell('1,1', OFF);
        setCell('2,3', OFF);

        refreshSegs();
        refreshStyle();
        refreshView();
        readSliders();
        update();
        window.addEventListener('resize', draw);
    </script>
</body>

</html>
