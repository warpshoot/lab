<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千葉県公立高校 英語 対策</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3441;
    --txt:#e6edf3; --sub:#8b98a9; --accent:#4fc3f7; --accent2:#66d9a8;
    --warn:#ffb454; --bad:#ff6b6b; --good:#66d9a8;
    --gram:#4fc3f7; --voc:#c792ea; --kaiwa:#66d9a8; --tech:#ffb454;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.7; padding-bottom:80px;
  }
  a{color:inherit}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}

  header{
    background:linear-gradient(135deg,#14263a,#0d1117);
    border-bottom:1px solid var(--line); padding:26px 0 22px; margin-bottom:8px;
  }
  header h1{font-size:20px;font-weight:700;letter-spacing:.02em}
  header p{color:var(--sub);font-size:13px;margin-top:4px}
  .prog-wrap{margin-top:16px}
  .prog-bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
  .prog-label{font-size:12px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}

  /* nav tabs */
  .tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:20;flex-wrap:wrap}
  .tab{
    flex:1;min-width:70px;text-align:center;padding:9px 4px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;
    color:var(--sub);cursor:pointer;transition:.15s;user-select:none;
  }
  .tab.active{color:var(--txt);border-color:var(--accent)}
  .tab[data-f="gram"].active{border-color:var(--gram);color:var(--gram)}
  .tab[data-f="voc"].active{border-color:var(--voc);color:var(--voc)}
  .tab[data-f="kaiwa"].active{border-color:var(--kaiwa);color:var(--kaiwa)}
  .tab[data-f="tech"].active{border-color:var(--tech);color:var(--tech)}
  .tab[data-f="test"].active{border-color:#fff;color:#fff}

  section{display:none;animation:fade .3s}
  section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .field-head{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
  .field-dot{width:12px;height:12px;border-radius:50%}
  .field-head h2{font-size:17px}
  .field-head .cnt{margin-left:auto;font-size:12px;color:var(--sub)}

  .unit{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .unit-head{display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;user-select:none}
  .unit-head:hover{background:var(--panel2)}
  .unit-grade{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--sub);white-space:nowrap}
  .unit-title{font-weight:700;font-size:15px;flex:1}
  .unit-check{font-size:16px;width:22px;text-align:center}
  .unit-arrow{color:var(--sub);transition:transform .2s;font-size:12px}
  .unit.open .unit-arrow{transform:rotate(90deg)}
  .unit-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
  .unit.open .unit-body{display:block}

  h3.sec{font-size:13px;color:var(--accent);margin:16px 0 8px;font-weight:700;letter-spacing:.03em}
  .points{list-style:none}
  .points li{padding:7px 0 7px 22px;position:relative;font-size:14px;border-bottom:1px dashed var(--line)}
  .points li:last-child{border-bottom:none}
  .points li::before{content:"▸";position:absolute;left:2px;color:var(--accent2)}
  .kw{color:var(--warn);font-weight:700}
  .fm{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px}
  .fm .en{font-weight:700;letter-spacing:.01em}
  .fm .ja{color:var(--sub);font-size:13px}

  /* quiz */
  .q{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .q-txt{font-size:14px;font-weight:600;margin-bottom:10px}
  .q-txt .num{color:var(--accent);margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{padding:10px 13px;border-radius:9px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:14px;transition:.12s}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:rgba(102,217,168,.18);border-color:var(--good)}
  .opt.wrong{background:rgba(255,107,107,.16);border-color:var(--bad)}
  .opt.disabled{cursor:default;pointer-events:none;opacity:.55}
  .opt.disabled.correct,.opt.disabled.wrong{opacity:1}
  .expl{display:none;margin-top:10px;padding:10px 12px;background:var(--panel);border-radius:8px;font-size:13px;border-left:3px solid var(--accent2)}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}

  .btn{display:inline-block;padding:9px 16px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#04222f;border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default;pointer-events:none}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}

  /* test mode */
  .test-intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
  .test-intro h2{font-size:18px;margin-bottom:8px}
  .test-intro p{color:var(--sub);font-size:14px;margin-bottom:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{padding:7px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:13px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--accent);color:#04222f;border-color:var(--accent)}
  .result-card{text-align:center;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:16px 0}
  .result-score{font-size:44px;font-weight:800;color:var(--accent)}
  .result-msg{color:var(--sub);margin-top:6px}
  .qcount{font-size:12px;color:var(--sub);text-align:right;margin-bottom:4px}

  /* flashcard (単語カード) */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 20px;margin:14px 0;min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .card-field{font-size:12px;color:var(--sub);margin-bottom:12px;font-weight:700}
  .card-q{font-size:24px;font-weight:700;line-height:1.6}
  .card-a{font-size:24px;font-weight:800;color:var(--accent2);margin-top:18px;display:none}
  .card.revealed .card-a{display:block;animation:fade .25s}
  .card-hint{font-size:12px;color:var(--sub);margin-top:16px}
  .grade-row{display:flex;gap:10px;margin:10px 0}
  .grade-row .btn{flex:1;text-align:center;padding:13px}
  .btn.ng{border-color:var(--bad);color:var(--bad)}
  .btn.ok{border-color:var(--good);color:var(--good)}
  .qa-stat{display:flex;justify-content:space-around;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;font-size:13px}
  .qa-stat b{display:block;font-size:22px;font-weight:800}
  .qa-stat .s-rem b{color:var(--accent)} .qa-stat .s-ok b{color:var(--good)} .qa-stat .s-ng b{color:var(--warn)}

  /* 並べかえ */
  .nb-ja{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:15px;font-weight:700;margin:12px 0}
  .nb-ja .nb-grade{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--sub);margin-right:8px;vertical-align:middle}
  .nb-zone{min-height:56px;background:var(--panel2);border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .nb-zone.empty::before{content:"ここに単語を並べよう";color:var(--sub);font-size:13px;padding-left:4px}
  .nb-pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:44px}
  .wchip{padding:9px 14px;border-radius:9px;background:var(--panel);border:1px solid var(--accent);font-size:15px;font-weight:600;cursor:pointer;user-select:none;transition:.12s}
  .wchip:hover{background:var(--panel2)}
  .nb-zone .wchip{border-color:var(--accent2)}
  .nb-result{display:none;margin-top:10px;padding:12px 14px;border-radius:9px;font-size:14px;line-height:1.7}
  .nb-result.show{display:block;animation:fade .25s}
  .nb-result.good{background:rgba(102,217,168,.14);border:1px solid var(--good)}
  .nb-result.bad{background:rgba(255,107,107,.12);border:1px solid var(--bad)}
  .nb-result .ans{font-weight:700}
  .nb-result .note{color:var(--sub);font-size:13px;margin-top:4px}

  /* 英作文 */
  .kj{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
  .kj-q{font-size:15px;font-weight:700;margin-bottom:6px}
  .kj-q .num{color:var(--tech)}
  .kj-a{display:none;margin-top:12px;padding:12px 14px;background:var(--panel2);border-radius:9px;border-left:3px solid var(--good);font-size:14px;line-height:1.7}
  .kj-a.show{display:block;animation:fade .25s}
  .kj-a .lbl{color:var(--good);font-weight:700;font-size:12px;display:block;margin-bottom:4px}
  .kj-point{color:var(--sub);font-size:13px;margin-top:8px}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
  .reset{color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🔤 千葉県公立高校 英語 対策</h1>
    <p>文法・単語・会話・読解の全範囲｜要点整理と確認テスト・並べかえ・英作文</p>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-label">
        <span>学習の進み具合</span>
        <span id="progText">0 / 0 単元</span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-f="gram">文法</div>
    <div class="tab" data-f="voc">単語・熟語</div>
    <div class="tab" data-f="kaiwa">会話表現</div>
    <div class="tab" data-f="tech">読解・入試</div>
    <div class="tab" data-f="qa">単語カード</div>
    <div class="tab" data-f="narabe">並べかえ</div>
    <div class="tab" data-f="sakubun">英作文</div>
    <div class="tab" data-f="jissen">リスニング・速読</div>
    <div class="tab" data-f="test">模試</div>
    <div class="tab" data-f="review">復習<span class="c-badge" id="reviewBadge"></span></div>
  </div>

  <div id="content"></div>

  <section id="sec-qa">
    <div id="qaArea"></div>
  </section>

  <section id="sec-narabe">
    <div id="narabeArea"></div>
  </section>

  <section id="sec-sakubun">
    <div id="sakubunArea"></div>
  </section>

  <section id="sec-jissen">
    <div id="listenArea"></div>
    <div id="sokudokuArea"></div>
  </section>

  <section id="sec-test">
    <div id="testArea"></div>
  </section>

  <section id="sec-review">
    <div id="reviewArea"></div>
  </section>

  <footer>
    千葉県公立高校入試（英語）学習教材 ・ 全範囲対応<br>
    進捗はこの端末に自動保存されます ・ <span class="reset" id="resetBtn">進捗をリセット</span>
  </footer>
</div>

<script src="../chiba-common.js"></script>
<script>
Chiba.init('eigo');
/* =========================================================================
   千葉県公立高校 英語 教材データ
   分野: gram(文法) voc(単語・熟語) kaiwa(会話表現) tech(読解・入試対策)
   各単元: grade, title, points[], ex[{en,ja}], quiz[{q,opts,a,e}]
   ========================================================================= */
const DATA = {
gram:{ name:"文法", color:"var(--gram)", units:[
  {id:"g1", grade:"中1", title:"be動詞・一般動詞（現在形）",
   points:[
     "be動詞（am / is / are）は「〜です・〜にいる」。主語で使い分け：I→<span class='kw'>am</span>、3人称単数→<span class='kw'>is</span>、you・複数→<span class='kw'>are</span>。",
     "一般動詞の文で、主語が3人称単数（he, she, itなど）のとき動詞に<span class='kw'>-s / -es</span>をつける（3単現のs）。",
     "一般動詞の否定文は <span class='kw'>don't / doesn't ＋ 動詞の原形</span>。doesn'tのとき動詞のsは消える。",
     "疑問文：be動詞は<span class='kw'>主語の前に出す</span>（Are you 〜?）。一般動詞は<span class='kw'>Do / Does</span>で始める。",
     "答え方はたずねられた動詞に合わせる：Do you 〜? → Yes, I <span class='kw'>do</span>. ／ Is he 〜? → Yes, he <span class='kw'>is</span>."
   ],
   ex:[
     {en:"I am a junior high school student.", ja:"私は中学生です。"},
     {en:"She plays tennis every day.", ja:"彼女は毎日テニスをします。"},
     {en:"Does he like music? — Yes, he does.", ja:"彼は音楽が好きですか。— はい、好きです。"}
   ],
   quiz:[
     {q:"My brother ( ) soccer very well.",opts:["play","plays","playing","is play"],a:1,e:"主語My brotherは3人称単数なので<b>plays</b>。3単現のsを忘れない。"},
     {q:"( ) your sister like cats? — Yes, she does.",opts:["Is","Do","Does","Are"],a:2,e:"一般動詞likeの疑問文で主語が3人称単数→<b>Does</b>。答えのdoesもヒント。"},
     {q:"Tom and Ken ( ) in the library now.",opts:["is","am","are","be"],a:2,e:"Tom and Kenは複数なので<b>are</b>。"},
     {q:"She ( ) watch TV on Sundays.",opts:["don't","doesn't","isn't","not"],a:1,e:"一般動詞watchの否定文で主語が3人称単数→<b>doesn't</b>＋動詞の原形。"}
   ]},
  {id:"g2", grade:"中1", title:"疑問詞（what / who / when / where / why / how）",
   points:[
     "疑問詞は<span class='kw'>文の先頭</span>に置き、そのあとは疑問文の語順（do you 〜? / is it 〜?）。",
     "what（何）／ who（だれ）／ whose（だれの）／ which（どちら）／ when（いつ）／ where（どこ）／ why（なぜ）／ how（どのように）。",
     "<span class='kw'>How many＋複数名詞</span>（数）、How much（値段・量）、How long（期間・長さ）、How often（頻度）、How old（年齢）。",
     "疑問詞が主語のときは<span class='kw'>疑問詞＋動詞</span>の語順（Who made this? — My mother did.）。",
     "Whyの質問には<span class='kw'>Because 〜.</span>（〜だから）や To 〜.（〜するため）で答える。"
   ],
   ex:[
     {en:"What time do you get up?", ja:"あなたは何時に起きますか。"},
     {en:"How many books do you have?", ja:"あなたは本を何冊持っていますか。"},
     {en:"Who made this cake? — My mother did.", ja:"だれがこのケーキを作りましたか。— 母です。"}
   ],
   quiz:[
     {q:"( ) do you go to school? — By bus.",opts:["What","When","How","Where"],a:2,e:"By bus（バスで）と手段を答えている→方法をたずねる<b>How</b>。"},
     {q:"( ) is your birthday? — It's May 5th.",opts:["When","Where","Who","How"],a:0,e:"日付を答えている→「いつ」をたずねる<b>When</b>。"},
     {q:"( ) made this cake? — My mother did.",opts:["What","Who","Whose","Which"],a:1,e:"「だれが作ったか」。疑問詞Whoが主語なので Who made 〜? の語順になる。"},
     {q:"How ( ) brothers do you have?",opts:["much","many","long","old"],a:1,e:"brothersは数えられる名詞の複数形→<b>How many</b>。値段や量ならHow much。"}
   ]},
  {id:"g3", grade:"中1", title:"命令文・can・現在進行形",
   points:[
     "命令文は<span class='kw'>動詞の原形</span>で文を始める。「〜するな」は<span class='kw'>Don't＋原形</span>、「〜しましょう」は<span class='kw'>Let's＋原形</span>。",
     "can（〜できる）のあとは<span class='kw'>動詞の原形</span>。主語が3人称単数でもsはつかない（He can swim.）。",
     "Can you 〜? は「〜してくれますか」（依頼）、Can I 〜? は「〜してもいいですか」（許可）の意味にもなる。",
     "現在進行形「〜している」は<span class='kw'>be動詞＋動詞のing形</span>。",
     "ing形の作り方：run→<span class='kw'>running</span>（重ねる）、make→<span class='kw'>making</span>（eをとる）、study→studying（そのまま）。",
     "like, want, know など状態を表す動詞はふつう<span class='kw'>進行形にしない</span>。"
   ],
   ex:[
     {en:"Be quiet in the library.", ja:"図書館では静かにしなさい。"},
     {en:"My sister can speak English well.", ja:"私の姉は英語を上手に話せます。"},
     {en:"They are playing soccer now.", ja:"彼らは今サッカーをしています。"}
   ],
   quiz:[
     {q:"Look! The children ( ) in the park.",opts:["run","runs","are running","ran"],a:2,e:"Look!（見て！）は「今まさに〜している」の合図→現在進行形<b>are running</b>。nを重ねる。"},
     {q:"( ) open the window. It's cold.",opts:["Don't","Doesn't","Not","Isn't"],a:0,e:"「窓を開けないで」という否定の命令文→<b>Don't＋動詞の原形</b>。"},
     {q:"My sister can ( ) English well.",opts:["speaks","speak","speaking","to speak"],a:1,e:"canなど助動詞のあとは必ず<b>動詞の原形</b>。主語が3人称単数でもsはつかない。"}
   ]},
  {id:"g4", grade:"中1", title:"過去形・過去進行形",
   points:[
     "規則動詞の過去形は<span class='kw'>-ed</span>（play→played, study→studied, stop→stopped）。",
     "不規則動詞は形が変わる：go→<span class='kw'>went</span>、come→came、see→saw、have→had、make→made など（暗記必須）。",
     "否定文は<span class='kw'>didn't＋動詞の原形</span>、疑問文は<span class='kw'>Did＋主語＋原形</span>。過去形に戻さないよう注意。",
     "be動詞の過去形は <span class='kw'>was</span>（am, isの過去）と <span class='kw'>were</span>（areの過去）。",
     "過去進行形「〜していた」は<span class='kw'>was / were＋ing形</span>。whenの文とセットで頻出。"
   ],
   ex:[
     {en:"I went to Kyoto with my family last week.", ja:"私は先週、家族と京都へ行きました。"},
     {en:"Did you enjoy the party? — Yes, I did.", ja:"パーティーは楽しかったですか。— はい。"},
     {en:"She was reading a book when I called her.", ja:"私が電話したとき、彼女は本を読んでいました。"}
   ],
   quiz:[
     {q:"I ( ) a letter to my friend yesterday.",opts:["write","writes","wrote","written"],a:2,e:"yesterdayがあるので過去形<b>wrote</b>。write-wrote-writtenの変化は必修。"},
     {q:"( ) you watch the movie last night? — Yes, I did.",opts:["Do","Did","Were","Are"],a:1,e:"last night（昨夜）→過去の疑問文<b>Did</b>＋主語＋動詞の原形。"},
     {q:"When I called him, he ( ) a bath.",opts:["takes","is taking","was taking","take"],a:2,e:"「電話したとき〜していた」→過去進行形<b>was taking</b>。"},
     {q:"We ( ) very busy last week.",opts:["are","was","were","did"],a:2,e:"主語Weでbe動詞の過去→<b>were</b>。"}
   ]},
  {id:"g5", grade:"中2", title:"未来表現・助動詞",
   points:[
     "未来は <span class='kw'>will＋原形</span> または <span class='kw'>be going to＋原形</span>。be going to はすでに決めた予定に使うことが多い。",
     "willの否定は <span class='kw'>won't</span>（= will not）。",
     "must（〜しなければならない）≒ <span class='kw'>have to</span>。ただし否定は意味がちがう：<span class='kw'>must not＝禁止</span>「〜してはいけない」、<span class='kw'>don't have to＝不要</span>「〜しなくてよい」。",
     "should（〜すべきだ）、may（〜してもよい・〜かもしれない）。",
     "<span class='kw'>Shall I 〜?</span>「（私が）〜しましょうか」、<span class='kw'>Shall we 〜?</span>「（いっしょに）〜しましょうか」。",
     "ていねいな依頼：<span class='kw'>Could you 〜?</span> / Would you 〜?"
   ],
   ex:[
     {en:"I'm going to visit my uncle next Sunday.", ja:"私は今度の日曜日におじを訪ねる予定です。"},
     {en:"It will be rainy tomorrow.", ja:"明日は雨になるでしょう。"},
     {en:"You don't have to hurry.", ja:"急ぐ必要はありません。"}
   ],
   quiz:[
     {q:"Ken ( ) play tennis with his friends tomorrow.",opts:["is going to","goes","went","is"],a:0,e:"tomorrow＋「〜する予定」→<b>is going to＋原形</b>。"},
     {q:"You ( ) eat too much. It's bad for your health.",opts:["don't have to","must not","have to","should"],a:1,e:"「食べすぎては<b>いけない</b>」＝禁止→<b>must not</b>。don't have toは「しなくてよい」。"},
     {q:"( ) I carry your bag? — Yes, please.",opts:["Shall","Will","Do","Am"],a:0,e:"「（私が）〜しましょうか」と申し出る→<b>Shall I 〜?</b>。"},
     {q:"You ( ) bring lunch tomorrow. We will give you some food.",opts:["must","must not","don't have to","should"],a:2,e:"「持ってこなくてよい」＝不要→<b>don't have to</b>。must notとの区別は超頻出。"}
   ]},
  {id:"g6", grade:"中2", title:"There is 〜・接続詞（when / if / because / that）",
   points:[
     "「〜がある・いる」は <span class='kw'>There is＋単数</span> ／ <span class='kw'>There are＋複数</span>＋場所。",
     "接続詞 when（〜のとき）、if（もし〜なら）、because（〜だから）、that（〜ということ）で2つの文をつなぐ。",
     "<span class='kw'>if / whenの節の中は、未来のことでも現在形</span>で表す（If it rains tomorrow, 〜）。",
     "I think (that) 〜.「〜だと思う」のthatは<span class='kw'>省略できる</span>。",
     "Why 〜? の答えに Because 〜. を使う。"
   ],
   ex:[
     {en:"There are two big parks in my town.", ja:"私の町には大きな公園が2つあります。"},
     {en:"If it rains tomorrow, I will stay home.", ja:"もし明日雨が降れば、私は家にいます。"},
     {en:"I think that this book is interesting.", ja:"私はこの本はおもしろいと思います。"}
   ],
   quiz:[
     {q:"There ( ) a lot of children in the park.",opts:["is","are","was","be"],a:1,e:"a lot of children（複数）→<b>There are</b>。"},
     {q:"If it ( ) sunny tomorrow, let's go fishing.",opts:["will be","is","was","be"],a:1,e:"ifの節の中は未来のことでも<b>現在形</b>。will beとしないのがポイント。"},
     {q:"I stayed home ( ) I was sick.",opts:["but","or","because","if"],a:2,e:"「病気<b>だったから</b>家にいた」→理由を表す<b>because</b>。"}
   ]},
  {id:"g7", grade:"中2", title:"不定詞・動名詞",
   points:[
     "不定詞は<span class='kw'>to＋動詞の原形</span>。3つの用法：名詞的「〜すること」／形容詞的「〜するための」／副詞的「〜するために・〜して」。",
     "動名詞は<span class='kw'>動詞のing形</span>で「〜すること」。",
     "<span class='kw'>enjoy / finish / stop ＋ 〜ing</span>（動名詞のみ）、<span class='kw'>want / hope / decide ＋ to〜</span>（不定詞のみ）。like / begin / start はどちらもOK。",
     "形容詞的用法は名詞のうしろから修飾：something to drink（何か飲むもの）、a lot of homework <span class='kw'>to do</span>。",
     "副詞的用法「〜するために」は目的を表す：He went to the station <span class='kw'>to meet</span> his friend."
   ],
   ex:[
     {en:"I want to be a doctor in the future.", ja:"私は将来、医者になりたいです。"},
     {en:"He went to the station to meet his friend.", ja:"彼は友だちを迎えに駅へ行きました。"},
     {en:"I enjoyed talking with my classmates.", ja:"私はクラスメイトと話をして楽しみました。"}
   ],
   quiz:[
     {q:"I want ( ) abroad in the future.",opts:["study","studying","to study","studied"],a:2,e:"wantは<b>不定詞（to＋原形）</b>のみをとる動詞。want to 〜「〜したい」。"},
     {q:"My father finished ( ) the newspaper.",opts:["read","to read","reading","reads"],a:2,e:"finishは<b>動名詞（〜ing）</b>のみをとる動詞。enjoy, stopも同じ仲間。"},
     {q:"I went to the library ( ) some books.",opts:["borrow","to borrow","borrowing","borrowed"],a:1,e:"「借りる<b>ために</b>行った」→目的を表す不定詞の副詞的用法<b>to borrow</b>。"},
     {q:"I have a lot of things ( ) today.",opts:["do","to do","doing","did"],a:1,e:"things<b>を後ろから修飾</b>する形容詞的用法。「今日すべきたくさんのこと」。"}
   ]},
  {id:"g8", grade:"中2", title:"比較",
   points:[
     "比較級「〜より…」：<span class='kw'>-er＋than</span>。最上級「いちばん…」：<span class='kw'>the -est</span>＋in（場所・範囲）/ of（複数のなかま）。",
     "長い語（interesting, famous, popularなど）は <span class='kw'>more / most</span> をつける。",
     "不規則変化：good / well → <span class='kw'>better / best</span>、many / much → more / most。",
     "「AとBではどちらが〜か」：Which is 〜er, A or B?",
     "同じくらい：<span class='kw'>as＋原級＋as</span>。否定 not as 〜 as …「…ほど〜ではない」。",
     "「〜がいちばん好き」：like 〜 <span class='kw'>the best</span>."
   ],
   ex:[
     {en:"Tom is taller than Ken.", ja:"トムはケンより背が高い。"},
     {en:"This is the most famous picture in the museum.", ja:"これはその美術館でいちばん有名な絵です。"},
     {en:"I like summer the best of all seasons.", ja:"私はすべての季節の中で夏がいちばん好きです。"}
   ],
   quiz:[
     {q:"This question is ( ) than that one.",opts:["easy","easier","easiest","more easy"],a:1,e:"thanがあるので比較級。easyはyをiに変えて<b>easier</b>。"},
     {q:"Mt. Fuji is ( ) mountain in Japan.",opts:["higher","the highest","high","more high"],a:1,e:"「日本で<b>いちばん</b>高い山」→最上級<b>the highest</b>＋in Japan。"},
     {q:"This movie is ( ) interesting than that one.",opts:["much","many","more","most"],a:2,e:"interestingは長い語なので<b>more</b>をつけて比較級にする。"},
     {q:"I can't run as ( ) as my brother.",opts:["fast","faster","fastest","more fast"],a:0,e:"as 〜 as の間は<b>原級</b>（そのままの形）。not as fast as「〜ほど速くない」。"}
   ]},
  {id:"g9", grade:"中3", title:"受け身（受動態）",
   points:[
     "「〜される」は <span class='kw'>be動詞＋過去分詞</span>。行為をする人は<span class='kw'>by 〜</span>で表す（省略も多い）。",
     "時制はbe動詞で表す：is made（現在）／<span class='kw'>was made</span>（過去）。",
     "疑問文はbe動詞を前に：<span class='kw'>Is this car made in Japan?</span> 否定文は be動詞＋not。",
     "byを使わない表現：be known <span class='kw'>to</span> 〜（〜に知られている）、be covered <span class='kw'>with</span> 〜（〜でおおわれている）。",
     "be made <span class='kw'>of</span> 〜（材料が見てわかる）／ be made <span class='kw'>from</span> 〜（原料が変化している）。"
   ],
   ex:[
     {en:"English is spoken in many countries.", ja:"英語は多くの国で話されています。"},
     {en:"This temple was built about 400 years ago.", ja:"この寺は約400年前に建てられました。"},
     {en:"The top of the mountain is covered with snow.", ja:"山頂は雪でおおわれています。"}
   ],
   quiz:[
     {q:"This song ( ) by many young people.",opts:["loves","is loved","is loving","loving"],a:1,e:"「歌は愛<b>される</b>」→受け身<b>be動詞＋過去分詞</b>。"},
     {q:"These pictures ( ) taken in Kyoto last year.",opts:["are","was","were","did"],a:2,e:"主語が複数＋last year（過去）→<b>were</b> taken。"},
     {q:"Butter is made ( ) milk.",opts:["of","from","by","in"],a:1,e:"牛乳はバターになると形が変わる（原料）→<b>from</b>。木の机のように材料が見てわかるならof。"}
   ]},
  {id:"g10", grade:"中3", title:"現在完了・現在完了進行形",
   points:[
     "現在完了は <span class='kw'>have / has＋過去分詞</span>。過去とつながった「今」を表す。",
     "<span class='kw'>継続</span>「ずっと〜している」：for（〜の間）／ since（〜以来）とセット。",
     "<span class='kw'>経験</span>「〜したことがある」：ever（今までに）／ never（一度もない）／ 〜 times（〜回）。",
     "<span class='kw'>完了</span>「〜したところだ・してしまった」：just（ちょうど）／ already（すでに）／ yet（疑問文：もう、否定文：まだ）。",
     "have <span class='kw'>been</span> to 〜「行ったことがある」／ have <span class='kw'>gone</span> to 〜「行ってしまった（今ここにいない）」。",
     "動作の継続は現在完了進行形 <span class='kw'>have been＋ing</span>（It has been raining since last night.）。"
   ],
   ex:[
     {en:"I have lived in Chiba for ten years.", ja:"私は10年間ずっと千葉に住んでいます。"},
     {en:"Have you ever been to Okinawa?", ja:"あなたは今までに沖縄へ行ったことがありますか。"},
     {en:"I have just finished my homework.", ja:"私はちょうど宿題を終えたところです。"}
   ],
   quiz:[
     {q:"My brother has ( ) in Tokyo since 2020.",opts:["live","lived","living","lives"],a:1,e:"has＋<b>過去分詞</b>で現在完了。since 2020「2020年からずっと」→継続。"},
     {q:"Have you ever ( ) to Hokkaido?",opts:["go","went","gone","been"],a:3,e:"「行ったことがある」は<b>have been to</b>。have gone toは「行ってしまった」。"},
     {q:"She has been ( ) TV for three hours.",opts:["watch","watched","watching","watches"],a:2,e:"has been＋<b>ing</b>＝現在完了進行形。「3時間ずっと見続けている」。"},
     {q:"I have ( ) seen the movie, so I know the story.",opts:["yet","never","already","ever"],a:2,e:"「<b>すでに</b>見たので話を知っている」→<b>already</b>。yetは疑問文・否定文で使う。"}
   ]},
  {id:"g11", grade:"中3", title:"不定詞の応用・文型（SVOO / SVOC）",
   points:[
     "<span class='kw'>It is … (for A) to 〜</span>「（Aにとって）〜することは…だ」。Itは仮の主語。",
     "<span class='kw'>want / tell / ask＋人＋to 〜</span>「人に〜してほしい／〜するように言う／頼む」。",
     "<span class='kw'>疑問詞＋to 〜</span>：how to（〜のしかた）、what to（何を〜すべきか）、where to（どこで〜すべきか）。",
     "<span class='kw'>too … to 〜</span>「…すぎて〜できない」（= so … that ─ can't 〜）。",
     "SVOO：<span class='kw'>give A B</span>「AにBをあげる」＝ give B to A。",
     "SVOC：<span class='kw'>call A B</span>「AをBと呼ぶ」、<span class='kw'>make A B</span>「AをBにする」（The news made me happy.）。"
   ],
   ex:[
     {en:"It is important for us to learn English.", ja:"私たちにとって英語を学ぶことは大切です。"},
     {en:"My mother told me to clean my room.", ja:"母は私に部屋を掃除するように言いました。"},
     {en:"I don't know how to use this computer.", ja:"私はこのコンピュータの使い方がわかりません。"}
   ],
   quiz:[
     {q:"It is fun ( ) me to play the guitar.",opts:["of","for","to","with"],a:1,e:"It is …<b>for</b> A to 〜「Aにとって〜することは…だ」。"},
     {q:"My teacher told us ( ) our best.",opts:["do","doing","to do","did"],a:2,e:"tell＋人＋<b>to＋原形</b>「人に〜するように言う」。"},
     {q:"I didn't know ( ) to say, so I was quiet.",opts:["what","how","where","when"],a:0,e:"「<b>何を</b>言えばよいか」→<b>what to say</b>。how to sayなら「言い方」。"},
     {q:"The news made me ( ).",opts:["happily","happy","to happy","happiness"],a:1,e:"make A B「AをBにする」。Bには<b>形容詞</b>がくる（SVOC）。"}
   ]},
  {id:"g12", grade:"中3", title:"分詞・関係代名詞",
   points:[
     "現在分詞（<span class='kw'>ing形</span>）「〜している…」：The boy <span class='kw'>playing tennis</span> over there is Ken.（2語以上は名詞のうしろ）",
     "過去分詞「〜された…」：a camera <span class='kw'>made in Japan</span>（日本製のカメラ）。",
     "関係代名詞は名詞（先行詞）を文で説明する：人→<span class='kw'>who / that</span>、物→<span class='kw'>which / that</span>。",
     "主格：I have a friend <span class='kw'>who lives</span> in Canada.（whoのあとは動詞）",
     "目的格：The book <span class='kw'>(which) I read</span> yesterday was interesting.（目的格は<span class='kw'>省略できる</span>）"
   ],
   ex:[
     {en:"The girl singing over there is my sister.", ja:"向こうで歌っている少女は私の姉です。"},
     {en:"This is a camera made in Japan.", ja:"これは日本で作られたカメラです。"},
     {en:"I have a friend who lives in Canada.", ja:"私にはカナダに住んでいる友だちがいます。"}
   ],
   quiz:[
     {q:"The boy ( ) soccer over there is Ken.",opts:["play","played","playing","plays"],a:2,e:"「サッカーを<b>している</b>少年」→現在分詞<b>playing</b>が後ろからboyを修飾。"},
     {q:"This is a letter ( ) by Soseki.",opts:["write","wrote","writing","written"],a:3,e:"「漱石によって<b>書かれた</b>手紙」→過去分詞<b>written</b>。"},
     {q:"I have an aunt ( ) lives in Osaka.",opts:["who","which","whose","it"],a:0,e:"先行詞an auntは<b>人</b>で、あとに動詞→主格の<b>who</b>。"},
     {q:"The cake ( ) my mother made was delicious.",opts:["who","which","whose","what"],a:1,e:"先行詞The cakeは<b>物</b>→<b>which</b>（that）。目的格なので省略も可能。"}
   ]},
  {id:"g13", grade:"中3", title:"間接疑問文・仮定法",
   points:[
     "間接疑問文：疑問詞のあとが<span class='kw'>主語＋動詞</span>の語順になる。I know <span class='kw'>where he lives</span>.（× where does he live）",
     "Do you know what time <span class='kw'>it is</span>?（何時か知っていますか）",
     "仮定法過去「もし〜なら…なのに」（現実とちがう仮定）：<span class='kw'>If＋主語＋過去形, 主語＋would / could＋原形</span>。",
     "仮定法ではbe動詞はふつう<span class='kw'>were</span>を使う：If I <span class='kw'>were</span> you, 〜。",
     "<span class='kw'>I wish＋主語＋過去形</span>「〜ならいいのに」：I wish I could fly."
   ],
   ex:[
     {en:"Do you know what time it is?", ja:"今、何時か知っていますか。"},
     {en:"If I had more time, I could read more books.", ja:"もっと時間があれば、もっと本が読めるのに。"},
     {en:"I wish I were a bird.", ja:"私が鳥ならいいのに。"}
   ],
   quiz:[
     {q:"I don't know where ( ).",opts:["does he live","he lives","lives he","did he live"],a:1,e:"間接疑問文は疑問詞のあとが<b>主語＋動詞</b>の語順。「彼がどこに住んでいるか」。"},
     {q:"If I ( ) rich, I would travel around the world.",opts:["am","is","were","will be"],a:2,e:"現実とちがう仮定（仮定法過去）→be動詞は<b>were</b>。"},
     {q:"I wish I ( ) play the piano well.",opts:["can","could","will","may"],a:1,e:"I wish＋<b>過去形</b>「〜ならいいのに」→<b>could</b>。"}
   ]},
]},

/* ================= 状態管理（localStorage） ================= */
const LS_KEY="chiba_eigo_progress_v1";
let progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
function save(){localStorage.setItem(LS_KEY, JSON.stringify(progress));}

function allUnits(){
  return Object.keys(DATA).flatMap(f=>DATA[f].units.map(u=>u.id));
}
function updateProgress(){
  const all=allUnits();
  const done=all.filter(id=>progress[id]).length;
  const pct=all.length? Math.round(done/all.length*100):0;
  document.getElementById('progFill').style.width=pct+"%";
  document.getElementById('progText').textContent=`${done} / ${all.length} 単元 完了`;
}

/* ================= 描画 ================= */
function renderField(fkey){
  const f=DATA[fkey];
  let html=`<section id="sec-${fkey}" class="${fkey==='gram'?'active':''}">`;
  html+=`<div class="field-head"><span class="field-dot" style="background:${f.color}"></span><h2>${f.name}</h2><span class="cnt">${f.units.length}単元</span></div>`;
  f.units.forEach(u=>{
    const done=progress[u.id];
    html+=`<div class="unit" data-uid="${u.id}">
      <div class="unit-head">

        ${u.ex&&u.ex.length?`<h3 class="sec">📝 基本例文</h3>${u.ex.map(x=>`<div class="fm"><div class="en">${x.en}</div><div class="ja">${x.ja}</div></div>`).join('')}`:''}
        ${u.quiz.length?`<h3 class="sec">✏️ 確認問題</h3><div class="quiz-box">${u.quiz.map((q,qi)=>renderQuiz(u.id,qi,q)).join('')}</div>`:''}
        <div class="row">
          <button class="btn primary mark-btn" data-uid="${u.id}">${done?'✅ 学習済み（解除）':'この単元を学習済みにする'}</button>
        </div>
      </div>
    </div>`;
  });
  html+=`</section>`;
  return html;
}
function renderQuiz(uid,qi,q){
  return `<div class="q" data-uid="${uid}" data-qi="${qi}">
    <div class="q-txt"><span class="num">Q${qi+1}.</span>${q.q}</div>
    <div class="opts">${q.opts.map((o,oi)=>`<div class="opt" data-oi="${oi}">${o}</div>`).join('')}</div>
    <div class="expl"><b>解説：</b>${q.e}</div>
  </div>`;
}

function buildAll(){
  const c=document.getElementById('content');
  c.innerHTML = Object.keys(DATA).map(renderField).join('');
  updateProgress();
  bindEvents();
}

/* ================= イベント ================= */
function bindEvents(){
  // タブ
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
      t.classList.add('active');
      const f=t.dataset.f;
      if(f==='test'){document.getElementById('sec-test').classList.add('active'); renderTestIntro();}
      else if(f==='qa'){document.getElementById('sec-qa').classList.add('active'); if(!qaState)renderQAIntro();}
      else if(f==='narabe'){document.getElementById('sec-narabe').classList.add('active'); if(!nbState)renderNarabeIntro();}
      else if(f==='sakubun'){document.getElementById('sec-sakubun').classList.add('active'); renderSakubun();}
      else if(f==='jissen'){document.getElementById('sec-jissen').classList.add('active'); renderJissen();}
      else if(f==='review'){document.getElementById('sec-review').classList.add('active'); Chiba.renderReview('reviewArea');}
      else document.getElementById('sec-'+f).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  // 単元の開閉
  document.querySelectorAll('.unit-head').forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle('open');
  });
  // クイズ回答
  document.querySelectorAll('#content .q').forEach(qEl=>{
    const uid=qEl.dataset.uid, qi=+qEl.dataset.qi;
    const qq=findQuiz(uid,qi), ans=qq.a;
    qEl.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        if(qEl.classList.contains('answered'))return;
        qEl.classList.add('answered');
        const chosen=+opt.dataset.oi;
        Chiba.record({id:`q:${uid}:${qi}`,type:'choice',q:qq.q,opts:qq.opts,a:qq.a,e:qq.e,field:unitField(uid)},chosen===ans);
        qEl.querySelectorAll('.opt').forEach((o,i)=>{
          o.classList.add('disabled');
          if(i===ans)o.classList.add('correct');
          if(i===chosen&&chosen!==ans)o.classList.add('wrong');
        });
        qEl.querySelector('.expl').classList.add('show');
      };
    });
  });
  // 学習済みボタン
  document.querySelectorAll('.mark-btn').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const uid=b.dataset.uid;
      progress[uid]=!progress[uid];
      save(); updateProgress();
      const unit=document.querySelector(`.unit[data-uid="${uid}"]`);
      unit.querySelector('.unit-check').textContent=progress[uid]?'✅':'⬜';
      b.textContent=progress[uid]?'✅ 学習済み（解除）':'この単元を学習済みにする';
    };
  });
}
function findQuiz(uid,qi){
  for(const f of Object.values(DATA)){
    const u=f.units.find(u=>u.id===uid);
    if(u)return u.quiz[qi];
  }
}
function unitField(uid){
  for(const f of Object.values(DATA)){
    if(f.units.some(u=>u.id===uid))return f.name;
  }
  return '';
}

let testState=null;
function renderTestIntro(){
  const area=document.getElementById('testArea');
  area.innerHTML=`
    <div class="test-intro">
      <h2>📝 実力チェック模試</h2>

      <div class="chips" id="fieldChips">
        <div class="chip on" data-f="gram">文法</div>
        <div class="chip on" data-f="voc">単語・熟語</div>
        <div class="chip on" data-f="kaiwa">会話表現</div>
        <div class="chip on" data-f="tech">読解・入試</div>
      </div>
      <div class="row">
        <span style="font-size:13px;color:var(--sub)">問題数：</span>
        <div class="chips" id="countChips" style="margin:0">
          <div class="chip on" data-n="10">10問</div>
          <div class="chip" data-n="20">20問</div>
          <div class="chip" data-n="0">全問</div>
        </div>
      </div>
      <div class="row"><button class="btn primary" id="startTest">模試スタート</button></div>
      ${Chiba.moshiHistoryHtml()}
    </div>`;
  area.querySelectorAll('#fieldChips .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  area.querySelectorAll('#countChips .chip').forEach(c=>c.onclick=()=>{
    area.querySelectorAll('#countChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  });
  document.getElementById('startTest').onclick=startTest;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTest(){
  const fields=[...document.querySelectorAll('#fieldChips .chip.on')].map(c=>c.dataset.f);
  if(!fields.length){alert('分野を1つ以上選んでください');return;}
  const n=+document.querySelector('#countChips .chip.on').dataset.n;
  let pool=[];
  fields.forEach(fk=>DATA[fk].units.forEach(u=>u.quiz.forEach((q,qi)=>pool.push({...q,field:DATA[fk].name,id:`q:${u.id}:${qi}`}))));
  pool=shuffle(pool);
  if(n>0)pool=pool.slice(0,n);
  testState={pool,answers:new Array(pool.length).fill(null),submitted:false,timer:null};
  renderTestQuestions();
}
function renderTestQuestions(){
  const {pool}=testState;
  const area=document.getElementById('testArea');
  let html=`<div class="test-intro" style="padding:14px 18px"><h2 style="font-size:15px">模試（全${pool.length}問）</h2><p style="margin:0">すべて解いたら下の「採点する」を押そう。</p><div class="c-timer" id="testTimer"></div></div>`;
  pool.forEach((q,i)=>{
    html+=`<div class="q" data-i="${i}">
      <div class="qcount">${q.field}</div>
      <div class="q-txt"><span class="num">問${i+1}.</span>${q.q}</div>
      <div class="opts">${q.opts.map((o,oi)=>`<div class="opt" data-oi="${oi}">${o}</div>`).join('')}</div>
      <div class="expl"><b>解説：</b>${q.e}</div>
    </div>`;
  });
  html+=`<div class="row"><button class="btn primary" id="submitTest">採点する</button><button class="btn" id="cancelTest">やめる</button></div>`;
  area.innerHTML=html;
  area.querySelectorAll('.q').forEach(qEl=>{
    const i=+qEl.dataset.i;
    qEl.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        if(testState.submitted)return;
        qEl.querySelectorAll('.opt').forEach(o=>o.style.borderColor='');
        opt.style.borderColor='var(--accent)';
        testState.answers[i]=+opt.dataset.oi;
      };
    });
  });
  document.getElementById('submitTest').onclick=gradeTest;
  document.getElementById('cancelTest').onclick=()=>{if(testState.timer)testState.timer.stop();renderTestIntro();};
  testState.timer=Chiba.startTimer('testTimer',pool.length*60);
}
function gradeTest(){
  const {pool,answers}=testState;
  const unanswered=answers.filter(a=>a===null).length;
  if(unanswered>0 && !confirm(`未回答が${unanswered}問あります。このまま採点しますか？`))return;
  testState.submitted=true;
  const sec=testState.timer?testState.timer.stop():0;
  let correct=0;
  document.querySelectorAll('#testArea .q').forEach(qEl=>{
    const i=+qEl.dataset.i;const q=pool[i];
    const ok=answers[i]===q.a;
    if(ok)correct++;
    Chiba.record({id:q.id,type:'choice',q:q.q,opts:q.opts,a:q.a,e:q.e,field:q.field},ok);
    qEl.querySelectorAll('.opt').forEach((o,oi)=>{
      o.classList.add('disabled');o.style.borderColor='';
      if(oi===q.a)o.classList.add('correct');
      if(oi===answers[i]&&answers[i]!==q.a)o.classList.add('wrong');
    });
    qEl.querySelector('.expl').classList.add('show');
  });
  const pct=Math.round(correct/pool.length*100);
  Chiba.saveMoshi({t:Date.now(),score:correct,total:pool.length,sec});
  let msg;
  if(pct>=90)msg='素晴らしい！合格圏内。この調子で並べかえ・英作文も仕上げよう。';
  else if(pct>=70)msg='good！あと一歩。まちがえた単元の要点を読み直そう。';
  else if(pct>=50)msg='基礎はついてきた。解説をよく読んで復習しよう。';
  else msg='まずは各単元の「要点整理」から。くり返せば必ず伸びる！';
  const card=document.createElement('div');
  card.className='result-card';
  card.innerHTML=`<div class="result-score">${correct} / ${pool.length}</div>
    <div style="font-size:18px;font-weight:700;margin-top:4px">正答率 ${pct}%　<span style="font-size:13px;color:var(--sub)">⏱ ${Math.floor(sec/60)}分${sec%60}秒</span></div>
    <div class="result-msg">${msg}<br>まちがえた問題は「復習」タブへ自動で入りました。</div>
    ${Chiba.breakdownHtml(pool,answers)}
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn primary" id="retryTest">もう一度</button>
    </div>`;
  const area=document.getElementById('testArea');
  area.insertBefore(card, area.firstChild);
  document.getElementById('retryTest').onclick=renderTestIntro;
  window.scrollTo({top:0,behavior:'smooth'});
}

function startQA(){
  const fields=[...document.querySelectorAll('#qaFieldChips .chip.on')].map(c=>c.dataset.f);
  if(!fields.length){alert('分野を1つ以上選んでください');return;}
  const dir=document.querySelector('#qaDirChips .chip.on').dataset.d;
  let deck=[];
  fields.forEach(f=>QA[f].forEach((c,i)=>{
    const q = dir==='e2j' ? c.en : c.ja;
    const a = dir==='e2j' ? c.ja : c.en;
    deck.push({q,a,field:QA_FIELDS[f],id:`qa:${f}:${i}:${dir}`});
  }));
  deck=shuffle(deck);
  qaState={deck,total:deck.length,ok:0,ng:0,revealed:false};

}

  const s=qaState, area=document.getElementById('qaArea');
  if(s.deck.length===0){
    area.innerHTML=`<div class="result-card">

  area.innerHTML=`

    </div>
    <div id="qaControls"></div>`;
  const cardEl=document.getElementById('qaCard');
  const reveal=()=>{
    if(s.revealed)return; s.revealed=true;
    cardEl.classList.add('revealed');
    document.getElementById('qaHint').style.display='none';
    document.getElementById('qaControls').innerHTML=`
      <div class="grade-row">
        <button class="btn ng" id="qaNG">× もう一度</button>
        <button class="btn ok" id="qaOK">✓ 覚えた</button>
      </div>`;
    document.getElementById('qaOK').onclick=()=>gradeCard(true);
    document.getElementById('qaNG').onclick=()=>gradeCard(false);
  };
  cardEl.onclick=reveal;
}
function gradeCard(ok){
  const s=qaState;
  const card=s.deck.shift();
  s.revealed=false;
  Chiba.record({id:card.id,type:'flash',q:card.q,a:card.a,field:card.field},ok);
  if(ok){s.ok++;}
  else{s.ng++; s.deck.push(card);} // まちがえたら山の最後へ戻す
  renderQACard();
}

let nbState=null;
function renderNarabeIntro(){
  const area=document.getElementById('narabeArea');
  area.innerHTML=`
    <div class="test-intro">
      <h2>🧩 並べかえ（整序英作文）</h2>
      <p>千葉県入試で毎年出る形式。日本語に合うように単語をタップして英文を作ろう。<b>まず動詞を見つけて「主語＋動詞」の骨組みを作る</b>のがコツ。全${NARABE.length}問。</p>
      <div class="row"><button class="btn primary" id="startNB">スタート</button></div>
    </div>`;
  document.getElementById('startNB').onclick=()=>{
    nbState={order:shuffle([...NARABE.keys()]),idx:0,correct:0};
    renderNBQuestion();
  };
}
function renderNBQuestion(){
  const s=nbState;
  if(s.idx>=s.order.length){
    const area=document.getElementById('narabeArea');
    const pct=Math.round(s.correct/s.order.length*100);
    area.innerHTML=`<div class="result-card">
      <div class="result-score">${s.correct} / ${s.order.length}</div>
      <div style="font-size:18px;font-weight:700;margin-top:4px">正答率 ${pct}%</div>
      <div class="result-msg">${pct>=80?'すばらしい！この形式はもう得点源。':'まちがえた文は音読して語順ごと覚えよう。'}</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="nbAgain">もう一度</button></div>
    </div>`;
    document.getElementById('nbAgain').onclick=renderNarabeIntro;
    return;
  }
  const p=NARABE[s.order[s.idx]];
  let pool=shuffle([...p.words]);
  if(p.words.length>1){
    let guard=0;
    while(pool.join(' ')===p.words.join(' ') && guard<10){pool=shuffle([...pool]);guard++;}
  }
  const built=[];
  const area=document.getElementById('narabeArea');
  area.innerHTML=`
    <div class="qcount">第${s.idx+1}問 / 全${s.order.length}問</div>
    <div class="nb-ja"><span class="nb-grade">${p.grade}</span>${p.ja}</div>
    <div class="nb-zone empty" id="nbZone"></div>
    <div class="nb-pool" id="nbPool"></div>
    <div class="row">
      <button class="btn" id="nbUndo">一つ戻す</button>
      <button class="btn" id="nbClear">やり直す</button>
      <button class="btn primary" id="nbCheck" disabled>答え合わせ</button>
    </div>
    <div class="nb-result" id="nbResult"></div>
    <div class="row" id="nbNextRow" style="display:none"><button class="btn primary" id="nbNext">次の問題へ</button></div>`;
  const zone=document.getElementById('nbZone'), poolEl=document.getElementById('nbPool');
  const checkBtn=document.getElementById('nbCheck');
  let done=false;
  function draw(){
    zone.innerHTML=built.map((w,i)=>`<span class="wchip" data-i="${i}">${w}</span>`).join('');
    zone.classList.toggle('empty',built.length===0);
    poolEl.innerHTML=pool.map((w,i)=>`<span class="wchip" data-i="${i}">${w}</span>`).join('');
    checkBtn.disabled=pool.length!==0;
    if(done)return;
    poolEl.querySelectorAll('.wchip').forEach(ch=>{
      ch.onclick=()=>{built.push(pool.splice(+ch.dataset.i,1)[0]);draw();};
    });
    zone.querySelectorAll('.wchip').forEach(ch=>{
      ch.onclick=()=>{pool.push(built.splice(+ch.dataset.i,1)[0]);draw();};
    });
  }
  draw();
  document.getElementById('nbUndo').onclick=()=>{if(done||!built.length)return;pool.push(built.pop());draw();};
  document.getElementById('nbClear').onclick=()=>{if(done)return;pool.push(...built.splice(0));draw();};
  checkBtn.onclick=()=>{
    if(done)return;
    done=true;
    const ok=built.join(' ')===p.words.join(' ');
    if(ok)s.correct++;
    Chiba.record({id:`nb:${s.order[s.idx]}`,type:'flash',q:`【並べかえ】${p.ja}`,a:p.ans,e:p.note,field:'並べかえ'},ok);
    const res=document.getElementById('nbResult');
    res.className='nb-result show '+(ok?'good':'bad');
    res.innerHTML=`${ok?'⭕ 正解！':'❌ ざんねん…'}<div class="ans">${p.ans}</div><div class="note">💡 ${p.note}</div>`;
    checkBtn.disabled=true;
    document.getElementById('nbNextRow').style.display='flex';
    document.getElementById('nbNext').onclick=()=>{s.idx++;renderNBQuestion();};
    draw();
  };
}

function renderSakubun(){
  const area=document.getElementById('sakubunArea');
  let html=`<div class="test-intro" style="padding:16px 18px">
     <h2>✍️ 条件英作文対策</h2>
     <p style="margin:0 0 8px">千葉県入試で毎年出る英作文。まずノートに自分で書いてから模範解答を確認しよう。</p>
     <p style="margin:0;font-size:13px">🔑 減点されないコツ：<b>①主語＋動詞のある文にする ②知っている単語で短く2文 ③時制をそろえる ④最後にピリオド・クエスチョンマーク</b></p>
   </div>`;
  Object.keys(SAKUBUN).forEach(f=>{
    html+=`<div class="field-head"><span class="field-dot" style="background:var(--tech)"></span><h2 style="font-size:15px">${SAKUBUN[f].name}</h2></div>`;
    SAKUBUN[f].items.forEach((k,i)=>{
      html+=`<div class="kj">
        <div class="kj-q"><span class="num">問${i+1}.</span> ${k.q}</div>
        <button class="btn kj-btn" data-f="${f}" data-i="${i}">解答例を見る</button>
        <div class="kj-a" id="kj-${f}-${i}">
          <span class="lbl">解答例</span>${k.a}
          <div class="kj-point">🔑 ${k.p}</div>
          <div class="row kj-grade" style="margin-top:10px">
            <span style="font-size:12px;color:var(--sub);align-self:center">自分の答案は…</span>
            <button class="btn kj-ng" data-f="${f}" data-i="${i}">× まだ書けない</button>
            <button class="btn primary kj-ok" data-f="${f}" data-i="${i}">✓ 書けた</button>
          </div>
        </div>
      </div>`;
    });
  });
  area.innerHTML=html;
  area.querySelectorAll('.kj-btn').forEach(b=>{
    b.onclick=()=>{
      const box=document.getElementById(`kj-${b.dataset.f}-${b.dataset.i}`);
      const open=box.classList.toggle('show');
      b.textContent=open?'解答例を隠す':'解答例を見る';
    };
  });
  const gradeSk=(f,i,ok,btn)=>{
    const k=SAKUBUN[f].items[i];
    Chiba.record({id:`sk:${f}:${i}`,type:'flash',q:`【英作文】${k.q}`,a:k.a,e:k.p,field:'英作文'},ok);
    btn.closest('.kj-grade').innerHTML=`<span style="font-size:12px;color:var(--sub)">${ok?'✓ 記録しました。':'記録しました。「復習」タブでくり返し書く練習をしよう。'}</span>`;
  };
  area.querySelectorAll('.kj-ok').forEach(b=>b.onclick=()=>gradeSk(b.dataset.f,+b.dataset.i,true,b));
  area.querySelectorAll('.kj-ng').forEach(b=>b.onclick=()=>gradeSk(b.dataset.f,+b.dataset.i,false,b));
}

    intro:'千葉県の英語は<b>リスニングの配点が約3割</b>。音声を流して、本番のつもりで解こう（本番は2回放送）。聞き取れなかったら台本を見て、そのあと<b>音声だけで正解できるまで</b>くり返すのが伸びるコツ。'
  });
  renderSokudoku();
}
function renderSokudoku(){
  const area=document.getElementById('sokudokuArea');
  let html=`<div class="test-intro" style="margin-top:16px">
    <h2>⏱ 長文速読トレーニング</h2>
    <p style="margin:0">本番は60分で長文2題＋対話文。<b>1分あたり100語（WPM100）</b>で読めると余裕が生まれる。「読み始める」を押すと本文とタイマーが出るので、読み終わったらすぐストップ→設問へ。</p>
  </div>`;
  SOKUDOKU.forEach((p,pi)=>{
    html+=`<div class="unit open" style="margin-top:12px">
      <div class="unit-head" style="cursor:default">
        <span class="unit-grade">${p.words}語</span>
        <span class="unit-title">${p.title}</span>
        <span style="font-size:12px;color:var(--sub)">目標 ${p.target}秒</span>
      </div>
      <div class="unit-body" style="display:block" id="sd-${pi}">
        <div class="row" style="margin:10px 0"><button class="btn primary sd-start" data-pi="${pi}">読み始める</button></div>
      </div>
    </div>`;
  });
  area.innerHTML=html;
  area.querySelectorAll('.sd-start').forEach(b=>{
    b.onclick=()=>{
      const pi=+b.dataset.pi, p=SOKUDOKU[pi];
      const box=document.getElementById('sd-'+pi);
      skState[pi]={t0:Date.now()};
      box.innerHTML=`
        <div class="c-timer" id="sdTimer-${pi}"></div>
        <div style="font-size:15px;line-height:1.9;margin:10px 0;padding:14px;background:var(--panel2);border-radius:10px">${p.text}</div>
        <div class="row"><button class="btn primary sd-done" data-pi="${pi}">読み終わった！</button></div>`;
      skState[pi].timer=Chiba.startTimer('sdTimer-'+pi, p.target);
      box.querySelector('.sd-done').onclick=()=>{
        const sec=Math.max(1,skState[pi].timer.stop());
        const wpm=Math.round(p.words/sec*60);
        const judge=sec<=p.target?'⭕ 目標クリア！':'△ もう少し。何度も読んで速くしよう';
        let qhtml=`<div style="font-size:13px;margin:10px 0"><b>${sec}秒</b>（WPM ${wpm}）｜目標 ${p.target}秒 ｜ ${judge}</div>`;
        qhtml+=p.qs.map((q,qi)=>`<div class="q sd-q" data-pi="${pi}" data-qi="${qi}">
          <div class="q-txt"><span class="num">Q${qi+1}.</span>${q.q}</div>
          <div class="opts">${q.opts.map((o,oi)=>`<div class="opt" data-oi="${oi}">${o}</div>`).join('')}</div>
          <div class="expl"><b>解説：</b>${q.e}</div>
        </div>`).join('');
        qhtml+=`<div class="row"><button class="btn sd-retry" data-pi="${pi}">本文をもう一度読む</button></div>`;
        box.innerHTML=qhtml;
        box.querySelectorAll('.sd-q').forEach(qEl=>{
          const qi=+qEl.dataset.qi, q=p.qs[qi];
          qEl.querySelectorAll('.opt').forEach(opt=>{
            opt.onclick=()=>{
              if(qEl.classList.contains('answered'))return;
              qEl.classList.add('answered');
              const chosen=+opt.dataset.oi, ok=chosen===q.a;
              qEl.querySelectorAll('.opt').forEach((o,i)=>{
                o.classList.add('disabled');
                if(i===q.a)o.classList.add('correct');
                if(i===chosen&&!ok)o.classList.add('wrong');
              });
              qEl.querySelector('.expl').classList.add('show');
              Chiba.record({id:`sd:${p.id}:${qi}`,type:'choice',q:`【速読・${p.title}】${q.q}`,opts:q.opts,a:q.a,e:q.e,field:'速読'},ok);
            };
          });
        });
        box.querySelector('.sd-retry').onclick=()=>b.onclick();
      };
    };
  });
}

/* ================= リセット ================= */
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('学習の進捗をすべてリセットしますか？')){
    progress={};save();buildAll();
  }
};

buildAll();
</script>
