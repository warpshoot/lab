<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Post Mock</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#ffffff; --text:#0f1419; --sub:#536471; --border:#eff3f4;
  --icon:#536471; --blue:#1d9bf0;
}
body.dark {
  --bg:#000000; --text:#e7e9ea; --sub:#71767b; --border:#2f3336;
  --icon:#71767b; --blue:#1d9bf0;
}
html,body { min-height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Hiragino Sans","Yu Gothic UI",sans-serif;
  background:#444; display:flex; justify-content:center; align-items:flex-start; color:var(--text);
}
/* 素材のサイズは制作環境に依存させない。端末が狭いときは stage で縮小表示するだけで、
   レイアウト（＝書き出される画像）は常に 420x920 のスマホ画面。 */
.stage { position:relative; }
.phone {
  width:420px; height:920px; transform-origin:top left;
  background:var(--bg); display:flex; flex-direction:column;
  position:relative; overflow:hidden; transition:background .2s;
}

/* Status bar */
.statusbar {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 22px 4px; font-size:15px; font-weight:600; flex-shrink:0; color:var(--text);
}
.sb-right { display:flex; align-items:center; gap:5px; }
.bat-wrap { display:flex; align-items:center; gap:1px; }
.bat-body { width:22px; height:11px; border:1.5px solid var(--text); border-radius:3px; padding:1px; display:flex; }
.bat-fill { height:100%; background:var(--text); border-radius:1px; }
.bat-cap { width:1.5px; height:4px; background:var(--text); border-radius:0 1px 1px 0; }

/* Top nav */
.topnav {
  display:flex; align-items:center; padding:4px 4px 8px; flex-shrink:0;
}
.nav-btn {
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; flex-shrink:0;
}
.nav-title { flex:1; text-align:center; font-size:20px; font-weight:700; }

/* Scrollable area */
.post-scroll { flex:1; min-height:0; overflow-y:auto; }
.post-wrap { padding:12px 16px 0; }

/* Author row */
.author-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
.avatar {
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#1d9bf0,#0a5a94);
  background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:18px; overflow:hidden;
}
.author-mid { flex:1; min-width:0; }
.author-name { font-size:15px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.author-handle { font-size:14px; color:var(--sub); margin-top:1px; }

/* Post body */
.post-body {
  font-size:20px; line-height:1.5; color:var(--text);
  word-break:break-word; white-space:pre-wrap;
  outline:none; margin-bottom:14px; min-height:1em;
  caret-color:var(--blue);
}
.post-body:empty::before {
  content: attr(data-placeholder);
  color: var(--sub);
  pointer-events: none;
}

/* Meta line */
.post-meta {
  font-size:14px; color:var(--sub);
  padding-bottom:12px; border-bottom:1px solid var(--border);
}
.post-meta strong { color:var(--text); font-weight:600; }

/* Action bar */
.action-bar {
  display:flex; justify-content:space-around; align-items:center;
  padding:6px 0; border-bottom:1px solid var(--border);
}
.act-btn {
  display:flex; align-items:center; gap:5px;
  padding:8px 6px; border-radius:20px; cursor:pointer;
  color:var(--icon); font-size:13px; font-weight:500; user-select:none;
}
.act-btn svg { width:20px; height:20px; flex-shrink:0; }
.act-count { min-width:20px; }

/* Reply bar (decorative) */
.reply-bar {
  flex-shrink:0; display:flex; align-items:center; gap:10px;
  padding:10px 16px; border-top:1px solid var(--border); background:var(--bg);
}
.reply-mini-avatar { width:32px; height:32px; border-radius:50%; background:var(--blue); flex-shrink:0; }
.reply-placeholder { color:var(--sub); font-size:15px; pointer-events:none; user-select:none; }

/* FAB */
.fab {
  position:absolute; top:8px; right:10px; z-index:30;
  width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(120,120,120,.85); color:#fff; font-size:16px;
}
.toolbar {
  position:absolute; top:48px; right:10px; z-index:30;
  display:none; flex-direction:column; gap:6px;
}
.toolbar.open { display:flex; }
.toolbar button {
  border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600;
  cursor:pointer; background:rgba(120,120,120,.92); color:#fff; white-space:nowrap; text-align:left;
}

/* Overlay */
.overlay { position:absolute; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:40; padding:18px; }
.overlay.open { display:flex; }
.panel {
  width:100%; background:var(--bg); border-radius:14px; padding:18px;
  display:flex; flex-direction:column; gap:13px;
  max-height:90%; overflow-y:auto; border:1px solid var(--border);
}
.panel h3 { font-size:16px; font-weight:700; }
.sec { font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:13px; color:var(--sub); }
.field input[type=text] {
  background:transparent; border:1px solid var(--border); border-radius:8px;
  padding:8px 10px; color:var(--text); font-size:15px; outline:none; width:100%; font-family:inherit;
}
.set-select {
  -webkit-appearance:none; appearance:none; background:transparent;
  border:1px solid var(--border); border-radius:8px;
  padding:8px 10px; color:var(--text); font-size:15px; outline:none; width:100%; font-family:inherit;
}
.colors { display:flex; gap:8px; flex-wrap:wrap; }
.swatch { width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.swatch.sel { border-color:var(--blue); }
.toggle-row { display:flex; align-items:center; justify-content:space-between; font-size:13px; }
.switch { position:relative; width:46px; height:26px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; inset:0; background:#c7c7c7; border-radius:26px; transition:.2s; cursor:pointer; }
.slider:before { content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
.switch input:checked + .slider { background:var(--blue); }
.switch input:checked + .slider:before { transform:translateX(20px); }
.panel-btns { display:flex; gap:8px; }
.panel-btns button { flex:1; padding:10px; border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; color:#fff; }
.upload-btn { background:#8e8e8e; }
.done-btn { background:var(--blue); }
.file-name { font-size:12px; color:var(--sub); }
</style>
</head>
<body>

<script>
const avatar = document.getElementById('avatar');
let avatarColor = 'linear-gradient(135deg,#1d9bf0,#0a5a94)';
let avatarImg = null;

const palette = [
  'linear-gradient(135deg,#1d9bf0,#0a5a94)',
  'linear-gradient(135deg,#4ca771,#2f7d52)',
  'linear-gradient(135deg,#e0915a,#c9603b)',
  'linear-gradient(135deg,#b06ef7,#5e35b1)',
  'linear-gradient(135deg,#e06a90,#b03d63)',
  'linear-gradient(135deg,#8d99ae,#43485a)'
];

const colorRow = document.getElementById('colorRow');
palette.forEach((g, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' sel' : '');
  s.style.background = g;
  s.onclick = () => {
    avatarColor = g; avatarImg = null;
    avatar.style.background = g;
    avatar.textContent = fc(document.getElementById('setName').value);
    document.getElementById('fileName').textContent = '';
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
    s.classList.add('sel');
    scheduleSave();
  };
  colorRow.appendChild(s);
});

document.getElementById('fileInput').addEventListener('change', function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    avatarImg = ev.target.result;
    avatar.style.background = 'url(' + avatarImg + ') center/cover';
    avatar.textContent = '';
    document.getElementById('fileName').textContent = f.name;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
    scheduleSave();
  };
  r.readAsDataURL(f);
});

function clearImg() {
  avatarImg = null;
  avatar.style.background = avatarColor;
  avatar.textContent = fc(document.getElementById('setName').value);
  document.getElementById('fileName').textContent = '';
  scheduleSave();
}

function fc(s) { return (s || '').trim()[0] || '?'; }

document.getElementById('setName').addEventListener('input', function() {
  document.getElementById('displayName').textContent = this.value || '名無し';
  if (!avatarImg) avatar.textContent = fc(this.value);
});
document.getElementById('setHandle').addEventListener('input', function() {
  document.getElementById('displayHandle').textContent = '@' + this.value;
});
document.getElementById('setPostTime').addEventListener('input', function() {
  document.getElementById('postTime').textContent = this.value;
});
document.getElementById('setPostDate').addEventListener('input', function() {
  document.getElementById('postDate').textContent = this.value;
});
document.getElementById('setSbTime').addEventListener('input', function() {
  document.getElementById('sbTime').textContent = this.value;
});
document.getElementById('setViews').addEventListener('input', function() {
  document.getElementById('viewCount').textContent = this.value;
});
document.getElementById('setReply').addEventListener('input', function() {
  document.getElementById('replyCount').textContent = this.value;
});
document.getElementById('setRt').addEventListener('input', function() {
  document.getElementById('rtCount').textContent = this.value;
});
document.getElementById('setLike').addEventListener('input', function() {
  document.getElementById('likeCount').textContent = this.value;
});
document.getElementById('setBk').addEventListener('input', function() {
  document.getElementById('bkCount').textContent = this.value;
});

document.getElementById('viewsToggle').addEventListener('change', function() {

// Long-press on status bar or top nav to toggle UI
let _pt=null,_px=0,_py=0;
['statusbarEl','topnavEl'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{_px=e.clientX;_py=e.clientY;_pt=setTimeout(()=>{if(navigator.vibrate)navigator.vibrate(20);uiHidden?showUI():hideUI();},600);});
  el.addEventListener('pointerup',()=>clearTimeout(_pt));
  el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-_px,e.clientY-_py)>10)clearTimeout(_pt);});
  el.addEventListener('pointercancel',()=>clearTimeout(_pt));
});

/* ===== サンプル / ローカル保存 ===== */
const LS_KEY = 'xpostmock-state-v1';
const SAMPLE_BODY =

'ご応募はDMにて顔写真付きの履歴書を添付の上、お気軽に✉️';

// 現在日時ユーティリティ
const p2 = n => String(n).padStart(2, '0');
function nowTime() { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function nowDate() { const d = new Date(); return d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()); }

// 捨てアカ風のランダムなユーザー名（X の自動生成ハンドルに寄せた文字列）
function randomHandle() {
  const v = 'aeiou', c = 'bcdfghjklmnprstvwz';
  const pick = s => s[Math.floor(Math.random() * s.length)];
  const len = 14 + Math.floor(Math.random() * 7); // 14〜20文字
  let s = '';
  while (s.length < len) {
    if (Math.random() < .35) s += pick(c);
    s += pick(c) + pick(v);
    if (Math.random() < .25) s += pick(v);
  }
  s = s.slice(0, len);
  if (Math.random() < .7) s += Math.floor(Math.random() * 10);
  return s;
}

function sampleState() {
  return {
    name: 'もんめ', handle: randomHandle(),
    avatarColor: palette[1], avatarImg: null,
    body: SAMPLE_BODY,
    postTime: nowTime(), postDate: nowDate(), sbTime: nowTime(),
    views: '591万', reply: '404', rt: '1764', like: '1', bk: '5444',
    viewsOn: false, replyOn: false, rtOn: false, likeOn: true, bkOn: false,
    sbShow: true, actionShow: true, dark: false,
    autoTime: true, randHandle: true,
    exportRange: 'phone', exportScale: 3, transparent: false
  };
}

function rerollHandle() {
  const h = randomHandle();
  $('setHandle').value = h;
  $('displayHandle').textContent = '@' + h;
  save();
}

const $ = id => document.getElementById(id);
let _saveTimer = null, _restoring = false;

function currentState() {
  return {
    name: $('setName').value,
    handle: $('setHandle').value,
    avatarColor, avatarImg,
    body: $('postBody').textContent,
    postTime: $('setPostTime').value,
    postDate: $('setPostDate').value,
    sbTime: $('setSbTime').value,
    views: $('setViews').value,
    reply: $('setReply').value,
    rt: $('setRt').value,
    like: $('setLike').value,
    bk: $('setBk').value,
    viewsOn: $('viewsToggle').checked,
    replyOn: $('replyToggle').checked,
    rtOn: $('rtToggle').checked,
    likeOn: $('likeToggle').checked,
    bkOn: $('bkToggle').checked,
    sbShow: $('sbToggle').checked,
    actionShow: $('actionToggle').checked,
    autoTime: $('autoTimeToggle').checked,
    randHandle: $('randHandleToggle').checked,
    exportRange: $('setExportRange').value,
    exportScale: +$('setExportScale').value,
    transparent: $('transToggle').checked,
    dark: document.body.classList.contains('dark')
  };
}

function save() {
  if (_restoring) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(currentState())); } catch (e) {}
}
function scheduleSave() { clearTimeout(_saveTimer); _saveTimer = setTimeout(save, 250); }

function applyState(s) {
  _restoring = true;

  $('setName').value = s.name;
  $('displayName').textContent = s.name || '名無し';
  $('setHandle').value = s.handle;
  $('displayHandle').textContent = '@' + s.handle;

  avatarColor = s.avatarColor || palette[0];
  avatarImg = s.avatarImg || null;
  if (avatarImg) {
    avatar.style.background = 'url(' + avatarImg + ') center/cover';
    avatar.textContent = '';
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
  } else {
    avatar.style.background = avatarColor;
    avatar.textContent = fc(s.name);
    const ci = palette.indexOf(avatarColor);
    document.querySelectorAll('.swatch').forEach((x, i) => x.classList.toggle('sel', i === ci));
  }
  $('fileName').textContent = '';

  $('postBody').textContent = s.body;

  [['setPostTime', 'postTime', s.postTime],
   ['setPostDate', 'postDate', s.postDate],
   ['setViews', 'viewCount', s.views],
   ['setReply', 'replyCount', s.reply],
   ['setRt', 'rtCount', s.rt],
   ['setLike', 'likeCount', s.like],
   ['setBk', 'bkCount', s.bk]].forEach(([inp, out, v]) => {
    $(inp).value = v; $(out).textContent = v;
  });
  $('setSbTime').value = s.sbTime;
  $('sbTime').textContent = s.sbTime;

  [['viewsToggle', 'viewsSpan', s.viewsOn],
   ['replyToggle', 'replyCount', s.replyOn],
   ['rtToggle', 'rtCount', s.rtOn],
   ['likeToggle', 'likeCount', s.likeOn],
   ['bkToggle', 'bkCount', s.bkOn],
   ['sbToggle', 'statusbarEl', s.sbShow],
   ['actionToggle', 'actionBarEl', s.actionShow]].forEach(([tg, el, on]) => {
    $(tg).checked = !!on; $(el).style.display = on ? '' : 'none';
  });

  $('autoTimeToggle').checked = s.autoTime !== false;
  $('randHandleToggle').checked = s.randHandle !== false;
  $('setExportRange').value = s.exportRange || 'phone';
  $('setExportScale').value = String(s.exportScale || 3);
  $('transToggle').checked = !!s.transparent;

  const wantDark = !!s.dark;
  document.body.classList.toggle('dark', wantDark);
  $('darkBtn').textContent = wantDark ? '☀ ライト' : '🌙 ダーク';

  _restoring = false;
}

function loadSample() {
  applyState(sampleState()); save(); closePanel();
  document.getElementById('toolbar').classList.remove('open');
}
function resetAll() {
  if (!confirm('編集内容を消してサンプルに戻します。よろしいですか？')) return;
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  loadSample();
}

// 変更を自動保存
$('postBody').addEventListener('input', scheduleSave);
document.querySelector('.panel').addEventListener('input', scheduleSave);
document.querySelector('.panel').addEventListener('change', scheduleSave);

// 初期表示：保存があれば復元、なければサンプル
(function init() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  let st = sampleState();
  if (saved && typeof saved.body === 'string') {
    st = saved;
    if (st.autoTime !== false) { st.postTime = nowTime(); st.postDate = nowDate(); st.sbTime = nowTime(); }
    if (st.randHandle !== false) st.handle = randomHandle();
  }
  applyState(st);
  save();
})();

/* ===== 表示スケール =====
   画面が 420px より狭いときだけ縮めて表示する。レイアウトは 420x920 のままなので、
   スマホで作ってもPCで作っても書き出される素材は同じになる。 */
const stage = document.getElementById('stage');
function fitStage() {
  const s = Math.min(1, (document.documentElement.clientWidth || 420) / 420);
  $('phone').style.transform = s < 1 ? 'scale(' + s + ')' : '';
  stage.style.width = (420 * s) + 'px';
  stage.style.height = (920 * s) + 'px';
}
window.addEventListener('resize', fitStage);
fitStage();

// 書き出し中だけ等倍に戻す（縮小表示のまま撮ると素材まで縮む）。
// 併せて左寄せにする: 画面より広い 420px を中央寄せすると端数座標に載り、
// アイコンの縁などがサブピクセルでにじんで端末ごとに差が出る。
function unscale() {
  const p = $('phone');
  const t = p.style.transform, w = stage.style.width, h = stage.style.height;
  const j = document.body.style.justifyContent;
  p.style.transform = ''; stage.style.width = '420px'; stage.style.height = 'auto';
  document.body.style.justifyContent = 'flex-start';
  return () => {
    p.style.transform = t; stage.style.width = w; stage.style.height = h;
    document.body.style.justifyContent = j;
  };
}

/* ===== 書き出し ===== */
function capture() {
  const mode = $('setExportRange').value;
  const scale = +$('setExportScale').value || 3;
  const trans = $('transToggle').checked;
  const target = mode === 'post' ? document.querySelector('.post-wrap')
               : mode === 'body' ? $('postBody')
               : $('phone');
  const isPhone = (target === $('phone'));

  const fab = $('fab'), toolbar = $('toolbar'), replyBar = $('replyBarEl');
  const rescale = unscale();
  toolbar.classList.remove('open');
  fab.style.display = 'none';
  const replyWas = replyBar.style.display;
  if (isPhone) replyBar.style.display = 'none';

  const restore = () => {
    rescale();
    fab.style.display = '';
    if (isPhone && !uiHidden) replyBar.style.display = replyWas;
  };

  const bg = trans ? null : (document.body.classList.contains('dark') ? '#000000' : '#ffffff');
  const name = isPhone ? 'x-post.png' : (mode === 'body' ? 'x-post-body.png' : 'x-post-koma.png');
  html2canvas(target, { backgroundColor: bg, scale, logging: false }).then(c => {
    c.toBlob(async blob => {
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch(e) {}
        restore(); return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.download = name; a.href = url; a.click();
      URL.revokeObjectURL(url); restore();
    }, 'image/png');
  }).catch(e => { restore(); alert('書き出しに失敗しました: ' + e); });
}
