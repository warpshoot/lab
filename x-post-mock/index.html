<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Post Mock</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#ffffff; --text:#0f1419; --sub:#536471; --border:#eff3f4;
  --icon:#536471; --blue:#1d9bf0;
}
body.dark {
  --bg:#000000; --text:#e7e9ea; --sub:#71767b; --border:#2f3336;
  --icon:#71767b; --blue:#1d9bf0;
}
html,body { height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Hiragino Sans","Yu Gothic UI",sans-serif;
  background:#444; display:flex; justify-content:center; color:var(--text);
}
.phone {
  width:100%; max-width:420px; height:100vh; max-height:920px;
  background:var(--bg); display:flex; flex-direction:column;
  position:relative; overflow:hidden; transition:background .2s;
}

/* Status bar */
.statusbar {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 22px 4px; font-size:15px; font-weight:600; flex-shrink:0; color:var(--text);
}
.sb-right { display:flex; align-items:center; gap:5px; }
.bat-wrap { display:flex; align-items:center; gap:1px; }
.bat-body { width:22px; height:11px; border:1.5px solid var(--text); border-radius:3px; padding:1px; display:flex; }
.bat-fill { height:100%; background:var(--text); border-radius:1px; }
.bat-cap { width:1.5px; height:4px; background:var(--text); border-radius:0 1px 1px 0; }

/* Top nav */
.topnav {
  display:flex; align-items:center; padding:4px 4px 8px; flex-shrink:0;
}
.nav-btn {
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; flex-shrink:0;
}
.nav-title { flex:1; text-align:center; font-size:20px; font-weight:700; }

/* Scrollable area */
.post-scroll { flex:1; min-height:0; overflow-y:auto; }
.post-wrap { padding:12px 16px 0; }

/* Author row */
.author-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
.avatar {
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#1d9bf0,#0a5a94);
  background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:18px; overflow:hidden;
}
.author-mid { flex:1; min-width:0; }
.author-name { font-size:15px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.author-handle { font-size:14px; color:var(--sub); margin-top:1px; }
.xcombadge {
  display:flex; align-items:center; gap:3px; color:var(--sub);
  font-size:13px; font-weight:500; flex-shrink:0; padding-top:2px; user-select:none;
}
.xcombadge svg { width:14px; height:14px; }

/* Post body */
.post-body {
  font-size:20px; line-height:1.5; color:var(--text);
  word-break:break-word; white-space:pre-wrap;
  outline:none; margin-bottom:14px; min-height:1em;
  caret-color:var(--blue);
}
.post-body:empty::before {
  content: attr(data-placeholder);
  color: var(--sub);
  pointer-events: none;
}

/* Meta line */
.post-meta {
  font-size:14px; color:var(--sub);
  padding-bottom:12px; border-bottom:1px solid var(--border);
}
.post-meta strong { color:var(--text); font-weight:600; }

/* Action bar */
.action-bar {
  display:flex; justify-content:space-around; align-items:center;
  padding:6px 0; border-bottom:1px solid var(--border);
}
.act-btn {
  display:flex; align-items:center; gap:5px;
  padding:8px 6px; border-radius:20px; cursor:pointer;
  color:var(--icon); font-size:13px; font-weight:500; user-select:none;
}
.act-btn svg { width:20px; height:20px; flex-shrink:0; }
.act-count { min-width:20px; }

/* Reply bar (decorative) */
.reply-bar {
  flex-shrink:0; display:flex; align-items:center; gap:10px;
  padding:10px 16px; border-top:1px solid var(--border); background:var(--bg);
}
.reply-mini-avatar { width:32px; height:32px; border-radius:50%; background:var(--blue); flex-shrink:0; }
.reply-placeholder { color:var(--sub); font-size:15px; pointer-events:none; user-select:none; }

/* FAB */
.fab {
  position:absolute; top:8px; right:10px; z-index:30;
  width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(120,120,120,.85); color:#fff; font-size:16px;
}
.toolbar {
  position:absolute; top:48px; right:10px; z-index:30;
  display:none; flex-direction:column; gap:6px;
}
.toolbar.open { display:flex; }
.toolbar button {
  border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600;
  cursor:pointer; background:rgba(120,120,120,.92); color:#fff; white-space:nowrap; text-align:left;
}

/* Overlay */
.overlay { position:absolute; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:40; padding:18px; }
.overlay.open { display:flex; }
.panel {
  width:100%; background:var(--bg); border-radius:14px; padding:18px;
  display:flex; flex-direction:column; gap:13px;
  max-height:90%; overflow-y:auto; border:1px solid var(--border);
}
.panel h3 { font-size:16px; font-weight:700; }
.sec { font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:13px; color:var(--sub); }
.field input[type=text] {
  background:transparent; border:1px solid var(--border); border-radius:8px;
  padding:8px 10px; color:var(--text); font-size:15px; outline:none; width:100%; font-family:inherit;
}
.colors { display:flex; gap:8px; flex-wrap:wrap; }
.swatch { width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.swatch.sel { border-color:var(--blue); }
.toggle-row { display:flex; align-items:center; justify-content:space-between; font-size:13px; }
.switch { position:relative; width:46px; height:26px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; inset:0; background:#c7c7c7; border-radius:26px; transition:.2s; cursor:pointer; }
.slider:before { content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
.switch input:checked + .slider { background:var(--blue); }
.switch input:checked + .slider:before { transform:translateX(20px); }
.panel-btns { display:flex; gap:8px; }
.panel-btns button { flex:1; padding:10px; border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; color:#fff; }
.upload-btn { background:#8e8e8e; }
.done-btn { background:var(--blue); }
.file-name { font-size:12px; color:var(--sub); }
</style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <button onclick="toggleDark()" id="darkBtn">🌙 ダーク</button>

  <!-- Top navigation -->

      <!-- Author -->
      <div class="author-row">

        <div class="author-mid">
          <div class="author-name" id="displayName">となり街の園田さん</div>
          <div class="author-handle" id="displayHandle">@motokanoirane</div>
        </div>
        <div class="xcombadge" id="xcombadgeEl">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.261 5.632zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X.com
        </div>

      <!-- Meta -->
      <div class="post-meta" id="postMetaEl">

      <!-- Action bar -->
      <div class="action-bar" id="actionBarEl">
        <div class="act-btn">

        </div>
        <div class="act-btn">

        </div>

      <span class="reply-placeholder">返信をポスト</span>
    </div>

  <!-- Settings overlay -->

      <div class="sec">ポスト情報</div>
      <div class="field"><label>投稿時刻</label><input type="text" id="setPostTime" value="21:26"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const avatar = document.getElementById('avatar');
let avatarColor = 'linear-gradient(135deg,#1d9bf0,#0a5a94)';
let avatarImg = null;

const palette = [
  'linear-gradient(135deg,#1d9bf0,#0a5a94)',
  'linear-gradient(135deg,#4ca771,#2f7d52)',
  'linear-gradient(135deg,#e0915a,#c9603b)',
  'linear-gradient(135deg,#b06ef7,#5e35b1)',
  'linear-gradient(135deg,#e06a90,#b03d63)',
  'linear-gradient(135deg,#8d99ae,#43485a)'
];

const colorRow = document.getElementById('colorRow');
palette.forEach((g, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' sel' : '');
  s.style.background = g;
  s.onclick = () => {
    avatarColor = g; avatarImg = null;
    avatar.style.background = g;
    avatar.textContent = fc(document.getElementById('setName').value);
    document.getElementById('fileName').textContent = '';
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
    s.classList.add('sel');
  };
  colorRow.appendChild(s);
});

document.getElementById('fileInput').addEventListener('change', function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    avatarImg = ev.target.result;
    avatar.style.background = 'url(' + avatarImg + ') center/cover';
    avatar.textContent = '';
    document.getElementById('fileName').textContent = f.name;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
  };
  r.readAsDataURL(f);
});

function clearImg() {
  avatarImg = null;
  avatar.style.background = avatarColor;
  avatar.textContent = fc(document.getElementById('setName').value);
  document.getElementById('fileName').textContent = '';
}

function fc(s) { return (s || '').trim()[0] || '?'; }

document.getElementById('setName').addEventListener('input', function() {
  document.getElementById('displayName').textContent = this.value || '名無し';
  if (!avatarImg) avatar.textContent = fc(this.value);
});
document.getElementById('setHandle').addEventListener('input', function() {
  document.getElementById('displayHandle').textContent = '@' + this.value;
});
document.getElementById('setPostTime').addEventListener('input', function() {
  document.getElementById('postTime').textContent = this.value;
});
document.getElementById('setPostDate').addEventListener('input', function() {
  document.getElementById('postDate').textContent = this.value;
});
document.getElementById('setSbTime').addEventListener('input', function() {
  document.getElementById('sbTime').textContent = this.value;
});
document.getElementById('setViews').addEventListener('input', function() {
  document.getElementById('viewCount').textContent = this.value;
});
document.getElementById('setReply').addEventListener('input', function() {
  document.getElementById('replyCount').textContent = this.value;
});
document.getElementById('setRt').addEventListener('input', function() {
  document.getElementById('rtCount').textContent = this.value;
});
document.getElementById('setLike').addEventListener('input', function() {
  document.getElementById('likeCount').textContent = this.value;
});
document.getElementById('setBk').addEventListener('input', function() {
  document.getElementById('bkCount').textContent = this.value;
});

document.getElementById('viewsToggle').addEventListener('change', function() {
  document.getElementById('viewsSpan').style.display = this.checked ? '' : 'none';
});
document.getElementById('replyToggle').addEventListener('change', function() {
  document.getElementById('replyCount').style.display = this.checked ? '' : 'none';
});
document.getElementById('rtToggle').addEventListener('change', function() {
  document.getElementById('rtCount').style.display = this.checked ? '' : 'none';
});
document.getElementById('likeToggle').addEventListener('change', function() {
  document.getElementById('likeCount').style.display = this.checked ? '' : 'none';
});
document.getElementById('bkToggle').addEventListener('change', function() {
  document.getElementById('bkCount').style.display = this.checked ? '' : 'none';
});
document.getElementById('sbToggle').addEventListener('change', function() {
  document.getElementById('statusbarEl').style.display = this.checked ? '' : 'none';
});
document.getElementById('actionToggle').addEventListener('change', function() {
  document.getElementById('actionBarEl').style.display = this.checked ? '' : 'none';
});
document.getElementById('xcombadgeToggle').addEventListener('change', function() {
  document.getElementById('xcombadgeEl').style.display = this.checked ? '' : 'none';
});

function toggleToolbar() { document.getElementById('toolbar').classList.toggle('open'); }
function toggleDark() {
  document.body.classList.toggle('dark');
  document.getElementById('darkBtn').textContent = document.body.classList.contains('dark') ? '☀ ライト' : '🌙 ダーク';
}

let uiHidden = false;
function hideUI() {
  uiHidden = true;
  document.getElementById('toolbar').classList.remove('open');
  document.getElementById('fab').textContent = '👁';
  document.getElementById('fab').onclick = showUI;
  document.getElementById('replyBarEl').style.display = 'none';
  document.getElementById('postBody').contentEditable = 'false';
}
function showUI() {
  uiHidden = false;
  document.getElementById('fab').textContent = '⚙';
  document.getElementById('fab').onclick = toggleToolbar;
  document.getElementById('replyBarEl').style.display = '';
  document.getElementById('postBody').contentEditable = 'true';
}

function openPanel() {
  document.getElementById('toolbar').classList.remove('open');
  document.getElementById('overlay').classList.add('open');
}
function closePanel() { document.getElementById('overlay').classList.remove('open'); }

function capture() {
  const fab = document.getElementById('fab');
  const toolbar = document.getElementById('toolbar');
  const replyBar = document.getElementById('replyBarEl');
  toolbar.classList.remove('open');
  fab.style.display = 'none';
  const replyWas = replyBar.style.display;
  replyBar.style.display = 'none';
  const darkBg = document.body.classList.contains('dark') ? '#000000' : '#ffffff';
  html2canvas(document.getElementById('phone'), { backgroundColor: darkBg, scale: 2 }).then(c => {
    fab.style.display = '';
    if (!uiHidden) replyBar.style.display = replyWas;
    c.toBlob(async blob => {
      const file = new File([blob], 'x-post.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch(e) {}
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.download = 'x-post.png'; a.href = url; a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  });
}
</script>
</body>
</html>
