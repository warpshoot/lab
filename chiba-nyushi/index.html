<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千葉県公立高校入試 5教科対策ポータル</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3441;
    --txt:#e6edf3; --sub:#8b98a9; --accent:#4fc3f7; --accent2:#66d9a8;
    --warn:#ffb454;
    --kokugo:#f78fb3; --sugaku:#4fc3f7; --eigo:#c792ea; --rika:#66d9a8; --shakai:#ffb454;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.7; padding-bottom:60px;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}

  header{
    background:linear-gradient(135deg,#14263a,#0d1117);
    border-bottom:1px solid var(--line); padding:28px 0 24px; margin-bottom:20px;
  }
  header h1{font-size:21px;font-weight:700;letter-spacing:.02em}
  header p{color:var(--sub);font-size:13px;margin-top:4px}

  /* カウントダウン + 全体進捗 */
  .dash{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  @media (max-width:560px){.dash{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card-label{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.04em}
  .count-num{font-size:34px;font-weight:800;line-height:1.3}
  .count-num small{font-size:14px;font-weight:600;color:var(--sub);margin-left:4px}
  .count-date{font-size:12px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .count-date input{
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--txt);font-size:12px;padding:3px 6px;font-family:inherit;
    color-scheme:dark;
  }
  .total-num{font-size:34px;font-weight:800;line-height:1.3}
  .total-num small{font-size:14px;font-weight:600;color:var(--sub);margin-left:4px}
  .prog-bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:10px}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}

  /* 教科カード */
  h2.sec{font-size:15px;font-weight:700;margin:26px 0 12px;color:var(--sub);letter-spacing:.04em}
  .subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.subjects{grid-template-columns:1fr}}
  .subj{
    display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;transition:.15s;position:relative;overflow:hidden;
  }
  .subj:hover{border-color:var(--c);background:var(--panel2)}
  .subj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .subj-head{display:flex;align-items:center;gap:10px}
  .subj-name{font-size:17px;font-weight:700}
  .subj-name span{color:var(--c)}
  .subj-pct{margin-left:auto;font-size:13px;font-weight:700;color:var(--c)}
  .subj-fields{font-size:12px;color:var(--sub);margin-top:6px}
  .subj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--sub)}
  .subj .prog-bar{margin-top:12px}
  .subj .prog-fill{background:var(--c)}
  .subj-cnt{font-size:11px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}
  .subj-go{font-weight:600;color:var(--c)}

  footer{margin-top:32px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>千葉県公立高校入試 対策ポータル</h1>
    <p>5教科の要点整理・確認テスト・模試をここからスタート</p>
    <div class="dash">
      <div class="card">
        <div class="card-label">入試（学力検査）まで</div>
        <div class="count-num" id="countNum">--<small>日</small></div>
        <div class="count-date">
          <span>検査日</span>
          <input type="date" id="examDate">
        </div>
      </div>
      <div class="card">
        <div class="card-label">5教科ぜんぶの進み具合</div>
        <div class="total-num" id="totalNum">0<small>/ 0 単元</small></div>
        <div class="prog-bar"><div class="prog-fill" id="totalFill"></div></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <h2 class="sec">教科をえらぶ</h2>
  <div class="subjects" id="subjects"></div>
  <footer>進捗は各教科のページで「学習済み」にすると、ここに反映されます。</footer>
</div>

<script>
const SUBJECTS=[
  {name:"国語", path:"../chiba-kokugo/", cssVar:"--kokugo", total:20, lsKey:"chiba_kokugo_progress_v1",
   fields:"漢字・語句／文法／読解／古典", tags:["要点整理","一問一答","条件作文","模試"]},
  {name:"数学", path:"../chiba-sugaku/", cssVar:"--sugaku", total:26, lsKey:"chiba_sugaku_progress_v1",
   fields:"数と式／方程式／関数／図形／データ", tags:["要点整理","一問一答","証明","模試"]},
  {name:"英語", path:"../chiba-eigo/", cssVar:"--eigo", total:24, lsKey:"chiba_eigo_progress_v1",
   fields:"文法／単語・熟語／会話表現／読解", tags:["単語カード","並べかえ","英作文","模試"]},
  {name:"理科", path:"../chiba-rika/", cssVar:"--rika", total:33, lsKey:"chiba_rika_progress_v1",
   fields:"物理／化学／生物／地学", tags:["要点整理","一問一答","記述","模試"]},
  {name:"社会", path:"../chiba-shakai/", cssVar:"--shakai", total:32, lsKey:"chiba_shakai_progress_v1",
   fields:"地理／歴史／公民", tags:["一問一答","年代並べかえ","記述","模試"]},
];

const DATE_KEY="chiba_portal_exam_date";
const DEFAULT_EXAM="2027-02-17"; // 仮の日付。正式日程が出たら変更してください

function doneCount(lsKey){
  try{
    const p=JSON.parse(localStorage.getItem(lsKey)||"{}");
    return Object.values(p).filter(Boolean).length;
  }catch(e){return 0}
}

function renderSubjects(){
  const box=document.getElementById("subjects");
  let done=0,total=0;
  box.innerHTML=SUBJECTS.map(s=>{
    const d=Math.min(doneCount(s.lsKey),s.total);
    done+=d; total+=s.total;
    const pct=Math.round(d/s.total*100);
    return `<a class="subj" href="${s.path}" style="--c:var(${s.cssVar})">
      <div class="subj-head">
        <div class="subj-name"><span>■</span> ${s.name}</div>
        <div class="subj-pct">${pct}%</div>
      </div>
      <div class="subj-fields">${s.fields}</div>
      <div class="subj-tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="subj-cnt"><span>${d} / ${s.total} 単元 完了</span><span class="subj-go">はじめる →</span></div>
    </a>`;
  }).join("");
  const tp=total?Math.round(done/total*100):0;
  document.getElementById("totalNum").innerHTML=`${done}<small>/ ${total} 単元（${tp}%）</small>`;
  document.getElementById("totalFill").style.width=tp+"%";
}

function renderCountdown(){
  const input=document.getElementById("examDate");
  const saved=localStorage.getItem(DATE_KEY)||DEFAULT_EXAM;
  input.value=saved;
  const today=new Date(); today.setHours(0,0,0,0);
  const exam=new Date(saved+"T00:00:00");
  const days=Math.round((exam-today)/86400000);
  const el=document.getElementById("countNum");
  if(isNaN(days)) el.innerHTML=`--<small>日</small>`;
  else if(days>0) el.innerHTML=`あと ${days}<small>日</small>`;
  else if(days===0) el.innerHTML=`本番当日！<small>がんばれ！</small>`;
  else el.innerHTML=`終了<small>おつかれさま！</small>`;
}

document.getElementById("examDate").addEventListener("change",e=>{
  if(e.target.value) localStorage.setItem(DATE_KEY,e.target.value);
  renderCountdown();
});

function renderAll(){renderSubjects();renderCountdown();}
renderAll();
// 教科ページから戻ってきたとき（bfcache含む）に進捗を再反映
window.addEventListener("pageshow",renderAll);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderAll();});
</script>
</body>
</html>
