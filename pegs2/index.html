                ? '  <rect x="' + (vb.x * K).toFixed(2) + '" y="' + (vb.y * K).toFixed(2) +
                  '" width="' + size + '" height="' + size + '" fill="#000"/>\n' : '';
            const head = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
                (vb.x * K).toFixed(2) + ' ' + (vb.y * K).toFixed(2) + ' ' + size + ' ' + size +
                '" width="' + size + '" height="' + size + '">\n' + bg;

            // LINE は輪ゴムそのものを見る表示なので、合成せずに1本ずつ描く
            if (outline) {
                const d = loops.map(l => sub(l, false)).join('');
                return head + '  <path d="' + d + '" fill="none" stroke="' + ink +
                    '" stroke-width="' + (1.6 / 540 * vb.size * K).toFixed(2) + '"/>\n</svg>\n';
            }
            if (!loops.length) return head + '  <path d="" fill="' + ink + '"/>\n</svg>\n';
            if (combine === 'xor' || loops.length === 1) {
                const d = loops.map(l => sub(l, false)).join('');
                return head + '  <path d="' + d + '" fill="' + ink + '" fill-rule="evenodd"/>\n</svg>\n';
            }
            if (combine === 'unite') {
                // 巻き方向を揃えれば nonzero がそのまま合成になる
                const refSign = signedArea(loops[0]) >= 0 ? 1 : -1;
                const d = loops.map(l =>
                    sub(l, refSign !== (signedArea(l) >= 0 ? 1 : -1))).join('');
                return head + '  <path d="' + d + '" fill="' + ink + '" fill-rule="nonzero"/>\n</svg>\n';
            }
            // CROSS と MINUS は塗り規則では書けないので clipPath を入れ子にする。
            // MINUS は「枠＋抜く形」を evenodd で切ると、その形の外側になる
            const box = 'M' + [[vb.x, vb.y], [vb.x + vb.size, vb.y],
                               [vb.x + vb.size, vb.y + vb.size], [vb.x, vb.y + vb.size]]
                .map(q => (q[0] * K).toFixed(2) + ' ' + (q[1] * K).toFixed(2)).join('L') + 'Z';
            let defs = '', ref = '';
            for (let n = 1; n < loops.length; n++) {
                const d = combine === 'cross' ? sub(loops[n], false) : box + sub(loops[n], false);
                defs += '    <clipPath id="c' + n + '"' + (ref ? ' clip-path="' + ref + '"' : '') +
                    '>\n      <path d="' + d + '" clip-rule="evenodd"/>\n    </clipPath>\n';
                ref = 'url(#c' + n + ')';
            }
            return head + '  <defs>\n' + defs + '  </defs>\n' +
                '  <path d="' + sub(loops[0], false) + '" fill="' + ink +
                '" clip-path="' + ref + '"/>\n</svg>\n';
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove('show'), 1400);
        }

        function download(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        document.getElementById('btnSvg').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            download(new Blob([svgText()], { type: 'image/svg+xml' }), 'pegs2.svg');
        };

        document.getElementById('btnCopy').onclick = async () => {
            if (!loops.length) return toast('EMPTY');
            const text = svgText();
            try {
                await navigator.clipboard.writeText(text);
                toast('COPIED');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                toast('COPIED');
            }
        };

        document.getElementById('btnPng').onclick = () => {
            if (!loops.length) return toast('EMPTY');
            const vb = frame();
            const px = 1024;
            const c = document.createElement('canvas');
            c.width = c.height = px;
            const g = c.getContext('2d');
            g.fillStyle = invert ? '#000' : '#fff';
            g.fillRect(0, 0, px, px);
            const scale = px / vb.size;
            const ox = -vb.x * scale, oy = -vb.y * scale;
            const ink = invert ? '#fff' : '#000';
            if (outline) {
                // LINE は輪ゴムそのもの。合成せずに1本ずつ
                g.strokeStyle = ink;
                g.lineWidth = px / 540 * 1.6;
                g.stroke(pathFromLoops(scale, ox, oy, null));
            } else {
                g.fillStyle = ink;
                fillShape(g, scale, ox, oy, null, px, px);
            }
            c.toBlob(b => download(b, 'pegs2.png'), 'image/png');
        };

        // ===== 保存 =========================================================
        // PNG や SVG を開いて戻ってくると読み込み直しになる端末があるので、
        // 編集中の状態はそのつど localStorage に置いておく。
        // それとは別に、盤面ごとファイルに書き出して取っておいたり、
        // 人に渡したり、あとで読み込み直したりもできるようにする。
        // どちらも同じ形の状態オブジェクトを使う
        const STORE = 'pegs2:state';
        // v2 で杭ごとの半径（pegR）と窓（zoom / pan）が増えた。
        // v1 は pegR が無いだけなので、そのまま読める
        const FILE_VERSION = 2;
        let restoring = false;

        // 接点の列も形を決める状態なので、杭といっしょに持つ
        function snapshotState() {
            return {
                v: FILE_VERSION,
                cols, rows,
                radius: +radiusRange.value,
                outline, preview, invert, combine, tool,
                zoom, panX, panY,
                pegs: [...pegs],
                pegR: [...pegWant],
                active,
                bands: bands.map(b => ({
                    c: b.contacts.map(ct => ({ k: ct.k, s: ct.s })),
                    sd: [...b.sides]
                }))
            };
        }

        function applyState(s) {
            const cells = s && (Array.isArray(s.pegs) ? s.pegs : s.grid);   // grid は旧形式
            if (!s || !Array.isArray(cells)) return false;
            restoring = true;
            const clamp = (n, d) => Number.isFinite(n) ? Math.min(GRID_MAX, Math.max(GRID_MIN, Math.round(n))) : d;
            cols = clamp(s.cols, cols); rows = clamp(s.rows, rows);
            pegs.clear(); pegWant.clear(); pegEff.clear();
            bands = []; active = 0; selKey = null;
            // 旧形式は杭が側を持っていた。輪ゴム1本ぶんの控えとして拾う
            const oldSide = new Map();
            for (const e of cells) {
                const [raw, v] = Array.isArray(e) ? e : [e, undefined];
                const k = String(raw);
                const [i, j] = k.split(',').map(Number);
                if (!Number.isInteger(i) || !Number.isInteger(j)) continue;
                if (i < 0 || j < 0 || i >= cols || j >= rows) continue;
                pegs.add(k);
                if (v !== undefined) oldSide.set(k, v === OUT ? OUT : IN);
            }
            // v1 のつまみ位置は別の曲線で刻まれていた（0.5*(0.30+0.67t)、上限は
            // セル間隔の半分）。生の値をそのまま入れると太さが化けるので、
            // いったん半径へ戻してから、いまの曲線のつまみ位置に置き直す
            if (Number.isFinite(s.radius)) {
                let t = s.radius / 1000;
                if (!(s.v >= 2)) t = tOfR(S * 0.5 * (0.30 + 0.67 * t));
                radiusRange.value = Math.round(Math.max(0, Math.min(1, t)) * 1000);
            }
            for (const e of (Array.isArray(s.pegR) ? s.pegR : []))
                if (Array.isArray(e) && pegs.has(e[0]) && Number.isFinite(e[1]))
                    pegWant.set(e[0], Math.max(R_MIN, Math.min(R_MAX, e[1])));
            tool = s.tool === 'size' ? 'size' : 'peg';
            zoom = Number.isFinite(s.zoom) ? Math.max(Z_MIN, Math.min(Z_MAX, s.zoom)) : 1;
            panX = Number.isFinite(s.panX) ? s.panX : 0;
            panY = Number.isFinite(s.panY) ? s.panY : 0;
            clampPan();
            outline = !!s.outline; preview = !!s.preview; invert = !!s.invert;
            combine = ['unite', 'minus', 'cross', 'xor'].includes(s.combine) ? s.combine : 'xor';

            const src = Array.isArray(s.bands) ? s.bands
                : (Array.isArray(s.band) && s.band.length ? [{ c: s.band, sd: [...oldSide] }] : []);
            for (const b of src) {
                const contacts = (Array.isArray(b.c) ? b.c : [])
                    .filter(ct => ct && pegs.has(ct.k))
                    .map(ct => ({ k: ct.k, s: ct.s === OUT ? OUT : IN, c: pegC(ct.k), r: rOf(ct.k) }));
                if (!contacts.length) continue;
                const sd = new Map();
                for (const e of (Array.isArray(b.sd) ? b.sd : []))
                    if (Array.isArray(e) && pegs.has(e[0])) sd.set(e[0], e[1] === OUT ? OUT : IN);
                for (const k of pegs) if (!sd.has(k)) sd.set(k, OUT);
                for (const ct of contacts) sd.set(ct.k, ct.s);
                bands.push({ contacts, sides: sd, ghosts: new Map(), loop: null, owner: [] });
            }
            active = Math.min(Number(s.active) || 0, Math.max(0, bands.length - 1));
            restoring = false;
            return true;
        }

        function save() {
            if (restoring) return;
            try { localStorage.setItem(STORE, JSON.stringify(snapshotState())); }
            catch (e) { /* 保存できなくても編集は続けられる */ }
        }

        function load() {
            let s = null;
            try { s = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { }
            return applyState(s);
        }

        // 盤面をファイルへ書き出し／ファイルから読み込む。バグ報告用にも、
        // 作った形をただ取っておくためにも使える
        document.getElementById('btnExport').onclick = () => {
            const text = JSON.stringify(snapshotState(), null, 2);
            download(new Blob([text], { type: 'application/json' }), 'pegs2.json');
        };

        const fileImport = document.getElementById('fileImport');
        document.getElementById('btnImport').onclick = () => fileImport.click();
        fileImport.addEventListener('change', async () => {
            const file = fileImport.files[0];
            fileImport.value = '';   // 同じファイルを続けて選んでも change が発火するように
            if (!file) return;
            let s = null;
            try { s = JSON.parse(await file.text()); } catch (e) { return toast('読めない形式'); }
            const cells = s && (Array.isArray(s.pegs) ? s.pegs : s.grid);
            if (!Array.isArray(cells)) return toast('読めない形式');
            mark();
            applyState(s);
            refreshSegs(); refreshView(); refreshPreview(); refreshCombine(); readSliders();
            refreshTool(); refreshSize(); refreshZoom();
            refreshBands(true);
            update();
            toast('IMPORTED');
        });

        // ===== 初期状態 =====================================================
        // 前回の続きがあれば拾う。無ければ空の盤面から始める
        load();

        refreshSegs();
        refreshUndo();
        refreshView();
        refreshCombine();
        refreshPreview();
        refreshTool();
        readSliders();
        refreshSize();
        refreshZoom();
        update();
        window.addEventListener('resize', draw);
        window.addEventListener('pagehide', save);
        document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
    </script>
</body>

</html>
