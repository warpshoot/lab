<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <!-- 盤のピンチは .stage の touch-action: none で押さえてある。
         ページ全体の拡大まで殺すと、小さい文字を読む手段が無くなる -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEGS2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #0f0f0f;
            --ink: #fff;
            --line: rgba(255, 255, 255, 0.10);
            --line-strong: rgba(255, 255, 255, 0.22);
            --fill: rgba(255, 255, 255, 0.05);
            --fill-hover: rgba(255, 255, 255, 0.11);
            --label: rgba(255, 255, 255, 0.38);
            --text: rgba(255, 255, 255, 0.78);
            --r: 6px;
            --h: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            padding: 20px 16px 48px;
            /* 盤を長押しすると OS の選択・コールアウトが割り込む。
               掴んで引くのが主操作なので、文字の選択より押さえるほうを採る */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 縦1列。広い画面だけ、盤を左・操作を右に振り分ける */
        .app {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.14em;
        }

        .hint {
            font-size: 9px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.06em;
            text-align: right;
        }

        .hint b {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: var(--r);
            overflow: hidden;
            touch-action: none;
        }

        /* 反転すると盤が真っ黒になって、地の色と溶ける。
           そのときだけ縁を出して、どこまでが盤か見せる */
        .stage.inv {
            background: #000;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 杭が1本も無いときだけ。最初のひと突きの案内 */
        .empty {
            position: absolute;
            inset: auto 0 0 0;
            top: 50%;
            transform: translateY(-50%);
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .stage.inv .empty {
            color: rgba(255, 255, 255, 0.32);
        }

        /* 十字キー。盤の四辺のまんなかに置く。位置が動かないから覚えられる。
           入れ物は盤いっぱいに広げるが、指は通す。塞ぐのはボタンの上だけ */
        .pad {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .nudge {
            pointer-events: auto;
            position: absolute;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            color: rgba(0, 0, 0, 0.5);
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            transition: 0.12s;
        }

        .nudge:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.13);
            color: #000;
        }

        /* 行けない向き。盤の外か、そのセルが埋まっている。
           消しきらないのは、十字の形が崩れると何が欠けたのか読めないから */
        .nudge:disabled {
            opacity: 0.28;
            cursor: default;
        }

        .stage.inv .nudge {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.55);
        }

        .stage.inv .nudge:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        .nudge.up { top: 6px; left: 50%; transform: translateX(-50%); }
        .nudge.dn { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .nudge.lf { left: 6px; top: 50%; transform: translateY(-50%); }
        .nudge.rt { right: 6px; top: 50%; transform: translateY(-50%); }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 機能ごとのまとまり。見出し＋罫線で区切る */
        .group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .group > h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.28);
        }

        .group > h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: var(--h);
        }

        .row > label {
            font-size: 9px;
            letter-spacing: 0.12em;
            color: var(--label);
            width: 52px;
            flex-shrink: 0;
        }

        .row.dim {
            opacity: 0.38;
        }

        /* セル間隔を 1 とした半径をそのまま出す。0.50 で隣の杭に触れる、が
           盤の絵と直に結びつく。書き出しの座標はこれを 100 倍したもの */
        .value {
            font-size: 10px;
            color: var(--text);
            width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* --- スライダー。つまみの左側だけ塗って現在値を見せる --- */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: var(--h);
            background: transparent;
            cursor: pointer;
            --t: 0.86;
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(to right,
                rgba(255, 255, 255, 0.75) 0 calc(var(--t) * 100%),
                var(--line-strong) calc(var(--t) * 100%) 100%);
        }

        input[type=range]::-moz-range-track {
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(to right,
                rgba(255, 255, 255, 0.75) 0 calc(var(--t) * 100%),
                var(--line-strong) calc(var(--t) * 100%) 100%);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #fff;
            margin-top: -5.5px;
            transition: transform 0.12s;
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.15);
        }

        input[type=range]::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border: none;
            border-radius: 50%;
            background: #fff;
        }

        /* --- セグメント。1枚の帯として見せる --- */
        .seg {
            display: flex;
            flex: 1;
            min-height: var(--h);
            gap: 2px;
            padding: 2px;
            background: var(--fill);
            border-radius: var(--r);
        }

        .seg.tight {
            flex: 0 1 auto;
        }

        .seg button {
            flex: 1;
            min-width: 24px;
            height: calc(var(--h) - 4px);
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.08em;
            border-radius: calc(var(--r) - 2px);
            cursor: pointer;
            transition: 0.12s;
        }

        .seg button:hover:not(.on):not(:disabled) {
            background: var(--fill-hover);
            color: rgba(255, 255, 255, 0.8);
        }

        .seg button.on {
            background: #fff;
            color: #0f0f0f;
        }

        .seg button:disabled {
            cursor: default;
        }

        /* 輪ゴムの番号。数が増えるので折り返す */
        .seg.chips {
            flex-wrap: wrap;
        }

        .seg.chips button {
            flex: 0 0 auto;
            width: 24px;
            font-size: 10px;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            flex: 1;
            height: var(--h);
            background: var(--fill);
            border: none;
            border-radius: var(--r);
            color: var(--text);
            font-family: inherit;
            font-size: 11px;
            padding: 0 22px 0 10px;
            cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, 0.45) 50%),
                              linear-gradient(135deg, rgba(255, 255, 255, 0.45) 50%, transparent 50%);
            background-position: calc(100% - 13px) calc(50% - 1px), calc(100% - 9px) calc(50% - 1px);
            background-size: 4px 4px;
            background-repeat: no-repeat;
        }

        select:hover {
            background-color: var(--fill-hover);
        }

        select option {
            background: #1a1a1a;
            color: #fff;
        }

        .times {
            font-size: 11px;
            color: var(--label);
        }

        /* --- ボタン --- */
        .btns {
            display: flex;
            gap: 6px;
        }

        button.act {
            flex: 1;
            height: var(--h);
            padding: 0 10px;
            border: none;
            background: var(--fill);
            color: var(--text);
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.1em;
            border-radius: var(--r);
            cursor: pointer;
            transition: 0.12s;
        }

        button.act:hover:not(:disabled) {
            background: var(--fill-hover);
            color: #fff;
        }

        button.act:active:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        button.act:disabled {
            opacity: 0.36;
            cursor: default;
        }

        /* 主役の書き出し。ここだけ枠線を持たせて前に出す */
        button.act.key {
            border: 1px solid var(--line-strong);
        }

        /* 消す操作。UNDO で戻せるが、押す前に色で身構えさせる */
        button.act.danger:hover:not(:disabled) {
            background: rgba(255, 90, 80, 0.16);
            color: #ff9d95;
        }

        /* 脇役でも押せることは見せる。地を透明にすると、
           文字色が薄いぶんと合わさって、ただの注記に見える */
        button.act.mini {
            flex: 0 0 auto;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
        }

        button.act.mini:hover:not(:disabled) {
            color: #fff;
        }

        :focus-visible {
            outline: 1px solid rgba(255, 255, 255, 0.55);
            outline-offset: 2px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%) translateY(8px);
            background: #fff;
            color: #0f0f0f;
            font-size: 10px;
            letter-spacing: 0.08em;
            padding: 8px 14px;
            border-radius: var(--r);
            opacity: 0;
            pointer-events: none;
            transition: 0.18s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* できなかったことは色で分ける。白い箱のままだと、
           成功も失敗も同じ知らせに見える */
        .toast.err {
            background: #ff6a5e;
            color: #1a0705;
        }

        /* まだ1列だが、盤を頭打ちにする理由もない幅。
           420 で止めたままだと、タブレット縦や横持ちで余白が余る */
        @media (min-width: 640px) {
            .app {
                max-width: 560px;
            }
        }

        /* 盤を大きく見たいので、横幅があるときは操作を右に逃がす */
        @media (min-width: 900px) {
            body {
                padding: 28px 24px 40px;
            }

            .app {
                max-width: 940px;
                display: grid;
                grid-template-columns: minmax(0, 1fr) 300px;
                grid-template-rows: auto 1fr;
                column-gap: 28px;
                row-gap: 16px;
                align-items: start;
            }

            header {
                grid-column: 1 / -1;
            }

            /* 貼り付けたまま画面より高くなると、下の OUTPUT に届かなくなる。
               溢れたぶんはパネルの中で送る */
            .panel {
                position: sticky;
                top: 28px;
                max-height: calc(100vh - 56px);
                overflow-y: auto;
                scrollbar-width: thin;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <h1>PEGS2</h1>
            <!-- 中身はスクリプトが入れる。操作の一覧はそちらに置いておく -->
            <span class="hint" id="hint"></span>
        </header>

        <div class="stage" id="stage">
            <canvas id="cv" tabindex="0" aria-label="geoboard"></canvas>
            <div class="empty" id="empty" hidden>TAP A DOT TO PLACE A PEG</div>
            <!-- 選んである杭を動かす。杭のまわりではなく盤の縁に固定する。
                 杭に付けると、盤の端・太い杭・ズームで居場所が壊れる -->
            <div class="pad" id="pad" hidden>
                <button class="nudge up" data-di="0" data-dj="-1" title="move up  (↑)">&#9650;</button>
                <button class="nudge dn" data-di="0" data-dj="1" title="move down  (↓)">&#9660;</button>
                <button class="nudge lf" data-di="-1" data-dj="0" title="move left  (←)">&#9664;</button>
                <button class="nudge rt" data-di="1" data-dj="0" title="move right  (→)">&#9654;</button>
            </div>
        </div>

        <div class="panel">
            <!-- 形を作る操作 -->
            <section class="group">
                <h2>SHAPE</h2>
                <div class="row">
                    <label>BAND</label>
                    <div class="seg chips" id="bandSeg"></div>
                    <button class="act mini" id="btnNewBand" title="wrap a new band on the selected peg">NEW</button>
                    <button class="act mini danger" id="btnDelBand" title="delete the active band">DEL</button>
                </div>
                <!-- 選んである杭に効く操作。長押しやダブルタップの代わり -->
                <div class="row" id="selRow">
                    <label>SELECTED</label>
                    <div class="btns" style="flex:1">
                        <button class="act mini" id="btnDupPeg" style="flex:1" title="copy this peg to a free cell">DUP</button>
                        <button class="act mini danger" id="btnDelPeg" style="flex:1" title="remove this peg  (Delete)">DEL</button>
                    </div>
                </div>
                <div class="row">
                    <label>BASE</label>
                    <input type="range" id="radiusRange" min="0" max="1000" value="218">
                    <span class="value" id="radiusVal">0.44</span>
                </div>
                <div class="row" id="sizeRow">
                    <label>PEG</label>
                    <input type="range" id="sizeRange" min="0" max="1000" value="218">
                    <span class="value" id="sizeVal">--</span>
                    <button class="act mini" id="btnSizeReset" title="reset this peg back to BASE">RST</button>
                </div>
                <div class="row">
                    <label>GRID</label>
                    <select id="colsSel"></select>
                    <span class="times">&times;</span>
                    <select id="rowsSel"></select>
                </div>
                <!-- 当たりは形を変える。VIEW（見え方だけ変わる）ではない -->
                <div class="row">
                    <label>SNAP</label>
                    <div class="seg" id="guideSeg"></div>
                </div>
                <div class="btns">
                    <button class="act" id="btnUndo" title="UNDO  (Ctrl/Cmd Z)">UNDO</button>
                    <button class="act" id="btnRedo" title="REDO  (Shift Ctrl/Cmd Z)">REDO</button>
                    <button class="act danger" id="btnClear">CLEAR</button>
                </div>
            </section>

            <!-- 見え方。形そのものは変わらない -->
            <section class="group">
                <h2>VIEW</h2>
                <div class="row">
                    <label>ZOOM</label>
                    <input type="range" id="zoomRange" min="0" max="1000" value="158">
                    <span class="value" id="zoomVal">1.0×</span>
                    <button class="act mini" id="btnFit" title="FIT  (F)">FIT</button>
                </div>
                <div class="row">
                    <label>MODE</label>
                    <div class="seg" id="viewSeg"></div>
                </div>
                <div class="row" id="combineRow">
                    <label>COMBINE</label>
                    <div class="seg" id="combineSeg"></div>
                </div>
                <div class="row">
                    <label>DISPLAY</label>
                    <div class="seg" id="toggleSeg"></div>
                </div>
            </section>

            <!-- 外へ出す／持ち込む -->
            <section class="group">
                <h2>OUTPUT</h2>
                <div class="btns">
                    <button class="act key" id="btnPng">PNG</button>
                    <button class="act key" id="btnSvg">SVG</button>
                    <button class="act key" id="btnCopy">COPY</button>
                </div>
                <div class="btns">
                    <button class="act mini" id="btnExport" style="flex:1">SAVE .JSON</button>
                    <button class="act mini" id="btnImport" style="flex:1">LOAD .JSON</button>
                </div>
            </section>

            <input type="file" id="fileImport" accept=".json,application/json" hidden>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== モデル =====================================================
        // セル間隔を 1 とする単位系で全部計算する。書き出し時だけ 100 倍する。
        //
        // ジオボード。プレートに杭を打ち、そこへ輪ゴムを張ったもの。
        // 杭は「有る」か「無い」かだけで、種類は無い。
        // 形を決めているのは輪ゴムのほうで、その状態が接点の列。
        //
        // 各杭の IN / OUT は輪ゴムから見た側であって、杭の属性ではない。
        // 張り直すたびに、いまの輪郭から取り直す。輪ゴムは何本でも張れて、
        // 側は輪ゴムごとに持つ。輪ゴム同士は干渉せず、すり抜ける。
        //
        // 杭どうしは絶対に重ならない。これが効いていて、重ならない円は隙間を
        // 囲めないので、押し込みの合間に取り残された島は発生しない。
        //
        // PEGS2 では杭ごとに半径を変えられる。ただし「重ならない」は手放さない。
        // 望みの半径をそのまま使うのではなく、重なるペアを比例縮小して押し込め、
        // その結果を実効半径として使う（relaxRadii）。
        // これで太さの違うストロークが作れて、ソルバの前提は一枚も崩れない。
        const S = 1;
        // 半径はセル間隔に縛られない。上限まで膨らませても、隣が近ければ
        // relaxRadii が勝手に詰めてくれる
        const R_MIN = 0.06, R_MAX = 8.0;
        const TOUCH = 0.985;     // 1.0 ちょうどは杭が接して糸の通り道が消える
        const GRID_MIN = 3, GRID_MAX = 64;

        const IN = 1, OUT = -1;

        let cols = 5, rows = 5;
        let pegs = new Set();    // 杭が打たれているセル "i,j"
        let pegWant = new Map(); // 杭ごとに指定した半径。無ければ radius（既定値）
        let pegEff = new Map();  // 重なりを解いたあとの実効半径。描画も判定もこれを見る
        let selKey = null;       // いま選んである杭。太さのハンドルもここに付く
        // 輪ゴム1本ぶん。contacts が形の状態で、sides は各杭がその輪ゴムの
        // どちら側かの控え。ghosts は抜いた杭が掛かっていた場所
        let bands = [];
        let active = 0;          // 触れるのはこの1本だけ。レイヤーと同じ
        let radius = 0.55;
        let outline = true;      // 輪郭線だけ表示するモード
        let preview = false;     // 編集用の表示を全部消して、書き出しと同じ絵にする
        let invert = false;      // 白黒反転
        // 輪ゴムが重なったときの塗りの決め方。パスファインダーと同じ4つ。
        // 塗り規則と巻き方向だけで出せるので、書き出しも同じ結果になる。
        // 効くのは塗り（SOLID）だけ。LINE は輪ゴムそのものを見るための表示なので、
        // 合成せずに1本ずつ輪郭を描く
        let combine = 'xor';     // 'unite' | 'minus' | 'cross' | 'xor'
        let loops = [];          // 張り直したポリライン（プレビューと書き出しで共用）

        const key = (i, j) => i + ',' + j;
        const hasPeg = k => pegs.has(k);
        const wantOf = k => pegWant.has(k) ? pegWant.get(k) : radius;
        // いま空いている隙間。隣の円に触れるところまでが、この杭の伸びしろ
        function roomFor(k) {
            const a = pegC(k);
            let m = R_MAX;
            for (const o of pegs) {
                if (o === k) continue;
                const b = pegC(o);
                const d = Math.hypot(a[0] - b[0], a[1] - b[1]) * TOUCH - rOf(o);
                if (d < m) m = d;
            }
            return Math.max(R_MIN, m);
        }
        // 太さを決めるのはここだけ。隙間で頭打ちにして記録する。
        // 望みをそのまま覚えると、隣を詰めさせる力がずっと残ってしまう。
        // 触っていない杭が痩せるのも、あとで別の杭をいじった拍子に
        // この杭が跳ね返るのも、元をたどると同じ原因
        const setWant = (k, r) => pegWant.set(k, Math.min(r, roomFor(k)));
        const rOf = k => pegEff.has(k) ? pegEff.get(k) : wantOf(k);

        // 望みの半径から、どの2つも重ならない実効半径を作る。
        // 杭は2種類あって、扱いが違う。
        //
        //   決めた杭（pegWant にある）… ハンドルやつまみで太さを決めたもの。動かさない。
        //     置いたときに setWant が隙間で頭打ちにしているので、そもそも重ならない。
        //   既定の杭 … RADIUS のつまみに従うもの。全員がおなじ太さ。
        //
        // 既定の杭は「揃っている」ことのほうが大事なので、ぶつかった杭だけを
        // 痩せさせない。どれかひとつが隣に触れたら、そこで全員が止まる。
        // つまり実効の太さは、つまみの値と、盤がゆるす上限の小さいほう。
        // 決めた杭は上限を作る側であって、上限に合わせて痩せる側ではない。
        const R_FLOOR = R_MIN * 0.25;
        let radiusEff = Infinity;   // 既定の杭が実際になっている太さ

        // 既定の杭が伸びられる上限。既定どうしは半分ずつ分け合い、
        // 決めた杭には触れるところまで。つまみの値はここに頭打ちされる。
        // 当たりの候補を篩うのにも使うので、relaxRadii と同じ式を共有する
        function defaultRoom(eOf) {
            const D = [], E = [];
            for (const k of pegs) (pegWant.has(k) ? E : D).push(k);
            const gap = (a, b) => {
                const p = pegC(a), q = pegC(b);
                return Math.hypot(p[0] - q[0], p[1] - q[1]) * TOUCH;
            };
            let m = R_MAX;
            for (let i = 0; i < D.length; i++) {
                for (let j = i + 1; j < D.length; j++) m = Math.min(m, gap(D[i], D[j]) / 2);
                for (const e of E) m = Math.min(m, gap(D[i], e) - eOf(e));
            }
            return Math.max(R_FLOOR, m);
        }

        function relaxRadii() {
            const ks = [...pegs];
            const pc = new Map(ks.map(k => [k, pegC(k)]));
            const gap = (a, b) => {
                const p = pc.get(a), q = pc.get(b);
                return Math.hypot(p[0] - q[0], p[1] - q[1]) * TOUCH;
            };
            const D = ks.filter(k => !pegWant.has(k));
            const E = ks.filter(k => pegWant.has(k));

            // 1. 決めた杭どうし。setWant を通っていれば重ならないが、
            //    よそで作ったファイルは何でもありなので、そこだけ均等に詰める
            const r = new Map(E.map(k => [k, pegWant.get(k)]));
            for (let it = 0; it < 40; it++) {
                const f = new Map(E.map(k => [k, 1]));
                let bad = false;
                for (let i = 0; i < E.length; i++)
                    for (let j = i + 1; j < E.length; j++) {
                        const d = gap(E[i], E[j]), sum = r.get(E[i]) + r.get(E[j]);
                        if (sum <= d + 1e-9) continue;
                        const g = d / sum;
                        if (g < f.get(E[i])) f.set(E[i], g);
                        if (g < f.get(E[j])) f.set(E[j], g);
                        bad = true;
                    }
                if (!bad) break;
                for (const k of E) r.set(k, r.get(k) * f.get(k));
            }

            // 2. 既定の杭ぜんぶに効く、たったひとつの太さ
            radiusEff = Math.min(radius, defaultRoom(k => r.get(k)));
            const rho = radiusEff;

            pegEff = new Map();
            for (const k of D) pegEff.set(k, rho);
            for (const k of E) pegEff.set(k, Math.max(R_FLOOR, r.get(k)));

            // 念のため。重ならないことだけは絶対に守る。
            // 隣までの距離の半分は必ず安全なので、破れていたらそこまで落とす
            let ok = true;
            for (let i = 0; i < ks.length && ok; i++)
                for (let j = i + 1; j < ks.length; j++)
                    if (pegEff.get(ks[i]) + pegEff.get(ks[j]) > gap(ks[i], ks[j]) + 1e-9) { ok = false; break; }
            if (!ok)
                for (const k of ks) {
                    let m = Infinity;
                    for (const o of ks) if (o !== k) m = Math.min(m, gap(k, o));
                    pegEff.set(k, Math.max(R_FLOOR, Math.min(pegEff.get(k), m / 2)));
                }
        }
        const cur = () => bands[active] || null;
        const sideIn = (b, k) => b && b.sides.get(k) === IN;

        function newBand(k) {
            const b = { contacts: [], sides: new Map(), ghosts: new Map(), loop: null, owner: [] };
            for (const p of pegs) b.sides.set(p, p === k ? IN : OUT);
            b.contacts = [{ k, s: IN, c: pegC(k), r: rOf(k) }];
            return b;
        }
        // 格子の座標
        const CX = i => i * S;
        const CY = j => j * S;

        // 杭を打つ。輪ゴムには触らない。
        // 置いただけで形に取り込むと、それまでに作った通り道が壊れる。
        // 広げるのは輪ゴムを引っぱる操作のほう
        function addPeg(k) {
            if (pegs.has(k)) return;
            pegs.add(k);
            // 輪ゴムが1本も無いなら、この杭に巻きつけて始める
            if (!bands.length) { bands = [newBand(k)]; active = 0; return; }
            for (const b of bands) {
                const g = b.ghosts.get(k);
                b.ghosts.delete(k);
                b.sides.set(k, b.loop && pointInPoly(pegC(k), b.loop) ? IN : OUT);
                if (!g || !b.contacts) continue;
                const m = b.contacts.length;
                const ip = b.contacts.findIndex(ct => ct.k === g.prev);
                const inx = b.contacts.findIndex(ct => ct.k === g.next);
                // 前後がまだ隣り合っているときだけ差し戻す。
                // 崩れていたら普通に解かせたほうが素直
                if (ip < 0 || inx < 0 || (ip + 1) % m !== inx) continue;
                b.contacts.splice(ip + 1, 0, { k, s: g.s, c: pegC(k), r: rOf(k) });
                b.sides.set(k, g.s);
            }
        }

        // 杭を抜く。輪ゴムが掛かっていた場所を輪ゴムごとに覚えておく。
        // 接点の列を持ち越す以上、抜いた杭をただ戻すだけでは元の位置に入らず、
        // 杭を置いた順序で形が変わってしまう
        function removePeg(k) {
            if (!pegs.has(k)) return;
            for (const b of bands) {
                const i = b.contacts ? b.contacts.findIndex(ct => ct.k === k) : -1;
                if (i >= 0 && b.contacts.length > 1) {
                    const m = b.contacts.length;
                    const prev = b.contacts[(i - 1 + m) % m].k;
                    const next = b.contacts[(i + 1) % m].k;
                    b.ghosts.set(k, { prev, next, s: b.contacts[i].s });
                    // 抜いた接点の跡地。ここは輪ゴムが閉じて掃く辺なので、
                    // 飲み込まれた杭を押し出し直すときの行き先になる。
                    // 次に解いたら使い切る一度きりの手がかり
                    (b.gaps || (b.gaps = [])).push([prev, next]);
                } else b.ghosts.delete(k);
                b.sides.delete(k);
            }
            pegs.delete(k);
            pegWant.delete(k);
            pegEff.delete(k);
            if (selKey === k) selKey = null;
        }

        const setPeg = (k, on) => on ? addPeg(k) : removePeg(k);

        function convexHull(pts) {
            if (pts.length < 3) return pts.slice();
            const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
            const half = src => {
                const h = [];
                for (const q of src) {
                    while (h.length >= 2 && cross(h[h.length - 2], h[h.length - 1], q) <= 0) h.pop();
                    h.push(q);
                }
                h.pop();
                return h;
            };
            const hull = half(p).concat(half(p.slice().reverse()));
            return hull.length ? hull : p.slice(0, 2);
        }

        // 点 (x, y) から線分 p までの距離
        function segDist(x, y, p) {
            const vx = p[2] - p[0], vy = p[3] - p[1];
            const wx = x - p[0], wy = y - p[1];
            const vv = vx * vx + vy * vy;
            let t = vv > 0 ? (wx * vx + wy * vy) / vv : 0;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const dx = wx - t * vx, dy = wy - t * vy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function signedArea(loop) {
            let a = 0;
            for (let i = 0; i < loop.length; i++) {
                const p = loop[i], q = loop[(i + 1) % loop.length];
                a += p[0] * q[1] - q[0] * p[1];
            }
            return a / 2;
        }

        function pointInPoly(p, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const a = poly[j], b = poly[i];
                if ((a[1] > p[1]) !== (b[1] > p[1])
                    && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
            }
            return inside;
        }

        function circlePoly(c, r) {
            const out = [];
            for (let n = 0; n < 72; n++) {
                const a = n / 72 * Math.PI * 2;
                out.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]);
            }
            return out;
        }

        // ===== 輪ゴムを解く ===============================================
        // 杭はすべて障害物。杭の太さは1本ずつ違ってよく、実効半径は
        // relaxRadii が確定させたもの（ここから先は want を見ない）。
        // 輪ゴムは接点の列でできていて、各接点は
        // その杭を内側に抱えている（s=+1）か、外側へ押しのけている（s=-1）か
        // のどちらか。列さえ決まれば、形は共通接線と弧だけで一意に決まる。
        //
        // 解き方：内側の杭ぜんぶを囲む凸包から始めて、
        //   1. 外しても誰にも当たらない接点を外す（張力で外れる）
        //   2. 接線が突っ切っている杭を挿す
        //   3. 側が違う杭（外側のはずが中に入っている等）を挿す
        // が収束するまで回す。1 があるので、常に短いほうの経路に落ちる

        // 2円に、指定した側で接する直線。半径は円ごとに違ってよい。
        // 接点を pa = a.c + a.s*ra*n、pb = b.c + b.s*rb*n と置くと、
        // n が pb-pa と直交する条件が n・(b.c-a.c) = a.s*ra - b.s*rb になる。
        // 半径が等しいときは (a.s-b.s)*r に戻るので、PEGS と同じ形が出る。
        // 半径が違えば接線は傾いて、先細りのストロークになる
        function linkOf(a, b) {
            const dx = b.c[0] - a.c[0], dy = b.c[1] - a.c[1];
            const L = Math.hypot(dx, dy);
            const k = a.s * a.r - b.s * b.r;
            if (L < 1e-9 || Math.abs(k) > L) return null;
            const phi = Math.atan2(dy, dx) - Math.acos(k / L);
            const nx = Math.cos(phi), ny = Math.sin(phi);
            return {
                pa: [a.c[0] + a.s * a.r * nx, a.c[1] + a.s * a.r * ny],
                pb: [b.c[0] + b.s * b.r * nx, b.c[1] + b.s * b.r * ny]
            };
        }

        function arcOf(ct, from, to) {
            const c = ct.c, dir = ct.s;   // 抱えている杭は左回り、押しのけている杭は右回り
            const a0 = Math.atan2(from[1] - c[1], from[0] - c[0]);
            const a1 = Math.atan2(to[1] - c[1], to[0] - c[0]);
            let sweep = (a1 - a0) * dir;
            while (sweep < 0) sweep += Math.PI * 2;
            const steps = Math.max(1, Math.ceil(sweep / (Math.PI / 60)));
            const out = [];
            for (let n = 0; n <= steps; n++) {
                const a = a0 + dir * sweep * n / steps;
                out.push([c[0] + Math.cos(a) * ct.r, c[1] + Math.sin(a) * ct.r]);
            }
            return out;
        }

        let pathOwner = [];   // 輪郭の各点が、どの接点の弧から来たか

        function pathOf(cts) {
            const m = cts.length;
            if (!m) return null;
            if (m === 1) {
                const c = circlePoly(cts[0].c, cts[0].r);
                pathOwner = c.map(() => 0);
                return c;
            }
            const links = [];
            for (let i = 0; i < m; i++) {
                const L = linkOf(cts[i], cts[(i + 1) % m]);
                if (!L) return null;
                links.push(L);
            }
            const out = [];
            pathOwner = [];
            for (let i = 0; i < m; i++) {
                const arc = arcOf(cts[i], links[(i - 1 + m) % m].pb, links[i].pa);
                out.push(...arc);
                for (let n = 0; n < arc.length; n++) pathOwner.push(i);
            }
            return out;
        }

        // 線分 pa-pb が、両端の接点以外の杭に当たっていないか
        const segBuf = [0, 0, 0, 0];
        function blockedBy(pa, pb, pegs, skipA, skipB) {
            segBuf[0] = pa[0]; segBuf[1] = pa[1]; segBuf[2] = pb[0]; segBuf[3] = pb[1];
            // 半径が杭ごとに違うので「いちばん近い」ではなく
            // 「いちばん深く食い込んでいる」で選ぶ
            let hit = -1, worst = -1e-4;
            for (let i = 0; i < pegs.length; i++) {
                if (i === skipA || i === skipB) continue;
                const bite = pegs[i].r - segDist(pegs[i].c[0], pegs[i].c[1], segBuf);
                if (bite > worst) { worst = bite; hit = i; }
            }
            return hit;
        }

        // 直線どうしの交差。弧は杭が重ならない以上ぶつからないので直線だけ見る
        function segCross(p1, p2, p3, p4) {
            const d = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
            const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
            return d1 * d2 < 0 && d3 * d4 < 0;
        }

        function solveBand(band) {
            const ps = [];
            for (const k of pegs) {
                const [i, j] = k.split(',').map(Number);
                ps.push({ c: [CX(i), CY(j)], s: sideIn(band, k) ? IN : OUT, k, r: rOf(k) });
            }
            const inside = ps.filter(p => p.s > 0);
            if (!inside.length) return null;
            // 杭ひとつなら、その杭に巻きついた輪ゴム＝ただの円
            if (inside.length === 1 && ps.length === 1) return [ps[0]];

            // 抱える杭ぜんぶを囲む凸包（左回り）。
            // 中心ではなく円そのものの凸包を採る。半径が違うと、中心は外にあるのに
            // 円は大きい隣に飲まれている杭が出てくる。中心で採るとそれを接点に
            // 選んでしまい、最後の砦にしている「凸包は必ず単純」が崩れる
            const hullSeed = () => {
                const samp = [], own = [];
                for (const p of inside) {
                    const n = ps.indexOf(p);
                    for (let t = 0; t < 24; t++) {
                        const a = t / 24 * Math.PI * 2;
                        samp.push([p.c[0] + Math.cos(a) * p.r, p.c[1] + Math.sin(a) * p.r]);
                        own.push(n);
                    }
                }
                let hull = convexHull(samp);
                if (hull.length > 2 && signedArea(hull) < 0) hull.reverse();
                const seq = [];
                for (const h of hull) {
                    const o = own[samp.indexOf(h)];
                    if (o >= 0 && seq[seq.length - 1] !== o) seq.push(o);
                }
                if (seq.length > 1 && seq[0] === seq[seq.length - 1]) seq.pop();
                return seq.length ? seq : [ps.indexOf(inside[0])];
            };
            // 前回の接点列。毎回ゼロから最短形を探すと、ドラッグで作った経路が
            // 捨てられて別の場所が凹んだ形に化ける。接点の列こそが状態なので、
            // 前回の列から始めて局所的に直すだけにする
            const prevSeed = () => {
                if (!band.contacts || !band.contacts.length) return null;
                const seq = [];
                for (const ct of band.contacts) {
                    const n = ps.findIndex(p => p.k === ct.k);
                    if (n >= 0 && (!seq.length || seq[seq.length - 1] !== n)) seq.push(n);
                }
                if (seq.length > 1 && seq[0] === seq[seq.length - 1]) seq.pop();
                return seq.length ? seq : null;
            };
            let cts = prevSeed() || hullSeed();

            // 抜いた杭の跡地（閉じたばかりの辺）と、そのときの輪郭。
            // 手がかりは一度きりなので、ここで使い切る
            const gaps = band.gaps || [];
            band.gaps = [];
            const wasOutside = c => !band.loop || !pointInPoly(c, band.loop);

            const ctOf = i => ps[i];

            // 接線が杭を突っ切らず、糸どうしも交差していないか。
            // 交差を見ないと、深いスリットを作ったときに二重巻きの線が出る
            function links(list) {
                const cs = list.map(ctOf);
                const out = [];
                for (let i = 0; i < list.length; i++) {
                    const L = linkOf(cs[i], cs[(i + 1) % list.length]);
                    if (!L) return null;
                    out.push(L);
                }
                return out;
            }

            // lax: すでに接点になっている杭に当たるのを見逃す。
            // 挿し直しようがない当たり方なので、最終的に受け入れるかの判断でだけ緩める。
            // 接点を外す判断（張力で外れる）まで緩めると、余計な杭を手放す
            function taut(list, lax) {
                // 同じ杭が2回出てくる列は、同じ円に弧が2つできて交差する。
                // 直線どうしの交差判定では拾えないのでここで弾く
                for (let i = 0; i < list.length; i++)
                    for (let j = i + 1; j < list.length; j++)
                        if (list[i] === list[j]) return false;
                if (list.length < 2) return true;
                const ls = links(list);
                if (!ls) return false;
                for (let i = 0; i < list.length; i++) {
                    const j = (i + 1) % list.length;
                    const hit = blockedBy(ls[i].pa, ls[i].pb, ps, list[i], list[j]);
                    if (hit >= 0 && !(lax && list.indexOf(hit) >= 0)) return false;
                }
                for (let i = 0; i < ls.length; i++)
                    for (let j = i + 2; j < ls.length; j++) {
                        if (i === 0 && j === ls.length - 1) continue;
                        if (segCross(ls[i].pa, ls[i].pb, ls[j].pa, ls[j].pb)) return false;
                    }
                return true;
            }

            // そのうえで、どの杭も指定どおりの側にいること
            function valid(list, lax) {
                if (list.length < 1) return false;
                if (!taut(list, lax)) return false;
                const pts = pathOf(list.map(ctOf));
                if (!pts) return false;
                for (let i = 0; i < ps.length; i++) {
                    if (list.includes(i)) continue;
                    if ((ps[i].s > 0) !== pointInPoly(ps[i].c, pts)) return false;
                }
                return true;
            }

            const solve = () => {
            for (let iter = 0; iter < 300; iter++) {
                let changed = false;

                // 1. 接線が突っ切っている杭を挿す
                for (let i = 0; i < cts.length && !changed; i++) {
                    const j = (i + 1) % cts.length;
                    if (cts.length < 2) break;
                    const L = linkOf(ctOf(cts[i]), ctOf(cts[j]));
                    if (!L) continue;
                    const hit = blockedBy(L.pa, L.pb, ps, cts[i], cts[j]);
                    if (hit < 0) continue;
                    // すでに接点になっている杭は挿さない。挿すと同じ円に弧が2つできる。
                    // ここで詰まったら列が破綻しているので、凸包からやり直させる
                    if (cts.indexOf(hit) >= 0) continue;
                    cts.splice(i + 1, 0, hit);
                    changed = true;
                }
                if (changed) continue;

                // 2. 側が違う杭を、いちばん伸びの小さい辺に挿す
                const pts = pathOf(cts.map(ctOf));
                if (!pts) break;
                const pending = [];
                for (let i = 0; i < ps.length && !changed; i++) {
                    if (cts.includes(i)) continue;
                    if ((ps[i].s > 0) === pointInPoly(ps[i].c, pts)) continue;
                    // いちばん近い辺に挿す。伸びの少なさで選ぶと、深く入り込んだ杭が
                    // 遠くの辺に繋がって糸が絡まる。近い辺から順に入れていけば、
                    // 何本もの杭が同じスリットに素直に並ぶ
                    // 外にいた杭が内側に入ってしまったのは、隙間が閉じて
                    // 掃かれたから。そのときは跡地の辺へ戻すのが素直で、
                    // 距離だけで選ぶと遠くの辺に深いスリットが生える
                    const swept = gaps.length > 0 && wasOutside(ps[i].c);
                    const cand = [];
                    for (let e = 0; e < cts.length; e++) {
                        const a = ctOf(cts[e]), b = ctOf(cts[(e + 1) % cts.length]);
                        const L1 = linkOf(a, ps[i]), L2 = linkOf(ps[i], b);
                        if (!L1 || !L2) continue;
                        const L0 = cts.length > 1 ? linkOf(a, b) : null;
                        const near = L0
                            ? segDist(ps[i].c[0], ps[i].c[1],
                                [L0.pa[0], L0.pa[1], L0.pb[0], L0.pb[1]])
                            : 0;
                        const gap = swept && gaps.some(g =>
                            (g[0] === a.k && g[1] === b.k) || (g[0] === b.k && g[1] === a.k));
                        cand.push({ at: e, add: near, gap });
                    }
                    cand.sort((x, y) => x.gap === y.gap ? x.add - y.add : (x.gap ? -1 : 1));
                    // 近い順に見て、糸が交差しない位置に入れる。
                    // どこに入れても交差するなら、この杭は後回しにする。
                    // 先に別の杭が入って形が変われば、素直に入る場所ができる
                    let at = -1;
                    for (const c of cand) {
                        const trial = cts.slice(0, c.at + 1).concat([i], cts.slice(c.at + 1));
                        if (taut(trial)) { at = c.at; break; }
                    }
                    if (at < 0) { pending.push(i); continue; }
                    cts.splice(at + 1, 0, i);
                    changed = true;
                }
                // 全部が後回しになったら、いちばん近い場所に押し込んで先へ進める
                if (!changed && pending.length) {
                    const i = pending[0];
                    let at = 0, best = Infinity;
                    for (let e = 0; e < cts.length; e++) {
                        const a = ctOf(cts[e]), b = ctOf(cts[(e + 1) % cts.length]);
                        const L0 = cts.length > 1 ? linkOf(a, b) : null;
                        if (!L0) continue;
                        const d = segDist(ps[i].c[0], ps[i].c[1],
                            [L0.pa[0], L0.pa[1], L0.pb[0], L0.pb[1]]);
                        if (d < best) { best = d; at = e; }
                    }
                    cts.splice(at + 1, 0, i);
                    changed = true;
                }
                if (changed) continue;

                // 3. 外しても条件を満たす接点は、張力で外れる
                for (let i = 0; i < cts.length; i++) {
                    const trial = cts.slice(0, i).concat(cts.slice(i + 1));
                    if (!trial.length || !valid(trial)) continue;
                    cts = trial;
                    changed = true;
                    break;
                }
                if (!changed) break;
            }
            };
            // 輪郭が自分と交差していないか。
            // 二重に巻いた列は、側の判定（内外）をすり抜けてしまう
            const simple = list => {
                const pts = pathOf(list.map(ctOf));
                if (!pts) return false;
                const n = pts.length;
                for (let i = 0; i < n; i++)
                    for (let j = i + 2; j < n; j++) {
                        if (i === 0 && j === n - 1) continue;
                        if (segCross(pts[i], pts[(i + 1) % n], pts[j], pts[(j + 1) % n])) return false;
                    }
                return true;
            };
            // 受け入れの判断だけ緩める。挿し直せない当たり方で弾いて凸包へ落ちると、
            // 遠くの無関係な形まで作り直しになる。糸が杭を少し掠めるほうがまし
            const clean = list => valid(list, true) && simple(list);
            solve();
            // 解けなかったときは、直し方の候補をいくつか作って選ぶ。
            //   1. 凸包からやり直す
            //   2. 接点の側を1つずつ裏返して解き直す
            //      （杭が抜けて縮むと、押しのけていた杭を逆に抱え込むことがある。
            //        側は固定の制約ではない）
            // 選ぶ基準は「直前の接点をいちばん多く残すこと」。
            // 先に成立したものを採ると、余計な杭を手放した形を掴んでしまう
            if (!clean(cts)) {
                const seed0 = cts.slice();
                // 残り具合は「どの接点が居るか」ではなく「どの順に繋がっているか」で測る。
                // 集合で数えると、並びが裏返って形が別物になった候補が満点を取る
                const prevAdj = new Set();
                for (let i = 0; i < seed0.length; i++)
                    prevAdj.add(ps[seed0[i]].k + '>' + ps[seed0[(i + 1) % seed0.length]].k);
                const keeps = list => {
                    let n = 0;
                    for (let i = 0; i < list.length; i++)
                        if (prevAdj.has(ps[list[i]].k + '>' + ps[list[(i + 1) % list.length]].k)) n++;
                    return n;
                };
                let best = null, bestScore = -Infinity, bestFlip = null;
                const consider = (list, flip) => {
                    if (!clean(list)) return;
                    // 側を裏返した形は、同点なら選ばない
                    const sc = keeps(list) - (flip === null ? 0 : 0.5);
                    if (sc > bestScore) { bestScore = sc; best = list.slice(); bestFlip = flip; }
                };
                cts = hullSeed(); solve();
                consider(cts, null);
                for (const i of seed0) {
                    ps[i].s = -ps[i].s;
                    cts = seed0.slice(); solve();
                    consider(cts, i);
                    ps[i].s = -ps[i].s;
                }
                if (best) {
                    if (bestFlip !== null) ps[bestFlip].s = -ps[bestFlip].s;
                    cts = best;
                } else {
                    cts = hullSeed(); solve();
                }
            }
            // それでも交差する形になったら、挿し込み無しの生の凸包まで戻す。
            // 重ならない円の凸包は必ず単純な形になるので、ここを最後の砦にして、
            // 自己交差した輪郭を絶対に画面へ出さない（OFF 杭の押し込みは諦める）
            if (!simple(cts)) cts = hullSeed();
            return cts.map(i => ps[i]);
        }

        function rebuild() {
            // 形を解く前に実効半径を確定させる。ここから先は誰も want を見ない
            relaxRadii();
            for (let n = bands.length - 1; n >= 0; n--) {
                const b = bands[n];
                b.contacts = solveBand(b);
                const outer = b.contacts && pathOf(b.contacts);
                // 抱える杭がひとつも無くなった輪ゴムは、張る先が無いので消える
                if (!outer) { bands.splice(n, 1); continue; }
                b.loop = outer;
                b.owner = pathOwner.slice();
                // 側は輪ゴムの状態。張り直した結果から取り直して、実物とずらさない
                const on = new Map(b.contacts.map(ct => [ct.k, ct.s]));
                for (const k of pegs)
                    b.sides.set(k, on.has(k) ? on.get(k) : (pointInPoly(pegC(k), outer) ? IN : OUT));
            }
            if (active >= bands.length) active = bands.length - 1;
            if (active < 0) active = 0;
            loops = bands.map(b => b.loop);
            refreshRadiusVal();
            refreshBands();
        }

        // ===== 描画 =========================================================
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const stageEl = document.getElementById('stage');
        const emptyEl = document.getElementById('empty');

        // 書き出しの枠。グリッド外形＋余白 0.8 セル。
        // 盤がどれだけ広くても、SVG と PNG はいつもこの枠で出る
        function frame() {
            const pad = 0.8;
            const w = (cols - 1) * S + pad * 2;
            const h = (rows - 1) * S + pad * 2;
            const side = Math.max(w, h);
            return { x: -pad - (side - w) / 2, y: -pad - (side - h) / 2, size: side };
        }

        // 画面に映している窓。枠から切り離してあるので、盤を広げても
        // 杭が潰れない。書き出しはここを一切見ない
        const Z_MIN = 0.5, Z_MAX = 40;
        let zoom = 1, panX = 0, panY = 0;

        function view() {
            const f = frame();
            const size = f.size / zoom;
            const cx = f.x + f.size / 2 + panX, cy = f.y + f.size / 2 + panY;
            return { x: cx - size / 2, y: cy - size / 2, size };
        }

        function clampPan() {
            const lim = frame().size * 0.6;
            panX = Math.max(-lim, Math.min(lim, panX));
            panY = Math.max(-lim, Math.min(lim, panY));
        }

        // w（世界座標）を画面の同じ場所に残したまま倍率を変える。
        // view は pan について線形なので、ずれたぶんを足し戻せば厳密に合う
        function zoomAt(w, nz) {
            const a = view();
            const fx = (w.x - a.x) / a.size, fy = (w.y - a.y) / a.size;
            zoom = Math.max(Z_MIN, Math.min(Z_MAX, nz));
            const b = view();
            panX += w.x - (b.x + fx * b.size);
            panY += w.y - (b.y + fy * b.size);
            clampPan();
        }

        // 画面 1px ぶんの世界座標。当たり判定の広さをここで揃える。
        // ドラッグ中は掴んだ瞬間の窓で測る（途中で倍率が動いても的がずれない）
        function worldPerPx() {
            const rect = dragging && dragRect ? dragRect : cv.getBoundingClientRect();
            const vb = dragging && dragVB ? dragVB : view();
            return vb.size / (rect.width || 1);
        }
        // セル基準と画面基準の小さいほう。
        // 引くと隣の杭を巻き込まず、寄ると指で押せる大きさで頭打ちになる
        const tol = (cells, px) => Math.min(cells * S, px * worldPerPx());

        function polyPath(pts, scale, ox, oy) {
            const p = new Path2D();
            p.moveTo(ox + pts[0][0] * scale, oy + pts[0][1] * scale);
            for (let i = 1; i < pts.length; i++) p.lineTo(ox + pts[i][0] * scale, oy + pts[i][1] * scale);
            p.closePath();
            return p;
        }

        // 引っぱっている最中は、アクティブな輪ゴムだけ伸ばした形に差し替える
        // いま見えている輪郭。引っぱっている最中はアクティブなぶんを伸ばした形に差し替える
        function shownLoops(stretched) {
            return loops.map((l, n) => (stretched && n === active) ? stretched : l);
        }

        function addLoop(p, l, scale, ox, oy, flip) {
            const n = l.length;
            for (let i = 0; i < n; i++) {
                const q = l[flip ? n - 1 - i : i];
                if (i === 0) p.moveTo(ox + q[0] * scale, oy + q[1] * scale);
                else p.lineTo(ox + q[0] * scale, oy + q[1] * scale);
            }
            p.closePath();
        }

        function pathFromLoops(scale, ox, oy, stretched) {
            const p = new Path2D();
            for (const l of shownLoops(stretched)) addLoop(p, l, scale, ox, oy, false);
            return p;
        }

        // UNITE は巻き方向を揃えれば nonzero がそのまま合成になる
        function unitePath(ls, scale, ox, oy) {
            const p = new Path2D();
            const ref = signedArea(ls[0]) >= 0 ? 1 : -1;
            for (const l of ls) {
                const sign = signedArea(l) >= 0 ? 1 : -1;
                addLoop(p, l, scale, ox, oy, ref !== sign);
            }
            return p;
        }

        // 塗りつぶし。
        // CROSS は重ねてクリップ、MINUS は「その形の外側」へクリップしてから塗る。
        // MINUS を巻き方向でやると、はみ出した部分が nonzero で塗られてしまう
        // g と枠の大きさを受け取る。画面と PNG 書き出しで同じ処理を通すため
        function fillShape(g, scale, ox, oy, stretched, w, h) {
            const ls = shownLoops(stretched);
            if (!ls.length) return;
            if (combine === 'xor' || ls.length === 1) {
                g.fill(pathFromLoops(scale, ox, oy, stretched), 'evenodd');
                return;
            }
            if (combine === 'unite') {
                g.fill(unitePath(ls, scale, ox, oy), 'nonzero');
                return;
            }
            g.save();
            if (combine === 'cross') {
                for (const l of ls) {
                    const p = new Path2D();
                    addLoop(p, l, scale, ox, oy, false);
                    g.clip(p);
                }
                g.fillRect(0, 0, w, h);
            } else {   // minus: BAND 1 から他を抜く
                for (let n = 1; n < ls.length; n++) {
                    const p = new Path2D();
                    p.rect(0, 0, w, h);
                    addLoop(p, ls[n], scale, ox, oy, false);
                    g.clip(p, 'evenodd');   // 矩形＋形 の evenodd ＝ 形の外側
                }
                const p0 = new Path2D();
                addLoop(p0, ls[0], scale, ox, oy, false);
                g.fill(p0);
            }
            g.restore();
        }

        function draw() {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const rect = cv.getBoundingClientRect();
            cv.width = Math.round(rect.width * dpr);
            cv.height = Math.round(rect.height * dpr);
            const vb = view();
            const scale = cv.width / vb.size;
            const ox = -vb.x * scale, oy = -vb.y * scale;

            // 反転すると盤の地が黒くなる。地の色に溶けないよう縁を出す
            stageEl.classList.toggle('inv', invert);
            // 最初のひと突きまでは、何をすればいいかを盤の中で言う
            emptyEl.hidden = pegs.size > 0 || preview;

            // 白黒反転。編集用の表示もまとめて入れ替える
            const C = invert ? {
                paper: '#000', ink: '#fff',
                peg: '#262626', off: '#050505', offLine: '#303030',
                solidOff: '#141414', solidOffLine: '#242424',
                pegSet: '#3b3b3b', offSet: '#111', solidOffSet: '#242424',
                onDot: 'rgba(0,0,0,0.3)', dot: 'rgba(255,255,255,0.28)', ring: 'rgba(255,255,255,0.4)',
                dim: 'rgba(255,255,255,0.32)'
            } : {
                paper: '#fff', ink: '#000',
                peg: '#e6e6e6', off: '#fafafa', offLine: '#cfcfcf',
                solidOff: '#efefef', solidOffLine: '#e0e0e0',
                pegSet: '#d2d2d2', offSet: '#f1f1f1', solidOffSet: '#e1e1e1',
                onDot: 'rgba(255,255,255,0.24)', dot: 'rgba(0,0,0,0.2)', ring: 'rgba(0,0,0,0.28)',
                dim: 'rgba(0,0,0,0.28)'
            };
            // 自分で太さを決めた杭の印。縁のすこし内側にヘアラインを1本。
            // 内外は塗りと破線で見せているので、そこには触らずに済む。
            // 塗りもひと段だけ濃くしてあるが、押しのけている杭は塗りが
            // もともと背景に近いので、それだけでは読めない
            const markSet = (cx, cy, r, on) => {
                if (!on) return;
                const ir = Math.min(r - 1.5 * dpr, r * 0.78);
                if (ir < 2 * dpr) return;
                ctx.strokeStyle = C.dim;
                ctx.lineWidth = Math.max(1, dpr);
                ctx.beginPath();
                ctx.arc(cx, cy, ir, 0, Math.PI * 2);
                ctx.stroke();
            };

            // 杭の内外は、いま触れる輪ゴムから見たもの
            const A = cur();
            ctx.fillStyle = C.paper;
            ctx.fillRect(0, 0, cv.width, cv.height);

            // ドラッグ中は、張り直したあとの形ではなく、いま指で伸ばしている形を出す。
            // 張り直した形だけを見せると、掴んだ辺が指について来ないので
            // 別の辺が動いたように見える
            const stretched = (dragging && restPath && dragPos)
                ? [[dragPos.x, dragPos.y]].concat(restPath) : null;

            if (outline) {
                // 糸がどの円に張られているかを見るモード。
                // 円を実寸で見せて、輪郭は線だけにする
                for (const k of (preview ? [] : pegs)) {
                    const [i, j] = k.split(',').map(Number);
                    const cx = ox + CX(i) * scale, cy = oy + CY(j) * scale, rr = rOf(k) * scale;
                    ctx.beginPath();
                    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
                    const set = pegWant.has(k);
                    if (sideIn(A, k)) {
                        ctx.fillStyle = set ? C.pegSet : C.peg;
                        ctx.fill();
                    } else {
                        // 内側から押している円は塗らずに破線で
                        ctx.fillStyle = set ? C.offSet : C.off;
                        ctx.fill();
                        ctx.strokeStyle = C.offLine;
                        ctx.lineWidth = Math.max(1, dpr);
                        ctx.setLineDash([4 * dpr, 3 * dpr]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    markSet(cx, cy, rr, set);
                }
                // アクティブでない輪ゴムは薄く。どれを触っているか迷わせない
                ctx.lineWidth = 1.6 * dpr;
                for (let n = 0; n < loops.length; n++) {
                    const l = (stretched && n === active) ? stretched : loops[n];
                    ctx.strokeStyle = (preview || n === active) ? C.ink : C.dim;
                    ctx.stroke(polyPath(l, scale, ox, oy));
                }
            } else {
                // 外側の杭は実寸で下敷きに描く。輪ゴムが当たる円が見える
                ctx.strokeStyle = C.solidOffLine;
                ctx.lineWidth = Math.max(1, dpr);
                for (const k of (preview ? [] : pegs)) {
                    if (sideIn(A, k)) continue;
                    const [i, j] = k.split(',').map(Number);
                    ctx.beginPath();
                    ctx.arc(ox + CX(i) * scale, oy + CY(j) * scale, rOf(k) * scale, 0, Math.PI * 2);
                    const set = pegWant.has(k);
                    ctx.fillStyle = set ? C.solidOffSet : C.solidOff;
                    ctx.fill();
                    ctx.stroke();
                    markSet(ox + CX(i) * scale, oy + CY(j) * scale, rOf(k) * scale, set);
                    ctx.strokeStyle = C.solidOffLine;
                }
                ctx.fillStyle = C.ink;
                fillShape(ctx, scale, ox, oy, stretched, cv.width, cv.height);
            }

            // 当たった辺を画面いっぱいに伸ばして見せる。
            // 相手の辺（平行の基準）も一緒に出さないと、何に合ったのか分からない
            for (const g of guides) {
                const ux = g.b[0] - g.a[0], uy = g.b[1] - g.a[1];
                const len = Math.hypot(ux, uy);
                if (len < 1e-9) continue;
                const ex = ux / len * vb.size * 2, ey = uy / len * vb.size * 2;
                ctx.strokeStyle = g.ref ? 'rgba(220,60,60,0.34)' : 'rgba(220,60,60,0.75)';
                ctx.lineWidth = Math.max(1, dpr);
                ctx.setLineDash(g.ref ? [5 * dpr, 4 * dpr] : []);
                ctx.beginPath();
                ctx.moveTo(ox + (g.a[0] - ex) * scale, oy + (g.a[1] - ey) * scale);
                ctx.lineTo(ox + (g.b[0] + ex) * scale, oy + (g.b[1] + ey) * scale);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 掴んでいる点
            if (dragging && dragPos && !preview) {
                ctx.fillStyle = 'rgba(220,60,60,0.9)';
                ctx.beginPath();
                ctx.arc(ox + dragPos.x * scale, oy + dragPos.y * scale, 4 * dpr, 0, Math.PI * 2);
                ctx.fill();
            }

            // 望みの半径まで膨らめなかった杭は、望みのほうを点線で見せる。
            // 縮んだのが盤のせいだと分かれば、杭をずらすか隣を細くすればいい。
            // いま手を掛けている杭だけ。全部に出すと、BASE を上限まで
            // 回しただけで盤が点線だらけになる
            if (!preview && selKey && pegs.has(selKey)) {
                const w = wantOf(selKey);
                if (w - rOf(selKey) >= 1e-3) {
                    const [i, j] = selKey.split(',').map(Number);
                    ctx.strokeStyle = C.dim;
                    ctx.lineWidth = Math.max(1, dpr);
                    ctx.setLineDash([3 * dpr, 3 * dpr]);
                    ctx.beginPath();
                    ctx.arc(ox + CX(i) * scale, oy + CY(j) * scale, w * scale, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // 選んである杭。ここに矢印と DUP / DEL が効く
            if (!preview && selKey && pegs.has(selKey)) {
                const [i, j] = selKey.split(',').map(Number);
                ctx.strokeStyle = 'rgba(220,60,60,0.9)';
                ctx.lineWidth = 2 * dpr;
                ctx.beginPath();
                ctx.arc(ox + CX(i) * scale, oy + CY(j) * scale, rOf(selKey) * scale, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 格子が見えないと編集しづらいので、シルエットの上に印を置く。
            // 盤が広いと大半は窓の外なので、映っている範囲だけ回す
            const i0 = Math.max(0, Math.floor(vb.x / S)), i1 = Math.min(cols - 1, Math.ceil((vb.x + vb.size) / S));
            const j0 = Math.max(0, Math.floor(vb.y / S)), j1 = Math.min(rows - 1, Math.ceil((vb.y + vb.size) / S));
            // 目が詰まりすぎたら格子は出さない。点だらけで形が見えなくなる
            const dense = S * scale < 5 * dpr;
            // 印の大きさは画面基準の固定値。ズームで変わらない。
            // 空セルはほとんどが「ただの目盛り」なので、いちばん小さくする。
            // 杭が立っているところだけ、探せる大きさを残す
            for (let j = j0; !preview && !dense && j <= j1; j++) {
                for (let i = i0; i <= i1; i++) {
                    const k = key(i, j);
                    const on = hasPeg(k), inside = on && sideIn(A, k);
                    const cx = ox + CX(i) * scale, cy = oy + CY(j) * scale;
                    ctx.beginPath();
                    if (on && !inside) {
                        // 輪ゴムの外に立っている杭だけリング。ひと目で区別がつく
                        ctx.strokeStyle = C.ring;
                        ctx.lineWidth = Math.max(1, dpr);
                        ctx.arc(cx, cy, 3 * dpr, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = inside
                            ? (outline ? C.ring : C.onDot)
                            : C.dot;
                        ctx.arc(cx, cy, (on ? 2.1 : 1.2) * dpr, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

        }


        function update() { rebuild(); draw(); save(); }

        // ===== 入力 =========================================================
        // タップ：杭を打つ／抜く。1タップ1本。指を滑らせたぶんは効かない
        // 輪ゴムを掴んでドラッグ：跨いだ杭の内外が入れ替わる
        //   （＝輪ゴムをその杭の向こう側へ引っ掛ける／外す）
        // 的の広さは「セルの何割」と「画面の何 px」の小さいほう（tol）。
        // 盤を広げるとセルは小さくなるので、セル基準だけだと隣まで拾ってしまい、
        // px 基準だけだと引いたときに狙った杭を選べない
        const HOLD = () => tol(0.34, 22);
        const GRAB = () => tol(0.30, 20);
        // ここまで動いたら「滑らせた」。タップと引っぱりの境目で、
        // 長押しを諦める距離でもある
        const STILL = () => tol(0.20, 14);
        // 角の的の広さ。弧が短くても、杭に巻きついているところは
        // このぶんだけ掴めるようにする
        const CORNER = () => tol(0.20, 14);
        let dragging = false, startPos = null, dragPos = null;
        // 杭と輪ゴムが重なっている場所で押されたとき、どちらの操作か決めずに
        // 持っておく。離せば杭、動かせば輪ゴム
        let pendingGrab = null;
        // ドラッグ中に途中でスクロールバーが出るなどしてキャンバスの表示サイズが
        // 変わると、指の位置から世界座標への換算が掴んだ瞬間とズレて、
        // 輪ゴムが思わぬ形に化ける。ドラッグ中はこの換算を固定する
        let dragRect = null, dragVB = null;
        let anchorA = null, anchorB = null, anchorKeys = null, origState = null;
        let tapKey = null;        // 押した杭。指が動かずに離れたときだけ効く
        let guideOn = true;    // 太さを合わせるときの当たり（水平・垂直・平行）
        let guides = [];       // いま効いているガイド線
        // 指2本のあいだは盤に触らせない。掴みかけの操作はここで捨てる
        const pts = new Map();       // pointerId -> クライアント座標
        let gesture = null;
        let hushUntilUp = false;     // ジェスチャの残り指でタップが起きないように
        let panning = null;          // 中ボタンでのパン
        let origSpan = null;   // 掴んだときの、留め具から留め具までの輪郭
        let restPath = null;   // 掴んでいない側の輪郭。ここは動かない
        let restSeq = null;    // 掴んでいない側の接点列。掃いた杭はこの後ろに入る
        // restPath の両端が、掴んだ辺が留め具から離れる接点そのものなので、
        // 伸ばした輪ゴムは「ポインタ＋動いていない側」で作れる

        function toWorld(ev) {
            const rect = dragging && dragRect ? dragRect : cv.getBoundingClientRect();
            const vb = dragging && dragVB ? dragVB : view();
            const scale = rect.width / vb.size;
            return { x: (ev.clientX - rect.left) / scale + vb.x, y: (ev.clientY - rect.top) / scale + vb.y };
        }

        function pickCell(x, y) {
            const i = Math.round(x / S), j = Math.round(y / S);
            if (i < 0 || j < 0 || i >= cols || j >= rows) return null;
            if (Math.hypot(x - CX(i), y - CY(j)) > HOLD()) return null;
            return key(i, j);
        }

        const pegC = k => { const [i, j] = k.split(',').map(Number); return [CX(i), CY(j)]; };

        // 輪ゴムまでの距離
        // 掴めるのはアクティブな1本だけ。重なっていても迷わない
        function bandDist(x, y) {
            const band = cur();
            if (!band || !band.loop) return Infinity;
            const e = [0, 0, 0, 0];
            let d = Infinity;
            for (const loop of [band.loop])
                for (let i = 0, j = loop.length - 1; i < loop.length; j = i++) {
                    e[0] = loop[j][0]; e[1] = loop[j][1]; e[2] = loop[i][0]; e[3] = loop[i][1];
                    const dd = segDist(x, y, e);
                    if (dd < d) d = dd;
                }
            return d;
        }

        // 掴んだ辺の両端の杭を留め具にする。ここが動かないので、
        // どれだけ深く引いても操作の対象が別の辺に乗り移らない
        function grabAnchors(x, y) {
            const band = cur();
            const loop = band && band.loop;
            const contacts = band && band.contacts;
            const owner = band ? band.owner : [];
            if (!loop || !contacts || !owner.length) return false;
            // いちばん近い「線分」を探す。頂点で探すと、直線の辺には頂点が無いので
            // 隣の杭の弧の始点が選ばれ、その辺ではなく弧を掴んだ扱いになる
            let n = 0, bd = Infinity;
            const e = [0, 0, 0, 0];
            for (let i = 0; i < loop.length; i++) {
                const j = (i + 1) % loop.length;
                e[0] = loop[i][0]; e[1] = loop[i][1]; e[2] = loop[j][0]; e[3] = loop[j][1];
                const d = segDist(x, y, e);
                if (d < bd) { bd = d; n = i; }
            }
            const m = contacts.length;
            // 角（杭に巻きついているところ）は、これだと弧の長さぶんしか的が無い。
            // 杭に点で接しているような角は数ピクセルの弧しか持たず、
            // 必ず隣の長い直線に負けて、狙っても辺を掴んでしまう。
            // 角には弧の長さと関係なく一定の広さを持たせて、そこに入ったら角を採る。
            // 円1本（接点ひとつ）は輪郭ぜんぶが同じ弧なので、この規則から外す
            if (m > 1) {
                let cn = -1, cd = CORNER();
                for (let i = 0, a = 0; i < loop.length; i++) {
                    const j = (i + 1) % loop.length;
                    if (owner[i] === owner[j]) continue;
                    // a..i が接点 owner[i] の弧。その真ん中を角の的にする
                    const mid = (a + i) >> 1;
                    const d = Math.hypot(x - loop[mid][0], y - loop[mid][1]);
                    if (d < cd) { cd = d; cn = mid < i ? mid : a; }
                    a = j;
                }
                if (cn >= 0) n = cn;
            }
            const o = owner[n], o2 = owner[(n + 1) % loop.length];
            // 直線を掴んだなら両端の接点、弧を掴んだならその前後の接点を留める
            const ia = o === o2 ? (o - 1 + m) % m : o;
            const ib = o === o2 ? (o + 1) % m : o2;
            anchorA = contacts[ia].c;
            anchorB = contacts[ib].c;
            anchorKeys = [contacts[ia].k, contacts[ib].k];
            // 掴んでいない側の接点列。ib から ia まで（掴んだ辺の外側）
            restSeq = [];
            for (let i = ib; ; i = (i + 1) % m) {
                restSeq.push({ k: contacts[i].k, s: contacts[i].s });
                if (i === ia) break;
            }
            // 留め具から留め具までの、元の輪郭をそのまま取っておく。
            // 掃いた範囲はこれと V のあいだで測る。留め具を結ぶ直線で測ると、
            // 外へ張り出している杭を内側へ押し出せない
            let sa = -1, sb = -1;
            if (m === 1) {
                // 杭ひとつ＝ただの円。留め具が同じ杭なので、掴んだ点のところで
                // 円を切って、そこから一周を「動かさない側」にする。
                // 円のどこを掴んでも、その場所から伸びる
                sa = n; sb = (n + 1) % loop.length;
            } else {
                for (let i = 0; i < loop.length; i++) if (owner[i] === ia) sa = i;
                for (let i = 0; i < loop.length; i++) if (owner[i] === ib) { sb = i; break; }
            }
            origSpan = [anchorA];
            restPath = [];
            if (sa >= 0 && sb >= 0) {
                for (let i = (sa + 1) % loop.length; i !== sb; i = (i + 1) % loop.length)
                    origSpan.push(loop[i]);
                for (let i = sb; i !== sa; i = (i + 1) % loop.length) restPath.push(loop[i]);
                restPath.push(loop[sa]);
            }
            origSpan.push(anchorB);
            return restPath.length > 1;
        }

        // 引っぱったあとの輪ゴム全体（動かしていない部分＋V）を作って、
        // 各杭がその内側かどうかで決める。
        // 掴んだ辺と V だけで囲むと、遠くまで引いたときに V の脚が図形の
        // 反対側を横切って、無関係な杭まで巻き込む
        function applyDrag(pos) {
            const moved = [[pos.x, pos.y]].concat(restPath);
            // 接点がひとつ＝ただの円。伸ばした輪ゴムは行きと帰りが重なった
            // 針になっていて、面積が無いので内外では拾えない。
            // 杭の中心から指までの線が掠めた杭を、引っ掛けたものとして扱う
            const needle = restSeq.length === 1
                ? [anchorA[0], anchorA[1], pos.x, pos.y] : null;
            const band = cur();
            let any = false;
            const next = new Map();
            for (const k of pegs) {
                const [i, j] = k.split(',').map(Number);
                const hooked = needle
                    ? segDist(CX(i), CY(j), needle) < rOf(k)
                    : pointInPoly([CX(i), CY(j)], moved);
                const nv = anchorKeys.includes(k) ? (sideIn(band, k) ? IN : OUT)
                                                  : (hooked ? IN : OUT);
                next.set(k, nv);
                if (nv === IN) any = true;
            }
            if (!any) return false;                       // 抱える杭が無くなると張れない
            let changed = false;
            for (const [k, v] of next)
                if ((sideIn(band, k) ? IN : OUT) !== v) { band.sides.set(k, v); changed = true; }
            if (!changed) return false;
            // 掃いた杭を、掴んだ辺の位置に順番どおり差し込む。
            // これを伝えないと、ソルバが別の辺に掛けてしまう
            const swept = [];
            for (const [k, v] of next) {
                if (v === origState.get(k)) continue;
                if (anchorKeys.indexOf(k) >= 0) continue;
                const c = pegC(k);
                swept.push({ k, s: v, t: alongDrag(c, pos) });
            }
            swept.sort((a, b) => a.t - b.t);
            band.contacts = restSeq.concat(swept.map(x => ({ k: x.k, s: x.s, c: pegC(x.k), r: rOf(x.k) })));
            return true;
        }

        // 掴んだ辺の始点からポインタを経て終点までの、どのあたりを通ったか
        function alongDrag(c, pos) {
            const a = restPath[restPath.length - 1], b = restPath[0], p = [pos.x, pos.y];
            const l1 = Math.hypot(p[0] - a[0], p[1] - a[1]);
            const d1 = segDist(c[0], c[1], [a[0], a[1], p[0], p[1]]);
            const d2 = segDist(c[0], c[1], [p[0], p[1], b[0], b[1]]);
            if (d1 <= d2) {
                const t = ((c[0] - a[0]) * (p[0] - a[0]) + (c[1] - a[1]) * (p[1] - a[1])) / (l1 * l1 || 1);
                return Math.max(0, Math.min(1, t));
            }
            const l2 = Math.hypot(b[0] - p[0], b[1] - p[1]);
            const t = ((c[0] - p[0]) * (b[0] - p[0]) + (c[1] - p[1]) * (b[1] - p[1])) / (l2 * l2 || 1);
            return 1 + Math.max(0, Math.min(1, t));
        }

        // 掴みかけ・掴んだ最中のものを全部たたむ。指が2本になった瞬間に呼ぶ
        function cancelTouch() {
            if (dragging && origState && cur()) cur().sides = new Map(origState);
            const was = dragging;
            tapKey = null; pendingGrab = null; dragging = false; origState = null;
            guides = [];
            origSpan = restPath = restSeq = null; dragRect = dragVB = null;
            startPos = dragPos = null;
            if (was) update();
        }

        function startGesture() {
            const [a, b] = [...pts.values()];
            gesture = {
                rect: cv.getBoundingClientRect(),
                d0: Math.hypot(a.x - b.x, a.y - b.y),
                c0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
                z0: zoom, px0: panX, py0: panY, vb0: view()
            };
        }

        // 2本指。開始時に重心の下にあった世界座標を、いまの重心へ連れていく。
        // 開いた率がそのまま倍率。つまむのと動かすのが一度に決まる
        function applyGesture() {
            const [a, b] = [...pts.values()];
            const g = gesture;
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            const c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
            const s0 = g.vb0.size / g.rect.width;
            const w0 = { x: (g.c0.x - g.rect.left) * s0 + g.vb0.x,
                         y: (g.c0.y - g.rect.top) * s0 + g.vb0.y };
            zoom = Math.max(Z_MIN, Math.min(Z_MAX, g.z0 * (g.d0 > 4 ? d / g.d0 : 1)));
            panX = g.px0; panY = g.py0;
            const v = view();
            const sc = v.size / g.rect.width;
            panX += w0.x - ((c.x - g.rect.left) * sc + v.x);
            panY += w0.y - ((c.y - g.rect.top) * sc + v.y);
            clampPan();
            refreshZoom(); draw();
        }

        // ===== 太さの当たり ================================================
        // 接線の向きは半径で決まる。n を接線と直交する単位ベクトルとすると
        //     n・(cq - cp) = sp*rp - sq*rq
        // なので、向きを固定してしまえば片方の半径について一次式になる。
        // 「この辺を水平にする半径」がそのまま閉じた式で出るということ。
        // 目で合わせるしかなかったものが、当たりとして置ける。
        //
        // n の取り方は2通りあるが、輪ゴムがどちら側を通るかは接点の並びで
        // 決まっているので、linkOf と同じ枝を選んだほうだけを採る
        // 接線を向き theta にするために必要な K = sp*rp - sq*rq。
        // n の取り方は2通りあるが、linkOf と同じ枝になるほうだけを採る
        function linkKForAngle(pt, q, theta) {
            const dx = q.c[0] - pt.c[0], dy = q.c[1] - pt.c[1];
            const L = Math.hypot(dx, dy);
            if (L < 1e-9) return null;
            const base = Math.atan2(dy, dx);
            for (const na of [theta + Math.PI / 2, theta - Math.PI / 2]) {
                const K = Math.cos(na) * dx + Math.sin(na) * dy;
                if (Math.abs(K) > L) continue;
                const phi = base - Math.acos(K / L);
                // phi と na が同じ向きを指しているか（枝が合っているか）
                if (Math.abs(Math.atan2(Math.sin(phi - na), Math.cos(phi - na))) > 1e-6) continue;
                return K;
            }
            return null;
        }

        // 片方の杭の半径を解く（SIZE 用）
        function radiusForAngle(pt, q, which, theta) {
            const K = linkKForAngle(pt, q, theta);
            if (K == null) return null;
            const r = which === 'p' ? (K + q.s * q.r) / pt.s : (pt.s * pt.r - K) / q.s;
            return (r >= R_MIN && r <= R_MAX) ? r : null;
        }

        // 既定の太さ ρ のほうを解く（RADIUS 用）。
        // 既定の杭は rp = ρ、決めた杭は太さが動かないので
        //     K = A*ρ + B,  A = (p が既定 ? sp : 0) - (q が既定 ? sq : 0)
        // A が 0 になるのは「両方とも決めた杭」と「両方とも既定で同じ側」。
        // 前者は ρ に反応しないし、後者は K が恒等的に 0（接線が中心線と平行）で、
        // どちらも ρ をいくら動かしても向きが変わらない
        function rhoForAngle(pt, q, theta) {
            const dp = !pegWant.has(pt.k), dq = !pegWant.has(q.k);
            const A = (dp ? pt.s : 0) - (dq ? q.s : 0);
            if (!A) return null;
            const B = (dp ? 0 : pt.s * pt.r) - (dq ? 0 : q.s * q.r);
            const K = linkKForAngle(pt, q, theta);
            if (K == null) return null;
            const rho = (K - B) / A;
            return (rho >= R_MIN && rho <= R_MAX) ? rho : null;
        }

        // 指で決めた半径 raw を、近くに当たりがあればそこへ寄せる。
        // 当たりは3種類：水平・垂直・盤にある別の辺と平行
        // 盤にある接線を、当たりを探す側（solve が値を返す辺）と
        // 向きが動かない側（平行の基準に使える辺）に分ける
        function collectEdges(solve) {
            const mine = [], others = [];
            for (const b of bands) {
                const cs = b.contacts;
                if (!cs || cs.length < 2) continue;
                for (let i = 0; i < cs.length; i++) {
                    const pt = cs[i], q = cs[(i + 1) % cs.length];
                    const L = linkOf(pt, q);
                    if (!L) continue;
                    const e = { pt, q, pa: L.pa, pb: L.pb,
                        ang: Math.atan2(L.pb[1] - L.pa[1], L.pb[0] - L.pa[0]) };
                    (solve(pt, q) ? mine : others).push(e);
                }
            }
            return { mine, others };
        }

        // 候補のうち raw にいちばん近いものを、当たりの範囲内なら返す
        function nearestSnap(cand, raw) {
            let best = null;
            for (const c of cand)
                if (c.v != null && (!best || Math.abs(c.v - raw) < Math.abs(best.v - raw))) best = c;
            return (best && Math.abs(best.v - raw) <= tol(0.15, 7)) ? best : null;
        }

        // 寄せた辺と、平行の基準にした辺をガイドとして置く
        function setGuides(edge, ref, redraw) {
            const pt = Object.assign({}, edge.pt), q = Object.assign({}, edge.q);
            redraw(pt, q);
            const L = linkOf(pt, q);
            guides = [];
            if (L) guides.push({ a: L.pa, b: L.pb, ref: false });
            if (ref) guides.push({ a: ref.pa, b: ref.pb, ref: true });
        }

        // RADIUS のつまみ。既定の杭ぜんぶが同時に動くので、
        // 当たりになるのは「既定 × 決めた杭」の辺と、
        // 「既定 × 既定で内外が逆」の辺だけ
        function snapRadius(raw) {
            guides = [];
            if (!guideOn) return raw;
            const { mine, others } = collectEdges((pt, q) =>
                ((!pegWant.has(pt.k) ? pt.s : 0) - (!pegWant.has(q.k) ? q.s : 0)) !== 0);
            if (!mine.length) return raw;
            const room = defaultRoom(k => rOf(k));
            const targets = [[0, null], [Math.PI / 2, null]];
            for (const o of others) targets.push([o.ang, o]);
            const cand = [];
            for (const m of mine)
                for (const [th, ref] of targets) {
                    const v = rhoForAngle(m.pt, m.q, th);
                    if (v == null || v > room) continue;
                    cand.push({ v, m, ref });
                }
            const best = nearestSnap(cand, raw);
            if (!best) return raw;
            setGuides(best.m, best.ref, (pt, q) => {
                if (!pegWant.has(pt.k)) pt.r = best.v;
                if (!pegWant.has(q.k)) q.r = best.v;
            });
            return best.v;
        }

        function snapSize(k, raw) {
            guides = [];
            if (!guideOn) return raw;
            const { mine, others } = collectEdges((pt, q) => pt.k === k || q.k === k);
            if (!mine.length) return raw;
            const room = roomFor(k);
            const targets = [[0, null], [Math.PI / 2, null]];
            for (const o of others) targets.push([o.ang, o]);
            const cand = [];
            for (const m of mine) {
                const which = m.pt.k === k ? 'p' : 'q';
                for (const [th, ref] of targets) {
                    const v = radiusForAngle(m.pt, m.q, which, th);
                    if (v == null || v > room) continue;
                    cand.push({ v, m, which, ref });
                }
            }
            const best = nearestSnap(cand, raw);
            if (!best) return raw;
            setGuides(best.m, best.ref, (pt, q) => {
                if (best.which === 'p') pt.r = best.v; else q.r = best.v;
            });
            return best.v;
        }

        // 掴んで引っぱり始める。掴む位置は押した点で、指の現在地ではない
        // そのセルへ杭を置けるか。盤の中で、まだ空いていること
        const canPlace = (i, j) =>
            i >= 0 && j >= 0 && i < cols && j < rows && !pegs.has(key(i, j));

        // 杭を隣のセルへ移す。removePeg（旧）+ addPeg（新）を通すだけで、
        // 接点列にもソルバにも新しい道は作らない。
        // ただし、その杭にだけ巻かれている輪ゴム（＝円）は例外。removePeg は
        // 接点が1本しかない輪ゴムからは接点を外さないので、抜けた杭を指したまま
        // 残って張り直しで落ちる。移動で輪ゴムが消えるのは事故なので巻き直す
        function movePeg(k, to) {
            const want = pegWant.get(k);   // 自分で決めた太さは連れていく
            const solo = bands.filter(bd => bd.contacts
                && bd.contacts.length === 1 && bd.contacts[0].k === k);
            removePeg(k);
            addPeg(to);
            if (want !== undefined) setWant(to, want);
            for (const bd of solo) {
                bd.contacts = [{ k: to, s: IN, c: pegC(to), r: rOf(to) }];
                bd.sides.set(to, IN);
                bd.ghosts.delete(to);
            }
        }

        // タップ。空セルなら打って選ぶ、杭なら選ぶ。それだけ。
        // 抜く・複製する・動かすは、選んだあとにボタンでやる
        function tapPeg(k, marked) {
            if (!hasPeg(k)) {
                if (!marked) mark();
                addPeg(k);
            }
            selKey = k;
            refreshSel();
        }

        function startDrag(at, e) {
            if (!grabAnchors(at.x, at.y)) return false;
            mark();
            cv.setPointerCapture(e.pointerId);
            dragRect = cv.getBoundingClientRect(); dragVB = view();
            dragging = true; startPos = dragPos = at;
            origState = new Map(cur().sides);
            draw();
            return true;
        }

        cv.addEventListener('pointerdown', e => {
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pts.size >= 2) {
                cancelTouch();
                hushUntilUp = true;
                if (pts.size === 2) startGesture();
                return;
            }
            if (hushUntilUp) return;
            // 中ボタンでパン。片手でも盤を動かせるように
            if (e.button === 1) {
                e.preventDefault();
                cv.setPointerCapture(e.pointerId);
                panning = { x: e.clientX, y: e.clientY, px: panX, py: panY,
                            rect: cv.getBoundingClientRect(), vb: view() };
                return;
            }
            const w = toWorld(e);
            const k = pickCell(w.x, w.y);
            // 輪ゴムと杭の、近いほうを掴む。
            // 空セルより輪ゴムを優先しないと、直線の真ん中を掴もうとしたときに
            // その辺りのセルに杭が生えてしまう
            const db = bandDist(w.x, w.y);
            const near = db < GRAB();
