<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千葉県公立高校 理科 対策</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3441;
    --txt:#e6edf3; --sub:#8b98a9; --accent:#4fc3f7; --accent2:#66d9a8;
    --warn:#ffb454; --bad:#ff6b6b; --good:#66d9a8;
    --phys:#4fc3f7; --chem:#c792ea; --bio:#66d9a8; --geo:#ffb454;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.7; padding-bottom:80px;
  }
  a{color:inherit}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}

  header{
    background:linear-gradient(135deg,#14263a,#0d1117);
    border-bottom:1px solid var(--line); padding:26px 0 22px; margin-bottom:8px;
  }
  header h1{font-size:20px;font-weight:700;letter-spacing:.02em}
  header p{color:var(--sub);font-size:13px;margin-top:4px}
  .prog-wrap{margin-top:16px}
  .prog-bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
  .prog-label{font-size:12px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}

  /* nav tabs */
  .tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:20;flex-wrap:wrap}
  .tab{
    flex:1;min-width:70px;text-align:center;padding:9px 4px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;
    color:var(--sub);cursor:pointer;transition:.15s;user-select:none;
  }
  .tab.active{color:var(--txt);border-color:var(--accent)}
  .tab[data-f="phys"].active{border-color:var(--phys);color:var(--phys)}
  .tab[data-f="chem"].active{border-color:var(--chem);color:var(--chem)}
  .tab[data-f="bio"].active{border-color:var(--bio);color:var(--bio)}
  .tab[data-f="geo"].active{border-color:var(--geo);color:var(--geo)}
  .tab[data-f="test"].active{border-color:#fff;color:#fff}

  section{display:none;animation:fade .3s}
  section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .field-head{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
  .field-dot{width:12px;height:12px;border-radius:50%}
  .field-head h2{font-size:17px}
  .field-head .cnt{margin-left:auto;font-size:12px;color:var(--sub)}

  .unit{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .unit-head{display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;user-select:none}
  .unit-head:hover{background:var(--panel2)}
  .unit-grade{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--sub);white-space:nowrap}
  .unit-title{font-weight:700;font-size:15px;flex:1}
  .unit-check{font-size:16px;width:22px;text-align:center}
  .unit-arrow{color:var(--sub);transition:transform .2s;font-size:12px}
  .unit.open .unit-arrow{transform:rotate(90deg)}
  .unit-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
  .unit.open .unit-body{display:block}

  h3.sec{font-size:13px;color:var(--accent);margin:16px 0 8px;font-weight:700;letter-spacing:.03em}
  .points{list-style:none}
  .points li{padding:7px 0 7px 22px;position:relative;font-size:14px;border-bottom:1px dashed var(--line)}
  .points li:last-child{border-bottom:none}
  .points li::before{content:"▸";position:absolute;left:2px;color:var(--accent2)}
  .kw{color:var(--warn);font-weight:700}
  .fm{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px;font-family:ui-monospace,'SF Mono',Menlo,monospace}

  /* quiz */
  .q{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .q-txt{font-size:14px;font-weight:600;margin-bottom:10px}
  .q-txt .num{color:var(--accent);margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{padding:10px 13px;border-radius:9px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:14px;transition:.12s}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:rgba(102,217,168,.18);border-color:var(--good)}
  .opt.wrong{background:rgba(255,107,107,.16);border-color:var(--bad)}
  .opt.disabled{cursor:default;pointer-events:none;opacity:.55}
  .opt.disabled.correct,.opt.disabled.wrong{opacity:1}
  .expl{display:none;margin-top:10px;padding:10px 12px;background:var(--panel);border-radius:8px;font-size:13px;border-left:3px solid var(--accent2)}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}

  .btn{display:inline-block;padding:9px 16px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#04222f;border-color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}

  /* test mode */
  .test-intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
  .test-intro h2{font-size:18px;margin-bottom:8px}
  .test-intro p{color:var(--sub);font-size:14px;margin-bottom:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{padding:7px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:13px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--accent);color:#04222f;border-color:var(--accent)}
  .result-card{text-align:center;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:16px 0}
  .result-score{font-size:44px;font-weight:800;color:var(--accent)}
  .result-msg{color:var(--sub);margin-top:6px}
  .qcount{font-size:12px;color:var(--sub);text-align:right;margin-bottom:4px}

  /* flashcard (一問一答) */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 20px;margin:14px 0;min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .card-field{font-size:12px;color:var(--sub);margin-bottom:12px;font-weight:700}
  .card-q{font-size:19px;font-weight:700;line-height:1.6}
  .card-a{font-size:26px;font-weight:800;color:var(--accent2);margin-top:18px;display:none}
  .card.revealed .card-a{display:block;animation:fade .25s}
  .card-hint{font-size:12px;color:var(--sub);margin-top:16px}
  .grade-row{display:flex;gap:10px;margin:10px 0}
  .grade-row .btn{flex:1;text-align:center;padding:13px}
  .btn.ng{border-color:var(--bad);color:var(--bad)}
  .btn.ok{border-color:var(--good);color:var(--good)}
  .qa-stat{display:flex;justify-content:space-around;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;font-size:13px}
  .qa-stat b{display:block;font-size:22px;font-weight:800}
  .qa-stat .s-rem b{color:var(--accent)} .qa-stat .s-ok b{color:var(--good)} .qa-stat .s-ng b{color:var(--warn)}
  /* 記述 */
  .kj{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
  .kj-q{font-size:15px;font-weight:700;margin-bottom:6px}
  .kj-q .num{color:var(--geo)}
  .kj-field{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:8px}
  .kj-a{display:none;margin-top:12px;padding:12px 14px;background:var(--panel2);border-radius:9px;border-left:3px solid var(--good);font-size:14px;line-height:1.7}
  .kj-a.show{display:block;animation:fade .25s}
  .kj-a .lbl{color:var(--good);font-weight:700;font-size:12px;display:block;margin-bottom:4px}
  .kj-point{color:var(--sub);font-size:13px;margin-top:8px}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
  .reset{color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🧪 千葉県公立高校 理科 対策</h1>
    <p>物理・化学・生物・地学の全単元｜要点整理と確認テスト</p>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-label">
        <span>学習の進み具合</span>
        <span id="progText">0 / 0 単元</span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-f="phys">物理</div>
    <div class="tab" data-f="chem">化学</div>
    <div class="tab" data-f="bio">生物</div>
    <div class="tab" data-f="geo">地学</div>
    <div class="tab" data-f="qa">一問一答</div>
    <div class="tab" data-f="kijutsu">記述</div>
    <div class="tab" data-f="keisan">計算特訓</div>
    <div class="tab" data-f="test">模試</div>
    <div class="tab" data-f="review">復習<span class="c-badge" id="reviewBadge"></span></div>
  </div>

  <div id="content"></div>

  <section id="sec-qa">
    <div id="qaArea"></div>
  </section>

  <section id="sec-kijutsu">
    <div id="kijutsuArea"></div>
  </section>

  <section id="sec-keisan">
    <div id="keisanArea"></div>
  </section>

  <section id="sec-test">
    <div id="testArea"></div>
  </section>

  <section id="sec-review">
    <div id="reviewArea"></div>
  </section>

  <footer>
    千葉県公立高校入試（理科）学習教材 ・ 全範囲対応<br>
    進捗はこの端末に自動保存されます ・ <span class="reset" id="resetBtn">進捗をリセット</span>
  </footer>
</div>

<script src="../chiba-common.js"></script>
<script>
Chiba.init('rika');
/* =========================================================================
   千葉県公立高校 理科 教材データ
   分野: phys(物理) chem(化学) bio(生物) geo(地学)
   各単元: grade, title, points[], formulas[], quiz[{q,opts,a,e}]
   ========================================================================= */
const DATA = {
phys:{ name:"物理", color:"var(--phys)", units:[
  {id:"p1", grade:"中1", title:"光の性質",
   points:[
     "光は<span class='kw'>直進</span>する。物体が見えるのは、光が物体で<span class='kw'>反射</span>して目に届くから。",
     "反射の法則：<span class='kw'>入射角＝反射角</span>（角は鏡の面に垂直な線から測る）。",
     "光が異なる物質へ進むとき境界で曲がる現象を<span class='kw'>屈折</span>という。",
     "空気→水・ガラス：入射角＞屈折角。水・ガラス→空気：入射角＜屈折角。",
     "光が全て反射して出ていかない現象を<span class='kw'>全反射</span>という（水中→空気で入射角が大きいとき）。",
     "凸レンズ：焦点距離の2倍の位置に物体→<span class='kw'>実像</span>（上下左右逆・同じ大きさ）。焦点の内側→<span class='kw'>虚像</span>（正立・拡大）。"
   ],
   formulas:[],
   quiz:[
     {q:"鏡に光が当たったとき、入射角が30°のときの反射角は？",opts:["15°","30°","60°","90°"],a:1,e:"反射の法則により入射角＝反射角なので30°。"},
     {q:"凸レンズで、焦点距離の2倍より遠くに物体を置いたときにできる像は？",opts:["正立の虚像","倒立の実像で物体より小さい","倒立の実像で物体より大きい","像はできない"],a:1,e:"焦点距離の2倍より遠い→倒立の実像で物体より小さくなる。"},
     {q:"光が水中から空気中へ出るとき、入射角を大きくしていくと境界面で全て反射する現象を何という？",opts:["屈折","分散","全反射","乱反射"],a:2,e:"全反射。光ファイバーもこの原理を利用している。"}
   ]},
  {id:"p2", grade:"中1", title:"音の性質",
   points:[
     "音は物体の<span class='kw'>振動</span>によって生じ、波として伝わる。真空中では伝わらない。",
     "音の伝わる速さは空気中で約<span class='kw'>340 m/s</span>（光よりずっと遅い）。",
     "振動の<span class='kw'>振幅</span>が大きいほど音が<span class='kw'>大きい</span>。",
     "1秒間の振動回数（<span class='kw'>振動数</span>／単位ヘルツHz）が多いほど音が<span class='kw'>高い</span>。"
   ],
   formulas:["音の速さ〔m/s〕＝距離〔m〕÷時間〔s〕"],
   quiz:[
     {q:"雷が光ってから4秒後に音が聞こえた。音の速さを340m/sとすると、雷までの距離は？",opts:["85 m","340 m","680 m","1360 m"],a:3,e:"340×4＝1360 m。光は一瞬で届くとみなす。"},
     {q:"音を高くするには、弦をどうすればよい？",opts:["太くする","長くする","強くはじく","短く・強く張る"],a:3,e:"弦を短く・細く・強く張ると振動数が増え、高い音になる。強くはじくのは音量。"}
   ]},
  {id:"p3", grade:"中1", title:"力のはたらき・圧力",
   points:[
     "力の三要素：<span class='kw'>大きさ・向き・作用点</span>。力の単位はニュートン〔N〕。",
     "質量100gの物体にはたらく重力の大きさは約<span class='kw'>1N</span>。",
     "ばねののびは加えた力に比例する（<span class='kw'>フックの法則</span>）。",
     "圧力＝面を垂直に押す力÷力がはたらく面積。単位は<span class='kw'>パスカル〔Pa〕</span>（＝N/m²）。",
     "大気圧はあらゆる向きにはたらき、海面付近で約<span class='kw'>1013 hPa</span>。"
   ],
   formulas:["圧力〔Pa〕＝力〔N〕÷面積〔m²〕"],
   quiz:[
     {q:"質量300gの物体にはたらく重力の大きさは約何N？（100gで1N）",opts:["0.3 N","3 N","30 N","300 N"],a:1,e:"100gで1Nなので300gでは3N。"},
     {q:"面積0.2m²に10Nの力が垂直にはたらくときの圧力は？",opts:["2 Pa","5 Pa","20 Pa","50 Pa"],a:3,e:"10÷0.2＝50 Pa。"},
     {q:"同じ力でも、力がはたらく面積を小さくすると圧力は？",opts:["大きくなる","小さくなる","変わらない","0になる"],a:0,e:"圧力＝力÷面積。面積が小さいほど圧力は大きい（画びょうの先が細い理由）。"}
   ]},
  {id:"p4", grade:"中2", title:"電流と回路",
   points:[
     "<span class='kw'>直列回路</span>：電流はどこも等しい。電圧は各部の和が全体。",
     "<span class='kw'>並列回路</span>：電圧はどこも等しい。電流は各部の和が全体。",
     "電圧〔V〕は電流〔A〕に比例する（<span class='kw'>オームの法則</span>）。",
     "電力〔W〕＝電圧×電流。電力量〔J〕＝電力×時間。熱量も同様。",
     "抵抗の直列合成＝和、並列合成＝逆数の和の逆数（並列は小さくなる）。"
   ],
   formulas:["V＝R×I（電圧＝抵抗×電流）","電力P〔W〕＝V×I","熱量Q〔J〕＝P×t〔秒〕"],
   quiz:[
     {q:"抵抗20Ωに0.5Aの電流が流れているときの電圧は？",opts:["0.025 V","4 V","10 V","40 V"],a:2,e:"V＝R×I＝20×0.5＝10V。"},
     {q:"100Vで2Aの電流が流れる電気器具の消費電力は？",opts:["50 W","102 W","200 W","2000 W"],a:2,e:"P＝V×I＝100×2＝200W。"},
     {q:"直列回路について正しいものは？",opts:["各抵抗の電圧は等しい","電流はどこでも等しい","抵抗を増やすと電流が増える","全体の抵抗は各抵抗より小さい"],a:1,e:"直列では電流はどこでも等しい。抵抗を増やすと全体の抵抗は大きくなり電流は減る。"},
     {q:"100Wの電熱線を5分間使ったときの発熱量は？",opts:["500 J","3000 J","30000 J","500 J"],a:2,e:"Q＝P×t＝100W×300秒＝30000J。時間は秒に直す。"}
   ]},
  {id:"p5", grade:"中2", title:"電流と磁界",
   points:[
     "電流のまわりには同心円状の<span class='kw'>磁界</span>ができる（右ねじの法則）。",
     "コイルに電流を流すと<span class='kw'>電磁石</span>になる。",
     "磁界中の電流は力を受ける（<span class='kw'>モーター</span>の原理）。",
     "磁界の変化でコイルに電流が生じる現象を<span class='kw'>電磁誘導</span>、流れる電流を<span class='kw'>誘導電流</span>という（発電機の原理）。"
   ],
   formulas:[],
   quiz:[
     {q:"コイルに磁石を近づけたり遠ざけたりすると電流が流れる現象を何という？",opts:["静電気","電磁誘導","放電","帯電"],a:1,e:"電磁誘導。生じる電流を誘導電流といい、発電機に利用される。"},
     {q:"磁界の中で電流が受ける力を利用した装置は？",opts:["発電機","電池","モーター","乾電池"],a:2,e:"モーターは磁界中の電流が受ける力で回転する。"}
   ]},
  {id:"p6", grade:"中2", title:"静電気",
   points:[
     "異なる物質をこすると<span class='kw'>静電気</span>が生じる（帯電）。",
     "同じ種類の電気は<span class='kw'>しりぞけ合い</span>、異なる種類は<span class='kw'>引き合う</span>。",
     "たまった電気が流れ出す現象を<span class='kw'>放電</span>という。",
     "真空放電を利用したものに<span class='kw'>陰極線（電子の流れ）</span>がある。電子は－極から＋極へ進む。"
   ],
   formulas:[],
   quiz:[
     {q:"−の電気を帯びた物体どうしを近づけるとどうなる？",opts:["引き合う","しりぞけ合う","変化しない","放電する"],a:1,e:"同じ種類の電気どうしはしりぞけ合う。"},
     {q:"陰極線（電子線）は何極から何極へ向かって進む？",opts:["＋極から−極","−極から＋極","動かない","両方向"],a:1,e:"電子は−の電気を持つので、−極から＋極へ向かう。"}
   ]},
  {id:"p7", grade:"中3", title:"力の合成・分解と運動",
   points:[
     "2力が一直線上にないとき、対角線が<span class='kw'>合力</span>（平行四辺形の法則）。",
     "1つの力を2方向に分ける操作を<span class='kw'>力の分解</span>という。",
     "物体に力がはたらかない・つり合うとき、静止または<span class='kw'>等速直線運動</span>を続ける（<span class='kw'>慣性の法則</span>）。",
     "斜面を下る物体は速さが一定の割合で増える。自由落下も同様。",
     "作用・反作用：一方が押すと同じ大きさで反対向きに押し返される。"
   ],
   formulas:["速さ〔m/s〕＝移動距離〔m〕÷時間〔s〕"],
   quiz:[
     {q:"力を加えなくても物体が同じ速さでまっすぐ進み続ける性質を何という？",opts:["慣性","弾性","重力","摩擦"],a:0,e:"慣性。力がつり合っていれば等速直線運動を続ける（慣性の法則）。"},
     {q:"1.5秒間に6m進んだ物体の平均の速さは？",opts:["2 m/s","3 m/s","4 m/s","9 m/s"],a:2,e:"6÷1.5＝4 m/s。"},

   ]},
  {id:"c9", grade:"暗記", title:"化学式・化学反応式 暗記シート",
   points:[
     "<b>■ おぼえる化学式（物質を表す）</b>",
     "単体（1種類の原子）：水素<span class='kw'>H₂</span>／酸素<span class='kw'>O₂</span>／窒素<span class='kw'>N₂</span>／炭素<span class='kw'>C</span>／銅<span class='kw'>Cu</span>／鉄<span class='kw'>Fe</span>／マグネシウム<span class='kw'>Mg</span>／亜鉛<span class='kw'>Zn</span>／銀<span class='kw'>Ag</span>／ナトリウム<span class='kw'>Na</span>",
     "気体は原子2個で1分子（<span class='kw'>H₂・O₂・N₂</span>）。金属や炭素は分子をつくらず記号だけで表す（<span class='kw'>Cu・Fe・C</span>）。",

     "酸化物：酸化銅<span class='kw'>CuO</span>／酸化マグネシウム<span class='kw'>MgO</span>／酸化銀<span class='kw'>Ag₂O</span>／酸化鉄・硫化鉄<span class='kw'>FeS</span>",

     "<b>■ おぼえるイオン（中3）</b>",
     "陽イオン：水素<span class='kw'>H⁺</span>／ナトリウム<span class='kw'>Na⁺</span>／銅<span class='kw'>Cu²⁺</span>／亜鉛<span class='kw'>Zn²⁺</span>。「＋の電気を持つ＝電子を失った」と覚える。",
     "陰イオン：塩化物<span class='kw'>Cl⁻</span>／水酸化物<span class='kw'>OH⁻</span>／硫酸<span class='kw'>SO₄²⁻</span>。数字（価数）は失った/受け取った電子の数。",
     "<b>■ 化学反応式のつくり方（3ステップ）</b>",

   formulas:[
     "【水の電気分解】 2H₂O → 2H₂ + O₂ ｜水に電流を流すと分解。陰極に水素、陽極に酸素が2:1で発生。",
     "【炭酸水素ナトリウムの熱分解】 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂ ｜加熱で3つに分解。石灰水を白くにごらせる（CO₂）ことで確認。",
     "【酸化銅の還元】 2CuO + C → 2Cu + CO₂ ｜炭素が酸素を奪う。CuOは還元されて銅に、Cは酸化されてCO₂に。",
     "【銅の酸化】 2Cu + O₂ → 2CuO ｜加熱すると黒くなる。質量比 銅:酸素 = 4:1。",
     "【マグネシウムの燃焼】 2Mg + O₂ → 2MgO ｜強い光を出して燃える。質量比 Mg:酸素 = 3:2。",
     "【鉄と硫黄の化合】 Fe + S → FeS ｜結びつくと磁石につかない別物質（硫化鉄）になる。",

     "【塩酸の中和】 HCl + NaOH → NaCl + H₂O ｜酸＋アルカリ→塩＋水。H⁺+OH⁻→H₂O が中和の本体。",
     "【塩化銅の電離】 CuCl₂ → Cu²⁺ + 2Cl⁻ ｜水に溶けてイオンに分かれる。電気分解で陰極に銅・陽極に塩素。"
   ],
   quiz:[
     {q:"水の電気分解 2H₂O → 2H₂ + □ の□に入る化学式は？",opts:["O","O₂","O₃","H₂O"],a:1,e:"酸素は分子O₂で発生する。陰極の水素と陽極の酸素は体積比2:1。"},
     {q:"銅を加熱して酸化させる反応式 2Cu + O₂ → □ の□は？",opts:["CuO","2CuO","Cu₂O","2CuO₂"],a:1,e:"左辺の銅原子は2個、酸素原子も2個。右辺もCuO 2個ぶんで原子数が合う→2CuO。"},
     {q:"化学反応式で原子の数を合わせるとき、変えてよいのはどれ？",opts:["化学式の右下の小さい数字","分子の前につける係数","矢印の向き","元素記号"],a:1,e:"係数（前の大きい数）だけで調整する。右下の数字を変えると別の物質になってしまう。"},
     {q:"炭酸水素ナトリウムを加熱したときの反応式に含まれない物質は？",opts:["Na₂CO₃","H₂O","CO₂","O₂"],a:3,e:"2NaHCO₃→Na₂CO₃+H₂O+CO₂。酸素O₂は発生しない。"},
     {q:"銅と酸素が結びつく質量比として正しいものは？",opts:["銅:酸素=1:1","銅:酸素=4:1","銅:酸素=3:2","銅:酸素=2:3"],a:1,e:"銅:酸素=4:1。マグネシウムは3:2なので混同に注意。"},
     {q:"次のうち『単体』を表す化学式はどれ？",opts:["H₂O","CO₂","O₂","NaCl"],a:2,e:"O₂は酸素原子だけ＝単体。他は2種類以上の原子からなる化合物。"}
   ]},
]},

bio:{ name:"生物", color:"var(--bio)", units:[
  {id:"b1", grade:"中1", title:"植物のつくりとはたらき",
   points:[
     "被子植物は胚珠が<span class='kw'>子房</span>に包まれる。裸子植物（マツなど）は子房がなく胚珠がむき出し。",
     "双子葉類：葉脈は<span class='kw'>網状脈</span>・根は<span class='kw'>主根と側根</span>・維管束は輪状。",
     "単子葉類：葉脈は<span class='kw'>平行脈</span>・根は<span class='kw'>ひげ根</span>・維管束は散らばる。",
     "光合成は<span class='kw'>葉緑体</span>で行われ、二酸化炭素と水から<span class='kw'>デンプンと酸素</span>をつくる（光が必要）。",
     "呼吸は昼夜つねに行い酸素を吸収・二酸化炭素を放出。<span class='kw'>蒸散</span>は主に葉の裏の気孔から水を放出。"
   ],
   formulas:["光合成：二酸化炭素＋水 →(光)→ デンプン＋酸素"],
   quiz:[
     {q:"葉緑体で光を受けて栄養分をつくるはたらきは？",opts:["呼吸","蒸散","光合成","消化"],a:2,e:"光合成。二酸化炭素と水からデンプンと酸素をつくる。"},
     {q:"単子葉類の特徴はどれ？",opts:["網状脈と主根","平行脈とひげ根","網状脈とひげ根","平行脈と主根"],a:1,e:"単子葉類は平行脈・ひげ根・維管束が散在。"},
     {q:"植物が葉の気孔から水蒸気を放出するはたらきを何という？",opts:["光合成","蒸散","呼吸","吸水"],a:1,e:"蒸散。根からの吸水を促し、体温調節にも関わる。"}
   ]},
  {id:"b2", grade:"中1", title:"動物の分類",
   points:[
     "背骨のある動物を<span class='kw'>セキツイ動物</span>、ないものを無セキツイ動物という。",
     "セキツイ動物：魚類・両生類・ハチュウ類・鳥類・ホニュウ類の5つ。",
     "子の生まれ方：卵生（多く）、ホニュウ類は<span class='kw'>胎生</span>。",
     "無セキツイ動物：体が外骨格でおおわれ節がある<span class='kw'>節足動物</span>（昆虫・甲殻類）、内臓が外とう膜に包まれる<span class='kw'>軟体動物</span>（イカ・貝）。",
     "肉食動物は目が前向き（立体視・獲物の距離）、草食動物は横向き（広い視野）。"
   ],
   formulas:[],
   quiz:[
     {q:"胎生でうまれるのはどのなかま？",opts:["魚類","両生類","ハチュウ類","ホニュウ類"],a:3,e:"ホニュウ類は胎生。他のセキツイ動物は卵生。"},
     {q:"昆虫やエビなどの、外骨格をもち体に節がある動物のなかまを何という？",opts:["軟体動物","節足動物","セキツイ動物","刺胞動物"],a:1,e:"節足動物。外骨格と節のある足が特徴。"},
     {q:"両生類の呼吸の特徴として正しいものは？",opts:["一生えらで呼吸","一生肺で呼吸","子はえら、親は肺と皮膚","一生皮膚だけ"],a:2,e:"両生類は幼生（子）はえら、成体（親）は肺と皮膚で呼吸する。"}
   ]},
  {id:"b3", grade:"中2", title:"細胞と消化・吸収",
   points:[
     "細胞共通のつくり：<span class='kw'>核・細胞膜・細胞質</span>。植物細胞はさらに<span class='kw'>細胞壁・葉緑体・液胞</span>をもつ。",
     "消化酵素：だ液の<span class='kw'>アミラーゼ</span>（デンプン→糖）、胃液のペプシン（タンパク質）、すい液・小腸（各種）。",
     "デンプン→ブドウ糖、タンパク質→アミノ酸、脂肪→脂肪酸とモノグリセリド。",
     "養分は小腸の<span class='kw'>柔毛</span>から吸収。ブドウ糖・アミノ酸は毛細血管、脂肪分はリンパ管へ。"
   ],
   formulas:[],
   quiz:[
     {q:"だ液に含まれ、デンプンを分解する消化酵素は？",opts:["ペプシン","アミラーゼ","トリプシン","リパーゼ"],a:1,e:"アミラーゼがデンプンを麦芽糖などに分解する。"},
     {q:"植物細胞にあって動物細胞にないつくりは？",opts:["核","細胞膜","細胞壁","細胞質"],a:2,e:"細胞壁・葉緑体・液胞は植物細胞に特有。核と細胞膜は共通。"},
     {q:"小腸の柔毛で吸収されたブドウ糖が入るのは？",opts:["リンパ管","毛細血管","気管","じん臓"],a:1,e:"ブドウ糖・アミノ酸は毛細血管へ、脂肪分はリンパ管へ入る。"}
   ]},
  {id:"b4", grade:"中2", title:"呼吸・血液・排出",
   points:[
     "肺胞で酸素を取り入れ二酸化炭素を放出（<span class='kw'>ガス交換</span>）。表面積が大きく効率的。",
     "血液成分：<span class='kw'>赤血球</span>（酸素運搬・ヘモグロビン）、白血球（防御）、血小板（凝固）、血しょう（養分・不要物運搬）。",
     "心臓から出る血液が流れる血管が<span class='kw'>動脈</span>、戻る血管が静脈。",
     "肺を通った直後の血液（酸素が多い）を<span class='kw'>動脈血</span>という。",
     "細胞の活動で出た<span class='kw'>アンモニア</span>は肝臓で尿素に変えられ、じん臓でこし取られる。"
   ],
   formulas:[],
   quiz:[
     {q:"酸素を運ぶ、ヘモグロビンを含む血液成分は？",opts:["白血球","赤血球","血小板","血しょう"],a:1,e:"赤血球中のヘモグロビンが酸素と結びついて運ぶ。"},
     {q:"有害なアンモニアを尿素につくり変える器官は？",opts:["じん臓","肝臓","ぼうこう","肺"],a:1,e:"肝臓で尿素に変え、じん臓でこし取られ尿として排出される。"},
     {q:"『動脈血』の説明として正しいものは？",opts:["必ず動脈を流れる","酸素を多く含む血液","二酸化炭素を多く含む","心臓に戻る血液"],a:1,e:"動脈血は酸素を多く含む血液。肺静脈のように静脈を流れることもある。"}
   ]},
  {id:"b5", grade:"中2", title:"刺激と反応・神経",
   points:[
     "感覚器官（目・耳など）で刺激を受け取り、信号が神経を伝わる。",
     "脳やせきずいを<span class='kw'>中枢神経</span>、そこから出る神経を末しょう神経という。",
     "感覚神経（刺激を中枢へ）・運動神経（命令を筋肉へ）。",
     "熱いものに触れて思わず手を引く反応を<span class='kw'>反射</span>という。脳を経由せずせきずいで命令→反応が速い。"
   ],
   formulas:[],
   quiz:[
     {q:"熱いものに触れて意識せず手を引っこめる反応を何という？",opts:["随意運動","反射","反応時間","刺激"],a:1,e:"反射。せきずいで命令が出るため、脳を経由するより速い。"},
     {q:"皮膚が受け取った刺激を中枢へ伝える神経は？",opts:["運動神経","感覚神経","中枢神経","交感神経"],a:1,e:"感覚神経が刺激を中枢へ、運動神経が命令を筋肉へ伝える。"}
   ]},
  {id:"b6", grade:"中3", title:"細胞分裂と生殖",
   points:[
     "細胞が分かれて数を増やすことを<span class='kw'>細胞分裂</span>という。分裂前に染色体が複製される。",
     "受精を行わない生殖を<span class='kw'>無性生殖</span>、受精による生殖を<span class='kw'>有性生殖</span>という。",
     "生殖細胞をつくる特別な細胞分裂を<span class='kw'>減数分裂</span>といい、染色体数が半分になる。",
     "受精卵が細胞分裂をくり返して成体になるまでの過程を<span class='kw'>発生</span>という。"
   ],
   formulas:[],
   quiz:[
     {q:"生殖細胞ができるときに起こり、染色体数が半分になる分裂は？",opts:["体細胞分裂","減数分裂","無性生殖","受精"],a:1,e:"減数分裂。受精で元の数に戻る。"},
     {q:"受精卵が分裂をくり返して成体になるまでの過程を何という？",opts:["発生","成長","遺伝","進化"],a:0,e:"発生。受精卵→胚→成体へと成長する過程。"}
   ]},
  {id:"b7", grade:"中3", title:"遺伝の規則性",
   points:[
     "形質を伝えるもとになるものを<span class='kw'>遺伝子</span>といい、染色体にある。本体は<span class='kw'>DNA</span>。",
     "対立形質のうち子に現れる方を<span class='kw'>顕性（優性）形質</span>、現れない方を潜性（劣性）形質という。",
     "AAとaaをかけ合わせると子はすべて<span class='kw'>Aa</span>（顕性が現れる）。",
     "AaとAaをかけ合わせると孫は顕性:潜性＝<span class='kw'>3:1</span>（分離の法則）。"
   ],
   formulas:["Aa × Aa → AA : Aa : aa ＝ 1:2:1 → 顕性:潜性＝3:1"],
   quiz:[
     {q:"丸(A)としわ(a)の純系AAとaaをかけ合わせたとき、子の形質は？",opts:["すべて丸","すべてしわ","丸:しわ＝1:1","丸:しわ＝3:1"],a:0,e:"子はすべてAaとなり、顕性の丸が現れる。"},
     {q:"AaとAaをかけ合わせたとき、孫に現れる顕性:潜性の比は？",opts:["1:1","2:1","3:1","1:3"],a:2,e:"AA:Aa:aa＝1:2:1、形質は顕性:潜性＝3:1（分離の法則）。"},
     {q:"遺伝子の本体である物質は？",opts:["タンパク質","DNA","ATP","デンプン"],a:1,e:"遺伝子の本体はDNA（デオキシリボ核酸）。"}
   ]},
  {id:"b8", grade:"中3", title:"生物どうしのつながり・自然界",
   points:[
     "食べる・食べられる関係のつながりを<span class='kw'>食物連鎖</span>、網目状の関係を食物網という。",
     "光合成で有機物をつくる植物は<span class='kw'>生産者</span>、それを食べる動物は<span class='kw'>消費者</span>。",
     "菌類・細菌類など有機物を無機物に分解するものを<span class='kw'>分解者</span>という。",
     "生態系の中で炭素は二酸化炭素↔有機物と<span class='kw'>循環</span>する。",
     "数量関係はふつうピラミッド型（生産者が最も多い）。"
   ],
   formulas:[],
   quiz:[
     {q:"菌類や細菌類のように、有機物を無機物に分解する生物を何という？",opts:["生産者","消費者","分解者","捕食者"],a:2,e:"分解者。落ち葉や死がいを無機物に分解し、循環を支える。"},
     {q:"光合成によって無機物から有機物をつくる生物を何という？",opts:["生産者","消費者","分解者","寄生者"],a:0,e:"植物などの生産者が食物連鎖の出発点になる。"}
   ]},
]},

geo:{ name:"地学", color:"var(--geo)", units:[
  {id:"g1", grade:"中1", title:"火山と火成岩",
   points:[
     "マグマが冷えて固まった岩石を<span class='kw'>火成岩</span>という。",
     "地表付近で急に冷えた<span class='kw'>火山岩</span>は斑状組織、地下深くでゆっくり冷えた<span class='kw'>深成岩</span>は等粒状組織。",
     "ねばりけが強いマグマ→白っぽく盛り上がった形（激しい噴火）、弱い→黒っぽく傾斜がゆるい。",
     "無色鉱物：セキエイ・チョウ石。有色鉱物：クロウンモ・カクセン石・キ石・カンラン石。",
     "火山岩：流紋岩・安山岩・玄武岩。深成岩：花こう岩・せん緑岩・斑れい岩。"
   ],
   formulas:[],
   quiz:[
     {q:"地下深くでマグマがゆっくり冷えてできた、大きな鉱物がぎっしり並ぶつくりの岩石は？",opts:["火山岩","深成岩","堆積岩","変成岩"],a:1,e:"深成岩。ゆっくり冷えるため大きな結晶がそろう等粒状組織。"},
     {q:"ねばりけの強いマグマによる火山の特徴は？",opts:["黒っぽく傾斜がゆるい","白っぽく盛り上がった形","溶岩が遠くまで流れる","噴火がおだやか"],a:1,e:"ねばりけが強いと白っぽくドーム状に盛り上がり、爆発的な噴火になる。"}
   ]},
  {id:"g2", grade:"中1", title:"地震",
   points:[
     "地震で最初にくる小さなゆれ（P波による）が<span class='kw'>初期微動</span>、後の大きなゆれ（S波による）が主要動。",
     "初期微動が続く時間を<span class='kw'>初期微動継続時間</span>といい、震源から遠いほど長い。",
     "ゆれの大きさが<span class='kw'>震度</span>（0〜7）、地震の規模が<span class='kw'>マグニチュード</span>。",
     "P波はS波より速い。P波・S波の速さが分かれば震源までの距離が計算できる。",
     "海溝型地震はプレートの境界で起こり、津波を伴うことがある。"
   ],
   formulas:["震源までの距離〔km〕＝速さ〔km/s〕×地震発生からの時間〔s〕"],
   quiz:[
     {q:"地震のゆれの大きさを表すものは？",opts:["マグニチュード","震度","初期微動","震源"],a:1,e:"震度は各地点のゆれの大きさ（0〜7）。マグニチュードは地震そのものの規模。"},
     {q:"初期微動継続時間と震源からの距離の関係は？",opts:["遠いほど短い","遠いほど長い","関係ない","近いほど長い"],a:1,e:"震源から遠いほどP波とS波の到達時間差が大きく、初期微動継続時間は長くなる。"},
     {q:"P波の速さが8km/sのとき、P波が観測点に届くまで5秒かかった。震源までの距離は？",opts:["1.6 km","13 km","40 km","3 km"],a:2,e:"8×5＝40km。"}
   ]},
  {id:"g3", grade:"中1", title:"地層と堆積岩・化石",
   points:[
     "流水のはたらき：<span class='kw'>侵食・運搬・堆積</span>。粒の大きさで れき（大）＞砂＞泥（小）に分かれて堆積。",
     "堆積岩：れき岩・砂岩・泥岩（粒の大きさで区別）、石灰岩・チャート（生物や化学的なもの）、凝灰岩（火山灰）。",
     "石灰岩は塩酸で二酸化炭素を出す。チャートは非常にかたく塩酸に反応しない。",
     "地層が堆積した当時の環境を示す化石を<span class='kw'>示相化石</span>（例：サンゴ→あたたかく浅い海）。",
     "地層が堆積した年代を示す化石を<span class='kw'>示準化石</span>（例：サンヨウチュウ→古生代、アンモナイト→中生代）。"
   ],
   formulas:[],
   quiz:[
     {q:"アンモナイトの化石が見つかると、その地層ができた『年代』が推定できる。このような化石を何という？",opts:["示相化石","示準化石","生痕化石","標準化石"],a:1,e:"示準化石。地質年代を知る手がかりになる（広範囲に分布し短期間に栄えた生物）。"},
     {q:"うすい塩酸をかけると二酸化炭素が発生する堆積岩は？",opts:["チャート","石灰岩","砂岩","凝灰岩"],a:1,e:"石灰岩は塩酸と反応して二酸化炭素を発生する。チャートは反応しない。"},
     {q:"火山灰が堆積してできた岩石は？",opts:["れき岩","石灰岩","凝灰岩","泥岩"],a:2,e:"凝灰岩。火山灰などが固まってできる。"}
   ]},
  {id:"g4", grade:"中2", title:"気象の観測と大気中の水",
   points:[
     "気温・湿度・気圧を観測する。気圧の単位は<span class='kw'>ヘクトパスカル〔hPa〕</span>。",
     "空気1m³中に含みうる最大の水蒸気量を<span class='kw'>飽和水蒸気量</span>という（気温が高いほど大きい）。",
     "水蒸気が凝結し始める温度を<span class='kw'>露点</span>という。",
     "湿度〔%〕＝空気中の水蒸気量÷その気温での飽和水蒸気量×100。",
     "上昇気流で空気が膨張・冷却され露点に達すると雲ができる。"
   ],
   formulas:["湿度〔%〕＝水蒸気量〔g/m³〕÷飽和水蒸気量〔g/m³〕×100"],
   quiz:[
     {q:"空気中の水蒸気が冷やされて凝結し始める温度を何という？",opts:["沸点","融点","露点","飽和点"],a:2,e:"露点。その気温での飽和水蒸気量と実際の水蒸気量が等しくなる温度。"},
     {q:"ある気温での飽和水蒸気量が20g/m³、実際の水蒸気量が15g/m³のときの湿度は？",opts:["50 %","65 %","75 %","85 %"],a:2,e:"15÷20×100＝75%。"}
   ]},
  {id:"g5", grade:"中2", title:"前線と天気の変化",
   points:[
     "気圧が周囲より高いところが<span class='kw'>高気圧</span>（下降気流・晴れ・時計回りに吹き出す）。",
     "気圧が低いところが<span class='kw'>低気圧</span>（上昇気流・くもりや雨・反時計回りに吹き込む）。",
     "暖気と寒気の境目が前線。<span class='kw'>寒冷前線</span>は寒気が暖気の下にもぐりこみ、強い雨・短時間・通過後に気温低下。",
     "<span class='kw'>温暖前線</span>は暖気が寒気の上にはい上がり、広い範囲に弱い雨・長時間・通過後に気温上昇。",
     "偏西風により日本付近の天気は西から東へ移る。"
   ],
   formulas:[],

/* ================= 状態管理（localStorage） ================= */
const LS_KEY="chiba_rika_progress_v1";
let progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
function save(){localStorage.setItem(LS_KEY, JSON.stringify(progress));}

function allUnits(){
  return Object.keys(DATA).flatMap(f=>DATA[f].units.map(u=>u.id));
}
function updateProgress(){
  const all=allUnits();
  const done=all.filter(id=>progress[id]).length;
  const pct=all.length? Math.round(done/all.length*100):0;
  document.getElementById('progFill').style.width=pct+"%";
  document.getElementById('progText').textContent=`${done} / ${all.length} 単元 完了`;
}

/* ================= 描画 ================= */
function renderField(fkey){
  const f=DATA[fkey];
  let html=`<section id="sec-${fkey}" class="${fkey==='phys'?'active':''}">`;
  html+=`<div class="field-head"><span class="field-dot" style="background:${f.color}"></span><h2>${f.name}</h2><span class="cnt">${f.units.length}単元</span></div>`;
  f.units.forEach(u=>{
    const done=progress[u.id];
    html+=`<div class="unit" data-uid="${u.id}">
      <div class="unit-head">
        <span class="unit-grade">${u.grade}</span>
        <span class="unit-title">${u.title}</span>
        <span class="unit-check">${done?'✅':'⬜'}</span>
        <span class="unit-arrow">▶</span>
      </div>
      <div class="unit-body">
        <h3 class="sec">📘 要点整理</h3>
        <ul class="points">${u.points.map(p=>`<li>${p}</li>`).join('')}</ul>
        ${u.formulas.length?`<h3 class="sec">📐 覚える式</h3>${u.formulas.map(fm=>`<div class="fm">${fm}</div>`).join('')}`:''}
        <h3 class="sec">✏️ 確認問題</h3>
        <div class="quiz-box">${u.quiz.map((q,qi)=>renderQuiz(u.id,qi,q)).join('')}</div>
        <div class="row">
          <button class="btn primary mark-btn" data-uid="${u.id}">${done?'✅ 学習済み（解除）':'この単元を学習済みにする'}</button>
        </div>
      </div>
    </div>`;
  });
  html+=`</section>`;
  return html;
}
function renderQuiz(uid,qi,q){
  return `<div class="q" data-uid="${uid}" data-qi="${qi}">
    <div class="q-txt"><span class="num">Q${qi+1}.</span>${Chiba.lvTag(q.lv)}${q.q}</div>
    <div class="opts">${q.opts.map((o,oi)=>`<div class="opt" data-oi="${oi}">${o}</div>`).join('')}</div>
    <div class="expl"><b>解説：</b>${q.e}</div>
  </div>`;
}

function buildAll(){
  const c=document.getElementById('content');
  c.innerHTML = Object.keys(DATA).map(renderField).join('');
  updateProgress();
  bindEvents();
}

/* ================= イベント ================= */
function bindEvents(){
  // タブ
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
      t.classList.add('active');
      const f=t.dataset.f;
      if(f==='test'){document.getElementById('sec-test').classList.add('active'); renderTestIntro();}
      else if(f==='qa'){document.getElementById('sec-qa').classList.add('active'); if(!qaState)renderQAIntro();}
      else if(f==='kijutsu'){document.getElementById('sec-kijutsu').classList.add('active'); renderKijutsu();}
      else if(f==='keisan'){document.getElementById('sec-keisan').classList.add('active'); renderKeisan();}
      else if(f==='review'){document.getElementById('sec-review').classList.add('active'); Chiba.renderReview('reviewArea');}
      else document.getElementById('sec-'+f).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  // 単元の開閉
  document.querySelectorAll('.unit-head').forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle('open');
  });
  // クイズ回答
  document.querySelectorAll('#content .q').forEach(qEl=>{
    const uid=qEl.dataset.uid, qi=+qEl.dataset.qi;
    const qq=findQuiz(uid,qi), ans=qq.a;
    qEl.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        if(qEl.classList.contains('answered'))return;
        qEl.classList.add('answered');
        const chosen=+opt.dataset.oi;
        qEl.querySelectorAll('.opt').forEach((o,i)=>{
          o.classList.add('disabled');
          if(i===ans)o.classList.add('correct');
          if(i===chosen&&chosen!==ans)o.classList.add('wrong');
        });
        qEl.querySelector('.expl').classList.add('show');
        Chiba.record({id:`q:${uid}:${qi}`,type:'choice',q:qq.q,opts:qq.opts,a:qq.a,e:qq.e,field:unitField(uid),lv:qq.lv},chosen===ans);
      };
    });
  });
  // 学習済みボタン
  document.querySelectorAll('.mark-btn').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const uid=b.dataset.uid;
      progress[uid]=!progress[uid];
      save(); updateProgress();
      // 更新
      const unit=document.querySelector(`.unit[data-uid="${uid}"]`);
      unit.querySelector('.unit-check').textContent=progress[uid]?'✅':'⬜';
      b.textContent=progress[uid]?'✅ 学習済み（解除）':'この単元を学習済みにする';
    };
  });
}
function findQuiz(uid,qi){
  for(const f of Object.values(DATA)){
    const u=f.units.find(u=>u.id===uid);
    if(u)return u.quiz[qi];
  }
}
function unitField(uid){
  for(const f of Object.values(DATA)){
    if(f.units.some(u=>u.id===uid))return f.name;
  }
  return '';
}

let testState=null;
function renderTestIntro(){

        <div class="chip on" data-f="chem">化学</div>
        <div class="chip on" data-f="bio">生物</div>
        <div class="chip on" data-f="geo">地学</div>
      </div>
      <div class="row">
        <span style="font-size:13px;color:var(--sub)">問題数：</span>
        <div class="chips" id="countChips" style="margin:0">
          <div class="chip on" data-n="10">10問</div>
          <div class="chip" data-n="20">20問</div>
          <div class="chip" data-n="0">全問</div>
        </div>
      </div>
      <div class="row"><button class="btn primary" id="startTest">模試スタート</button></div>
      ${Chiba.moshiHistoryHtml()}
    </div>`;
  area.querySelectorAll('#fieldChips .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  area.querySelectorAll('#countChips .chip').forEach(c=>c.onclick=()=>{
    area.querySelectorAll('#countChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  });
  document.getElementById('startTest').onclick=startTest;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTest(){
  const fields=[...document.querySelectorAll('#fieldChips .chip.on')].map(c=>c.dataset.f);
  if(!fields.length){alert('分野を1つ以上選んでください');return;}
  const n=+document.querySelector('#countChips .chip.on').dataset.n;
  let pool=[];
  fields.forEach(fk=>DATA[fk].units.forEach(u=>u.quiz.forEach((q,qi)=>pool.push({...q,field:DATA[fk].name,id:`q:${u.id}:${qi}`}))));
  pool=shuffle(pool);
  if(n>0)pool=pool.slice(0,n);
  testState={pool,answers:new Array(pool.length).fill(null),submitted:false,timer:null};
  renderTestQuestions();
}
function renderTestQuestions(){
  const {pool}=testState;
  const area=document.getElementById('testArea');
  let html=`<div class="test-intro" style="padding:14px 18px"><h2 style="font-size:15px">模試（全${pool.length}問）</h2><p style="margin:0">すべて解いたら下の「採点する」を押そう。</p><div class="c-timer" id="testTimer"></div></div>`;
  pool.forEach((q,i)=>{
    html+=`<div class="q" data-i="${i}">
      <div class="qcount">${q.field}</div>
      <div class="q-txt"><span class="num">問${i+1}.</span>${q.q}</div>
      <div class="opts">${q.opts.map((o,oi)=>`<div class="opt" data-oi="${oi}">${o}</div>`).join('')}</div>
      <div class="expl"><b>解説：</b>${q.e}</div>
    </div>`;
  });
  html+=`<div class="row"><button class="btn primary" id="submitTest">採点する</button><button class="btn" id="cancelTest">やめる</button></div>`;
  area.innerHTML=html;
  area.querySelectorAll('.q').forEach(qEl=>{
    const i=+qEl.dataset.i;
    qEl.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        if(testState.submitted)return;
        qEl.querySelectorAll('.opt').forEach(o=>o.style.borderColor='');
        opt.style.borderColor='var(--accent)';
        testState.answers[i]=+opt.dataset.oi;
      };
    });
  });
  document.getElementById('submitTest').onclick=gradeTest;
  document.getElementById('cancelTest').onclick=()=>{if(testState.timer)testState.timer.stop();renderTestIntro();};
  testState.timer=Chiba.startTimer('testTimer',pool.length*75);
}
function gradeTest(){
  const {pool,answers}=testState;
  const unanswered=answers.filter(a=>a===null).length;
  if(unanswered>0 && !confirm(`未回答が${unanswered}問あります。このまま採点しますか？`))return;
  testState.submitted=true;
  const sec=testState.timer?testState.timer.stop():0;
  let correct=0;
  document.querySelectorAll('#testArea .q').forEach(qEl=>{
    const i=+qEl.dataset.i;const q=pool[i];
    const ok=answers[i]===q.a;
    if(ok)correct++;
    Chiba.record({id:q.id,type:'choice',q:q.q,opts:q.opts,a:q.a,e:q.e,field:q.field,lv:q.lv},ok);
    qEl.querySelectorAll('.opt').forEach((o,oi)=>{
      o.classList.add('disabled');o.style.borderColor='';
      if(oi===q.a)o.classList.add('correct');
      if(oi===answers[i]&&answers[i]!==q.a)o.classList.add('wrong');
    });
    qEl.querySelector('.expl').classList.add('show');
  });
  const pct=Math.round(correct/pool.length*100);
  Chiba.saveMoshi({t:Date.now(),score:correct,total:pool.length,sec});
  let msg;
  if(pct>=90)msg='素晴らしい！合格圏内。この調子で苦手分野を仕上げよう。';
  else if(pct>=70)msg='good！あと一歩。まちがえた単元の要点を読み直そう。';
  else if(pct>=50)msg='基礎はついてきた。解説をよく読んで復習しよう。';
  else msg='まずは各単元の「要点整理」から。くり返せば必ず伸びる！';
  const card=document.createElement('div');
  card.className='result-card';
  card.innerHTML=`<div class="result-score">${correct} / ${pool.length}</div>
    <div style="font-size:18px;font-weight:700;margin-top:4px">正答率 ${pct}%　<span style="font-size:13px;color:var(--sub)">⏱ ${Math.floor(sec/60)}分${sec%60}秒</span></div>
    <div class="result-msg">${msg}<br>まちがえた問題は「復習」タブへ自動で入りました。</div>
    ${Chiba.breakdownHtml(pool,answers)}
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn primary" id="retryTest">もう一度</button>
    </div>`;
  const area=document.getElementById('testArea');
  area.insertBefore(card, area.firstChild);
  document.getElementById('retryTest').onclick=renderTestIntro;
  window.scrollTo({top:0,behavior:'smooth'});
}

const QA_FIELDS={phys:"物理",chem:"化学",bio:"生物",geo:"地学"};
let qaState=null;
function renderQAIntro(){
  const area=document.getElementById('qaArea');
  area.innerHTML=`
    <div class="test-intro">
      <h2>🃏 一問一答</h2>
      <p>重要用語をフラッシュカードで暗記しよう。問題を見て頭の中で答えてから「答えを見る」。覚えたカードは消え、まちがえたカードはくり返し出てきます。</p>
      <div class="chips" id="qaFieldChips">
        <div class="chip on" data-f="phys">物理</div>
        <div class="chip on" data-f="chem">化学</div>
        <div class="chip on" data-f="bio">生物</div>
        <div class="chip on" data-f="geo">地学</div>
      </div>
      <div class="row"><button class="btn primary" id="startQA">スタート</button></div>
    </div>`;
  area.querySelectorAll('#qaFieldChips .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('startQA').onclick=startQA;
}
function startQA(){
  const fields=[...document.querySelectorAll('#qaFieldChips .chip.on')].map(c=>c.dataset.f);
  if(!fields.length){alert('分野を1つ以上選んでください');return;}
  let deck=[];
  fields.forEach(f=>QA[f].forEach((c,i)=>deck.push({...c,field:QA_FIELDS[f],id:`qa:${f}:${i}`})));
  deck=shuffle(deck);
  qaState={deck,total:deck.length,idx:0,ok:0,ng:0,revealed:false};
  renderQACard();
}
function renderQACard(){
  const s=qaState, area=document.getElementById('qaArea');
  if(s.deck.length===0){
    area.innerHTML=`<div class="result-card">
      <div class="result-score">🎉</div>
      <div style="font-size:18px;font-weight:700;margin-top:6px">全${s.total}枚 コンプリート！</div>
      <div class="result-msg">くり返して定着させよう。</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="qaAgain">もう一度</button></div>
    </div>`;
    document.getElementById('qaAgain').onclick=renderQAIntro;
    return;
  }
  const card=s.deck[0];
  area.innerHTML=`
    <div class="qa-stat">
      <div class="s-rem">のこり<b>${s.deck.length}</b></div>
      <div class="s-ok">覚えた<b>${s.ok}</b></div>
      <div class="s-ng">要復習<b>${s.ng}</b></div>
    </div>
    <div class="card" id="qaCard">
      <div class="card-field">${card.field}</div>
      <div class="card-q">${card.q}</div>
      <div class="card-a">${card.a}</div>
      <div class="card-hint" id="qaHint">タップして答えを見る</div>
    </div>
    <div id="qaControls"></div>`;
  const cardEl=document.getElementById('qaCard');
  const reveal=()=>{
    if(s.revealed)return; s.revealed=true;
    cardEl.classList.add('revealed');
    document.getElementById('qaHint').style.display='none';
    document.getElementById('qaControls').innerHTML=`
      <div class="grade-row">
        <button class="btn ng" id="qaNG">× もう一度</button>
        <button class="btn ok" id="qaOK">✓ 覚えた</button>
      </div>`;
    document.getElementById('qaOK').onclick=()=>gradeCard(true);
    document.getElementById('qaNG').onclick=()=>gradeCard(false);
  };
  cardEl.onclick=reveal;
}
function gradeCard(ok){
  const s=qaState;
  const card=s.deck.shift();
  s.revealed=false;
  Chiba.record({id:card.id,type:'flash',q:card.q,a:card.a,field:card.field},ok);
  if(ok){s.ok++;}
  else{s.ng++; s.deck.push(card);} // まちがえたら山の最後へ戻す
  renderQACard();
}

function renderKeisan(){
  const area=document.getElementById('keisanArea');
  let html=`<div class="test-intro">
    <h2>🧮 計算特訓（差がつく計算問題）</h2>
    <p style="margin:0">理科の上位層の失点は<b>ほぼ計算</b>。公式に入れる前に「単位をそろえる」（分→秒、cm²→m²）だけで正答率が跳ね上がる。解説の<b>解法ステップ</b>まで読んで、同じ手順を自分の言葉で言えるようにしよう。まちがえた問題は「復習」タブへ。</p>
  </div>`;
  let lastF='';
  KEISAN.forEach((q,i)=>{
    if(q.f!==lastF){
      lastF=q.f;
      html+=`<div class="field-head" style="margin-top:16px"><h2 style="font-size:15px">${q.f}の計算</h2></div>`;
    }
    html+=`<div class="q ks-q" data-i="${i}">
      <div class="q-txt"><span class="num">Q${i+1}.</span>${Chiba.lvTag(q.lv)}${q.q}</div>
      <div class="opts">${q.opts.map((o,oi)=>`<div class="opt" data-oi="${oi}">${o}</div>`).join('')}</div>
      <div class="expl"><b>解法：</b>${q.e}</div>
    </div>`;
  });
  area.innerHTML=html;
  area.querySelectorAll('.ks-q').forEach(qEl=>{
    const i=+qEl.dataset.i, q=KEISAN[i];
    qEl.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        if(qEl.classList.contains('answered'))return;
        qEl.classList.add('answered');
        const chosen=+opt.dataset.oi, ok=chosen===q.a;
        qEl.querySelectorAll('.opt').forEach((o,oi)=>{
          o.classList.add('disabled');
          if(oi===q.a)o.classList.add('correct');
          if(oi===chosen&&!ok)o.classList.add('wrong');
        });
        qEl.querySelector('.expl').classList.add('show');
        Chiba.record({id:`ks:${i}`,type:'choice',q:`【計算】${q.q}`,opts:q.opts,a:q.a,e:q.e,field:'計算・'+q.f,lv:q.lv},ok);
      };
    });
  });
}
